[pytest]
# Pull requests and pushes run the fast suite (about 10 s on two cores). The slow suite (video renders and whole
# pipelines, minutes) runs with:  python -m pytest -m slow   (see .github/workflows/ci-slow.yml)
addopts = -m "not slow" -n auto
markers =
    slow: renders video or runs a whole pipeline (minutes); run on main, nightly and on demand, not on every pull request
