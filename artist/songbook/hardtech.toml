[Final Chorus]
Honest wounds heal, the hidden ones spread
Truth was the fire that burned what was dead
You showed me your scar, so I showed you mine
Blood in the open has closed in time
I'd rather bleed loud than live in a lie
Honest wounds heal, and I'm watching them dry

[Outro]
