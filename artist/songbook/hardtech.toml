[[songs]]
id = "five-stars-for-what"
title = "Five Stars for What?"
form = "revolt"
model = "A"
groups = ["hardtech"]
voice = "hoarse male tenor in his thirties with a Mumbai street rasp, rapid double-time shouting locked to the kick, real breaths between bars"
about = "a food delivery rider climbs nine floors in the rain for three stars, then two hundred riders ride slow through the city together"
lyrics = """
[Intro]
Rain in the visor, nine floors up, so tell me, five stars for what?

[Verse 1]
Eleven at night and the rain's coming sideways, I'm cutting through somebody's lane
Forty-one orders since breakfast, my knees are on fire, the scooter is dragging its chain
Nine floors of stairs 'cause the lift has a sign on it, soup in the bag, a hole in my shoe
You open the door in a towel on a call, take the bag, never once look at who
Three stars 'cause the fries had gone soft, like I fried them myself on the seat of the bike
Three stars is a fine, and the fine is the dinner my daughter was having tonight
I eat standing up at a red traffic light, half a samosa, then gone on the green
Smiling for stars like a dog for a biscuit, the wettest clean shirt that you've seen
The voice in my helmet says, "Customer's king," so I bow to a towel in a hall
Hungry man carries the feast up the stairs, and the full man complains of the salt

[Hook]
Five stars for what?
Five stars for what?

[Drop]
Ride slow, ride slow

[Verse 2]
Tuesday a cab didn't see him, now Raju's in plaster, they sent him a card saying "care"
Wednesday we met where the flyover drips, two hundred wet jackets, nobody scared
Thursday at nine every phone in the city goes dead in a pocket at once
Kitchens keep ringing, the paneer is sweating, the ice cream is melting, it's done
We ride in a line at a walking pace, horns going off like a wedding band
Aunties on balconies clapping, a cop tapping time on his tank with his hand
You wanted us faster, we gave you the slowest parade that the ring road has seen
Two hundred visors, two hundred names that you never asked, now on the evening screen
Not asking for stars, I am asking for brakes and a rupee for every stair
Not asking for love, just look in my eyes when you take what I carried up there

[Hook]
Five stars for what?
Five stars for who?

[Outro]
Door opens
You look up
"Thank you, bhaiya"
That's the five
Ride home
"""

[[songs]]
id = "walls-dont-remember"
title = "Walls Don't Remember"
form = "argument"
model = "B"
groups = ["hardtech"]
voice = "soft-spoken male baritone, warm and slightly nasal, half-sung verses that open into a full chest voice on the chorus"
about = "a son argues with himself over selling his late mother's flat and decides what he can carry out of it"
lyrics = """
[Intro]
There's a pencil line on the kitchen door with our heights from every June
I stood against it with the agent waiting, and I didn't leave till noon

[Verse 1]
Mum's been gone eleven months, the flat's been locked for ten
The broker calls each Sunday, "Sir, this price won't come again"
My heart says, "That's her cooker, that's the step where Papa fell"
My mind says, "That's a leaking roof, and tax, and rusted locks as well"
I pay a maid to sweep a house that nobody walks through
I pay a guard to watch the dust, the calendar still on oh-two
My wife says, "We can't keep a museum on a Pune salary"
My sister says, "You sell it, you sell her," and hangs up on me
Was I loyal, or afraid of having no door to go back to?
Is keeping it a way to love her, or to not get through?
One voice holds the keys like a rosary, one adds up the cost
Both of them are grieving, both are scared of what gets lost

[Chorus]
Walls don't remember, the paint only peels
It's the people who carry the way a home feels
I can lock up a kitchen, I can't lock up a song
She never lived in the bricks, she lived in us all along
So why do I pay for a door that I'm scared to unlock?
Walls don't remember, but I'm still afraid to stop

[Drop]

[Verse 2]
I went back on her birthday with a broom and a cardboard box
Found her glasses in the drawer beside the matches and the locks
A tiffin with my name in shaky capital letters
A list inside the cupboard, "less chilli, he gets fevers"
I sat down where the sofa was, I laughed until I cried
'Cause the walls had heard it all and kept none of it inside
The neighbour's girl came in, the one who brought Mum milk each day
She rolled a crooked roti on the counter, Mum's exact way
And I saw my mother's wrist in hers, the turn, the flour, the hurry
Mum was in her hands, and the house was only bricks and worry
My heart still says, "Don't sell the floor she walked on every day"
My mind says, "She'd have sold it in a week if you'd be okay"

[Chorus]
Walls don't remember, the paint only peels
It's the people who carry the way a home feels
I can lock up a kitchen, I can't lock up a song
She never lived in the bricks, she lived in us all along
So why do I pay for a door that I'm scared to unlock?
Walls don't remember, but I'm still afraid to stop

[Bridge]
Take the door frame with the pencil lines
Leave the leaking roof behind
Take the cooker, take the bangles
Sell the bricks
Keep her

[Final Chorus]
Walls don't remember, so I'll let the paint peel
I'm the one who carries the way a home feels
I can sell the kitchen and still keep the song
She never lived in the bricks, she lived in us all along
So I'm handing the key to a family of four
Walls don't remember, but their kids will, on this floor

[Outro]
There's a pencil line on a door in my flat in Pune now
My daughter stands against it every June, and I show her how
"""

[[songs]]
id = "wheres-the-stage"
title = "Where's the Stage?"
form = "story"
model = "A"
groups = ["hardtech"]
voice = "bright young female mezzo with a giggle in it, quick chatty double-time verses, a terrace-chant hook she leads like a team captain"
about = "six friends on a night bus to a Goa festival break down on a hill road and throw the party at a roadside dhaba instead"
lyrics = """
[Intro]
Wristbands on, bus dead on the ghat, so tell me, where's the stage?

[Verse 1]
Six of us packed on a sleeper bus, Pune to Goa, one charger and chikki to share
Meher's got glitter all over her eyebrows, Kabir's in sunglasses, nobody cares
Tickets we saved for since March, skipping lunches, walking to college in heat
Four hundred kilometres to stand at a barrier, jumping until we can't feel our feet
Then on the ghat there's a bang and a hiss, and the driver gets out with a bidi
Says, "Mechanic comes morning," and smiles like it's simple, like waiting is easy
Fog on the hairpins, a dhaba with one yellow bulb and a dog and a man frying eggs
Phones on two percent, the lineup is starting without us, Meher cries on Kabir's legs
Eight months of waiting for one single night, and the night's on the far side of a hill
Dhaba man flips us an egg and he says, "You don't chase a good night, you build it, so build"

[Hook]
Where's the stage?
Right here, right here

[Drop]
Kabir, turn it up

[Verse 2]
Kabir puts the speaker up on the bus roof, the driver wires it in, swearing
Truckers pull over to see why the hill's shaking, one with a dholak, one staring
A hundred and sixty on a speaker the size of a tiffin, the bass off the rock
Meher's up on a crate with her arms in the fog, and she's counting us into the drop
The dog's going wild and the egg man is jumping, a trucker is teaching a step
Dust on the wristbands that never got scanned, and nobody has a regret
Four in the morning the mechanic shows up, and he dances before the repair
Nobody filmed it, the phones were all dead, so it lives in the people there

[Hook]
Where's the stage?
Right here, right here

[Outro]
Sunrise on the ghat
Wristbands never scanned
We never made it
Best night we ever had
Where's the stage? Under us
"""

[[songs]]
id = "i-was-never-busy"
title = "I Was Never Busy"
form = "confession"
model = "B"
groups = ["hardtech"]
voice = "breathy male tenor, close and hushed in the verses, cracking open into a full belt on the final chorus"
about = "a man admits to his oldest friend that three years of 'I'm busy' were shame, then gets on a bus to his door"
lyrics = """
[Intro]
Your name still sits at the top of my phone with a missed call from March
I watched it light up on the table and I let it ring out in the dark

[Verse 1]
I told you I was busy when you got the job in Bangalore
I said that I was busy when you rang me from the hospital floor
I sent a heart instead of coming when your father passed away
I said the trains were full that week, I sat at home all day
I watched your wedding on a story, thirty seconds, gone
I paused it when you scanned the crowd like you were missing someone
Here's the thing I never said, the thing I didn't want to show
I wasn't busy, I was ashamed of how slow I was to grow
You were building something real, I was sleeping until two
When your name came up I felt the size of what I didn't do
My pride says, "Keep it quiet, he's got friends, he doesn't need you there"
My gut says, "Every week you wait, it costs another year"
So a short call turned into a long one I could never make
And I called it being busy, 'cause busy's easy to fake

[Chorus]
I was never busy, I was scared
Scared you'd see the mess and still be there
Scared you'd ask me how I'm doing and I'd have to say it straight
So I let a whole year happen and I called it running late
I was never busy, I was small
And the easiest thing to do was not to call

[Drop]

[Verse 2]
Class eleven, cricket nets, you bowled me, bought me Maggi after
We swore we'd share a flat in Bombay, wrote it on a desk in marker
You paid my fees the month my mother's shop shut down, and kept it quiet
I found out from your sister, and I paid you back with silence
Now I'm thirty-one, I've got a job that doesn't need a tie
A rented room, a plant I've kept alive, I'm learning how to try
I'm not calling 'cause I'm fixed now, I'm not calling with a win
I miss you, that's the reason, and I'm done not letting you in
A friend you're hiding from is just a door you're painting shut
Every coat I put on it locked me in, not you out
My pride still says, "He's moved on, you'll just embarrass him again"
My gut says, "Then embarrass him, he's still your oldest friend"

[Chorus]
I was never busy, I was scared
Scared you'd see the mess and still be there
Scared you'd ask me how I'm doing and I'd have to say it straight
So I let a whole year happen and I called it running late
I was never busy, I was small
And the easiest thing to do was not to call

[Bridge]
No speech, no gift, no clever line
Just a bus to Bangalore at nine
If you shut the door, I'll understand
But I'm knocking with my own hand

[Final Chorus]
I was never busy, I was scared
Now I'm standing at your gate, and I'm finally here
If you ask me how I'm doing, I will tell you, I'll say it straight
I let three whole years happen, and I'm sorry that I'm late
I was never busy, I was small
Now I'm big enough to knock, so I came, I didn't call

[Outro]
Your name lights up my phone again, the missed call from March is gone
You're in the doorway, phone still in your hand, saying, "Come on"
"""

[[songs]]
id = "the-car-is-mine"
title = "The Car Is Mine"
form = "celebration"
model = "A"
groups = ["hardtech"]
voice = "big-chested male baritone in his fifties, gravelly and proud, barked double-time bars like a wedding band leader, a full-throat shout on the hook"
about = "a cab driver pays the last loan installment after eight years and drives his whole family to the sea at midnight"
lyrics = """
[Intro]
Last stamp on the passbook, Sunita, say it with me, the car is mine

[Verse 1]
Eight years of nights at the airport, I slept with the seat back, the meter still on
Ninety-six payments, the fifth of the month, in the queue at the bank before dawn
Drunk boys in the back, a bride with her mascara running, a surgeon who cried on the phone
Took every one of them home at three in the morning, and never once took myself home
Sunita stitched blouses at night to cover the months when the airport went quiet and slow
Chhotu wore his cousin's old shoes to sports day and smiled like he didn't know
Every scratch on the bumper's a bill, and the dent is the monsoon of twenty-one
Every rupee went into the seat, and the seat was the bank's till the debt was gone
Ma said, "A loan is a guest who eats first and leaves last," and ours ate for eight years
Today a clerk stamped one red word, and I stood at his window in tears

[Hook]
The car is mine
Say it loud, the car is mine

[Drop]
Horn, horn, horn

[Verse 2]
Midnight I wake up the house, Sunita in slippers, Chhotu still holding his pillow
Ma up front with marigolds, tying a garland across the glass like a halo
Meter switched off for the first time in eight years, the little red flag folded down
Nobody's paying and nobody's flying, we're taking the long way through town
Past every hotel where I waited, the bridge where I changed a flat in the rain
Sea road at two, all the windows down, horn like a band at a wedding again
Chhotu climbs onto my lap and he steers, and the cops at the corner just grin
Sunita is laughing so hard she is crying, "Eight years and the car finally lets us in"
Waves on the bonnet, the radio up, a hundred and sixty shaking the door
I drove every stranger in Mumbai to bed, now I drive us four, nobody more

[Hook]
The car is mine
Say it loud, the car is ours

[Outro]
Passbook on the dashboard
Last page
Paid
Not mine
Ours
"""

[[songs]]
id = "why-did-you-stay"
title = "Why Did You Stay?"
form = "dialogue"
model = "B"
groups = ["hardtech"]
voice = "duet of a husky male baritone and a clear bright female mezzo, trading verses like a long distance phone call, meeting in close harmony on the chorus"
about = "a brother abroad and the sister who stayed home with their parents finally ask each other why, and swap places for one July"
lyrics = """
[Intro]
Two cups of chai on two continents, both going cold on the call
You in a car park in Toronto, me on the stairs in the hall

[Verse 1]
You pick up on the first ring, like you have for nine years straight
I'm parked in Toronto snow, you're counting Papa's pills on a plate
I send the money every month, a photo of the lake
You send a voice note, Mummy laughing, I play it till it aches
I hear the news when it's over, the stent, the scan, the scare
You tell it like the weather, like you weren't the one there
Everybody calls me lucky, the boy who got away
Nobody asks you anything, they just assume you'll stay
So I'm asking you tonight, and I'm asking it for real
You topped the class, you had the offer letter, you had the will
Why did you stay when you could have gone ahead of me?
Was it love, or did we leave you with no other way to be?

[Chorus]
Why did you stay? Why did you go?
Two kids from one small kitchen with the same old radio
One of us got the airport, one of us got the gate
One of us got the distance, one of us got the weight
Why did you stay? Why did you go?
Maybe both of us were brave and neither one said so

[Drop]

[Verse 2]
You want the truth, so here it is, I'm thirty-four and tired
I teach where we learned to read, I sing with the same old choir
I know Papa's sugar levels and the state of Mummy's knees
I stayed 'cause somebody had to, you'd already gone overseas
I stayed because I was the daughter, here that's just a fact
But I stayed 'cause I was scared too, and nobody told me to pack
It's easier to be needed than to fail in someplace strange
It's easier to hold the plate than find out you can change
I've watched your life on a screen, the snow, the friends you've got
I've hated you a little, and I've loved you a lot
Everybody calls you lucky, but I hear you on the phone
You've got a whole new country, and you eat dinner alone

[Chorus]
Why did you stay? Why did you go?
Two kids from one small kitchen with the same old radio
One of us got the airport, one of us got the gate
One of us got the distance, one of us got the weight
Why did you stay? Why did you go?
Maybe both of us were brave and neither one said so

[Bridge]
"One month," you say, "I'll take July"
"I've never been on a plane," I reply
"Then go," you say, "go see the lake"
"I'll count the pills, I'll stay awake"

[Final Chorus]
Why did you stay? Why did you go?
Two kids from one small kitchen, finally saying so
This July you take the airport, and I'm the one at the gate
You get to feel the distance, and I get to hold the weight
Why did you stay? Why did you go?
Both of us were brave, and now we've both said so

[Outro]
Two cups of chai in one kitchen, July rain against the wall
Your boarding pass on the fridge, and Mummy laughing down the hall
"""

[[songs]]
id = "am-i-too-loud"
title = "Am I Too Loud?"
form = "revolt"
model = "A"
groups = ["hardtech"]
voice = "raw female alto with a punk edge, clipped rapid-fire verses, a full-throat scream on the hook that the crowd throws back"
about = "a woman told since class four to keep her voice down finds it again in the front row of a festival"
lyrics = """
[Intro]
Teacher, aunty, manager, all of you, tell me, am I too loud?

[Verse 1]
Class four, sat on my hands 'cause I answered before Sister finished the question
Class nine, I laughed in the prayer line, a letter went home, Papa called it a lesson
Aunties at weddings, "A girl should be soft," while their husbands were yelling the score
Twenty-two, hired, the manager smiled, "Bring a little less of you through the door"
I learned to say sorry for sneezing, I learned how to whisper my name on a call
I learned how to laugh with my hand on my mouth like a secret I stole from the wall
Swallowed my words till they piled in my chest like the bricks on a site in July
Headaches at night, my jaw on the pillow, a fist I could never untie
"Be grateful, be good, keep it down," said the voice that I thought was my own all along
But a bird that is told it's too loud doesn't stop being a bird, it just forgets the song

[Hook]
Am I too loud?
Am I too loud?

[Drop]
Louder

[Verse 2]
Then Saturday comes with a field full of people, the bass like a door kicked in
Fifty thousand are screaming the words, and nobody's sorry for the din
I open my mouth and a sound I've kept since class four comes out of me whole
The girl next to me screams back, then her sister, and then the whole of the row
Every sorry I swallowed comes up as a roar, every whisper comes due
The nun and the aunties, the manager's smile, I am screaming them all the way through
My throat is on fire, my jaw is unlocked, and my hands are not under me now
Ten years of a library voice in my mouth, and I'm spitting it out on the crowd
Monday I'll walk in the office and talk in a voice that the back row can hear
If that is too loud then the room is too small, and I'm done making myself disappear

[Hook]
Am I too loud?
Not loud enough

[Outro]
Class four
Hands under me
Not anymore
Not loud enough
Louder
"""

[[songs]]
id = "dont-call-me-daily"
title = "Don't Call Me Daily"
form = "letter"
model = "B"
groups = ["hardtech"]
voice = "warm female contralto in her forties, unhurried and smoky in the low register, lifting into a clear ringing chorus"
about = "a single mother writes to her daughter leaving for college, asking her not to call every day, and learns to let go herself"
lyrics = """
[Intro]
Your school shoes are still under the bench by the door, polished for nobody
I'm writing on the back of your old timetable, so read it slowly

[Verse 1]
You leave on Thursday, two suitcases, the pickle jar you hate
I've packed you Crocin, safety pins, three aunties' numbers, just in case
You'll laugh at me for labelled socks and "eat" on every pack
But a label is a hug, my girl, that travels on your back
My heart says, "Make her call at ten and send a photo of her plate"
My head says, "You were nineteen once, and no one watched your gate"
When I left for Pune, Nani couldn't read the letters that I sent
The postman's son would read them out, she'd nod, "She's fine," content
And that one month of quiet was the room I grew inside
I burned the rice, I lost the rent, I found my feet, my stride
So here's the thing I'm scared to write, the thing I mean the most
Don't call me daily, I won't be a duty or a ghost

[Chorus]
Don't call me daily, call me when it's real
When your heart gets broken, when you pass, or need a proper meal
Call me when you're lost, or when you've found it on your own
But don't spend every evening checking in with me by phone
Don't call me daily, I will let you be
A pot that's always opened never boils, believe me

[Drop]

[Verse 2]
I read your diary once, the year that you turned fifteen
I put it back the way I found it, but I've never felt so mean
I tracked your phone the night you went to Neha's and you didn't say
I watched a blue dot on a map until it moved, then prayed
I've been your alarm, your bank, your doctor, weather on the hour
I've stood at the window every evening like a tower
And the truth is it was never just your safety that I kept
It was me, afraid of a quiet house, the night your father left
My heart still says, "Just text her once, a heart, a little 'how's your day'"
My head says, "Let her miss you, you can't miss what never goes away"
That's not me loving less, my girl, that's love with the door ajar
So you can come and go and know exactly where we are

[Chorus]
Don't call me daily, call me when it's real
When your heart gets broken, when you pass, or need a proper meal
Call me when you're lost, or when you've found it on your own
But don't spend every evening checking in with me by phone
Don't call me daily, I will let you be
A pot that's always opened never boils, believe me

[Bridge]
No curfew, no photo of your plate
No "reached safe?" at a quarter past eight
Just Sundays, if you want
And the porch light on

[Final Chorus]
Don't call me daily, call me when it's real
When you've won or lost or met someone, or when you need to heal
Call me when you're lost, or when you've found it on your own
I'll be out at singing class, so leave a message on the phone
Don't call me daily, I will let you be
I've lifted off the lid, and what's boiling now is me

[Outro]
Your school shoes aren't under the bench by the door anymore
I gave them to the girl next door, she'll need them more
"""

[[songs]]
id = "who-finishes-last"
title = "Who Finishes Last?"
form = "story"
model = "A"
groups = ["hardtech"]
voice = "weathered male tenor in his late fifties, breathy, catching air between bars like a runner, a defiant shout on the hook"
about = "a fifty-eight-year-old auto driver runs his first half marathon, comes last, and the volunteers run him home"
lyrics = """
[Intro]
Five in the morning in borrowed shoes, Pooja, who finishes last?

[Verse 1]
Fifty-eight years I've been driving an auto from Noida to Okhla in smoke
Pooja signed me up on her phone for a laugh, but I didn't take it as a joke
Six months of running the colony at four with the milkman, the dogs on my heels
Knees like a cupboard door, creaking and banging, my chest going round like the wheels
Gun goes at six, eighteen thousand pour out like a river let out of a dam
Kenyans are gone in a minute, the college boys gone in an hour, here I am
Kilometre twelve and the water stalls packing, bananas stacked up in a van
Sweeper bus crawling behind me, the driver leans out, "Uncle, get in while you can"
Twenty-one kilometres is one long auto ride, and today the meter is me
Slow is still moving, my father would say, and the tortoise still gets to the sea

[Hook]
Who finishes last?
Who finishes last?

[Drop]
Left foot, right foot

[Verse 2]
Kilometre eighteen and the barriers are coming down, volunteers stacking them high
One girl with a megaphone stops, and she shouts out my number up to the sky
Then two of them jog right beside me, then ten, then the boys who were folding the chairs
A sweeper drops his broom and runs in chappals, the bus honking out the prayers
Kilometre twenty, my legs are cement and my heart's going one-sixty-five
Pooja's at the finish, three fifty-one, and she's screaming, "Papa's alive"
They hold up the tape that they'd already rolled, they unroll it again just for me
And the man who came first four hours ago is still waiting with his medal and tea
The megaphone girl hangs the last medal on me, says it's the heaviest one
Last isn't losing, last is the one still out on the road when the rest are done

[Hook]
Who finishes last?
The one who finished

[Outro]
Borrowed shoes
Last medal
Pooja's hand
Three fifty-one
Still counts
"""

