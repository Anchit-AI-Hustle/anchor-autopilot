[[songs]]
id = "burn-the-blueprint"
title = "Burn The Blueprint"
family = "defiance"
form = "revolt"
model = "A"
groups = ["hardtech"]
voice = "raw male tenor rave shouter with gravel at the top of his range, double time bars punched onto the hard techno kick, real breaths between lines"
about = "I tear up the plan that was drawn for my life, set it alight in front of the crowd and start building my own"
lyrics = """
[Intro]
They drew my whole life on a sheet in pencil, so tonight I burn the blueprint

[Verse 1]
They measured my steps with a ruler of iron and told me the road had been laid
Every wall had a number, every door had a lock, every lock had a key I never made
Stand in the line, keep your voice in your pocket, they said it would keep me alive
But a heart in a box is a heart on a fuse and I felt mine counting down from five
There's a crack in the ceiling, the bass in the floor is shaking the dust off the beams
And the paper they gave me is folded so tight that it's tearing apart at the seams
So I strike the first match on the heel of my boot and I hold it up high in the air
Let the edges go orange, the corners go black, let the ink of their promises tear
Every line that they drew is a rope I untie, every rule is a brick I can throw
Every name that they gave me goes up in the smoke and I'm watching the ashes glow

[Hook]
Burn the blueprint
Burn the blueprint, build it again

[Drop]
Light it up

[Verse 2]
Now the fire is a flag and the floor is an army that rises and roars at the flame
They wanted me kneeling, they wanted me grateful, they wanted me quiet and tame
I kicked in the door with the blood on my knuckles, I walked through the glass and the rain
I'm the hammer, the anvil, the sparks on the steel and I'm forging a brand new frame
No more permission, no more petition, I'm drawing the map on the back of my hand
Every step that I take is a stake in the ground and the border is where I stand
Give me the rubble, I'll give you a tower, give me the ashes, I'll give you a sky
Every kick is a hammer, a nail in their plan, and the hammer is keeping me alive
They can rebuild every wall in the morning, I'll be up on the top with a light
And the plans that they made for the rest of my days are the smoke in the air tonight

[Hook]
Burn the blueprint
Burn the blueprint, we build it again

[Outro]
Paper burns
Ink runs
The lines are gone
Draw your own
Burn the blueprint
"""

