voice = "clear young male baritone, earnest and conversational, sung-rap verses that lift into a wide open chorus"
about = "a man who quit a salaried job argues with his father and himself about safety, until the man next door is laid off"
lyrics = """
[Intro]
My ID card's still in the drawer with the lanyard wound around it tight
Papa keeps it there like a photograph, in case I come home one night

[Verse 1]
I left the office on a Monday with a plant and a box
Papa didn't say a word at dinner, just kept winding up the clocks
"Thirty-two years at one desk," he said, "and I never missed a rent"
"A salary's a roof, beta, and a dream is just a tent"
My mind says, "He's not wrong, you've got a loan, seven months left"
My heart says, "You were fading there in a nice shirt, neatly pressed"
One counts the cash each morning, one the years I've got
One says, "Be grateful for the chair," one says, "The chair's what you fought"
Was I brave, or was I bored and calling it a calling?
Is it vision if it works, and only madness if I'm falling?
I wake at four and do the sums, the rent, the fees, the loan
Then build until the sun is high, and leave the doubt alone

[Chorus]
Safe is a story they tell you at twenty-two
A desk and a pension and somebody else's view
But the floor can fall out from a building too
Safe is a story, and I'm writing something true
So I'll count every rupee and I'll sleep with the fear
Safe is a story, but the work is real, and it's here

[Drop]

[Verse 2]
In March our neighbour, Sharma uncle, twenty-eight years at a bank
Got a meeting on a Friday, a cake, a thank-you card left blank
