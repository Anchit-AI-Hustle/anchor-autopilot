And a guard took a step and the throne took a breath and I felt every fear that I had
But a crown only shines if the room's on its knees, it's a mirror, it's only reflecting the bow
Take away all the bending and what have you got, just a chair and a man and a frown
Then a girl at my side put her hand on the floor and she pushed and she rose to her feet
And a man by the wall did the same, then a dozen, a hundred, the rhythm, the beat
