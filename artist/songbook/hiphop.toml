[[songs]]
id = "who-pressed-your-collar"
title = "Who Pressed Your Collar"
form = "story"
groups = ["hiphop"]
model = "A"
voice = "warm husky male baritone in his thirties, double-time flow that stays clear at speed, hook sung in a soft open chest voice, real breaths"
about = "a man with his name on a glass door who finally says out loud that his mother ironed the whole lane's clothes before dawn to pay his fees"
lyrics = """
[Intro]
Glass door, crisp shirt, firm handshake, so tell me, who pressed your collar?

[Verse 1]
Four in the morning, crows on the wire, and the coal in the iron is glowing and loud
Cotton in mountains from every flat on the lane, she was pressing the creases of town
Doctor's white coat and a bride's silk sari, a teacher's starched shirt for the Sunday crowd
I'd fake my sleep on the mat by the stove, counting her pile like I wasn't allowed
Forty shirts was eighty rupees, eighty rupees was a schoolbook, a bus pass, a smile
Burns on her wrist like the bangles she never could buy, and she'd laugh, "Beta, it's style"
Fees due on Friday, we came up four hundred short and the clerk had my name on a list
So she took on a wedding, ninety kurtas, a night with no sleep and the coal and the hiss
Paid the clerk in coins still warm from her palm, never told me the sleep that she missed

[Hook]
Who pressed your collar before the sun came up?
Who smoothed out the whole world so you'd look like enough?

[Drop]
Steam, press, fold

[Verse 2]
Now my name's on a glass door, my collar stays sharp in the meetings all day
Boss calls me polished, the board nodding, they think I came out of the box this way
Never said coal, never said colony, never said, "My mother pressed shirts for pay"
I was ironing her out of my story, the one little crease that I folded away
Then she called on a Tuesday, voice thin as the steam, "Beta, the iron just died"
Seventy-two, still pressing for neighbours, she didn't need money, she needed her pride
Heart at a hundred and eighty, I drove through the horns on every side
Rolled up the sleeves of a two lakh suit and I pressed every shirt by her side
Monday I stood in the boardroom and told them whose hands made the man that they hired

[Hook]
Who pressed your collar before the sun came up?
Who smoothed out the whole world so you'd look like enough?

[Outro]
Glass door, crisp shirt
Ask me again
She did
Ma did
Sleep in, Ma
"""

[[songs]]
id = "presence-is-the-proof"
title = "Presence Is The Proof"
form = "argument"
groups = ["hiphop"]
model = "B"
voice = "bright clear female alto with a slight Mumbai lilt, conversational half-time sung rap, chorus sung full and warm, small catches in the voice"
about = "a woman deciding what to do with a fifteen-year friend who shows up for every party and none of the hard days"
lyrics = """
[Intro]
Forty photos on my phone, your arm around my shoulder
Not one of them in the hospital, where the nights got colder

[Verse 1]
You were front row at my birthday, right beside the cake
Gone on moving day, six floors, my back about to break
Tagged in every wedding, every launch, every rooftop view
Tagged in every good night, and missing every bad one too
Dad was in the ICU, you liked the post and wrote "stay strong"
Then you posted from a concert while I signed forms all night long
Your love has perfect lighting, but it only works by day
When the sun goes down it finds a reason to be on its way
My heart says, "Some people freeze in hallways, some panic at pain"
My head says, "Fifteen years of freezing is a choice you make again"
Is a friend the one who laughs with you, or stays when laughing ends?
Can you love somebody for the summers and still call them friends?

[Chorus]
Anybody can be in the picture, anybody can raise a glass
Anybody can dance at the wedding, but who stays when the good days pass?
I don't need you to fix it, I don't need the words to say
Just sit in the plastic chair with me, and stay
Love you only bring to parties is a costume, not the truth
Friendship isn't in the photo, presence is the proof

[Drop]

[Verse 2]
But I scroll back to Class Six, you split your tiffin every lunch
Mum was on the night shift, and you never asked me much
You walked me home the long way past the temple and the train
Taught me how to whistle with two fingers in the rain
Maybe you're a fair-weather friend, but you were my first weather
Maybe people come in seasons, you were summer, not forever
My heart says, "Don't drop a friend who can't do hospital halls"
My head says, "You've saved him a seat for years, and he never calls"
Is it fair to ask a summer friend to stand out in the rain?
Is it fair to me to keep on waiting at that door again?
I mixed up being invited with being held, and let it slide
The people in the picture aren't always the ones by your side

[Chorus]
Anybody can be in the picture, anybody can raise a glass
Anybody can dance at the wedding, but who stays when the good days pass?
I don't need you to fix it, I don't need the words to say
Just sit in the plastic chair with me, and stay
Love you only bring to parties is a costume, not the truth
Friendship isn't in the photo, presence is the proof

[Bridge]
I'm not deleting you
I'm just not saving a seat anymore
Show up or don't
I'll know either way

[Final Chorus]
You can stay inside the picture, you can still come raise a glass
I'm just not waiting by the ward door for a friend who won't come past
I don't need you to fix it, I don't need the words to say
But a chair that stays empty is an answer anyway
So I'm keeping every photo, and I'm keeping what is true
Love can smile in every picture, presence is the proof

[Outro]
Forty photos on my phone, and I'm keeping every one
I just know which ones were sunlight, and who stayed when it was gone
"""

[[songs]]
id = "whose-dream-am-i"
title = "Whose Dream Am I"
form = "revolt"
groups = ["hiphop"]
model = "A"
voice = "fierce bright young female rapper, loud high chest voice, rapid crisp double-time, hook sung open and big like a shout across a terrace"
about = "a student who wants to draw standing up to her family, her coaching centre and every aunty who only asks her rank"
lyrics = """
[Intro]
Rank on the fridge and a garland in the paper, so tell me, whose dream am I?

[Verse 1]
Coaching at six, then school at nine, then coaching at four till the sky turns black
Mock test on the fridge like a ransom note, my name in red ink and a cross on the back
Aunty at the wedding skips the hello, leans in with a samosa and whispers, "What rank?"
Like I'm a fixed deposit in a pigtail and she's checking the rate with the bank
Mum found my sketchbook under the mattress, held it like something I'd stolen from her
Said, "Drawings won't pay for a flat", I said, "Breaking at nineteen won't pay for it either"
Last year's topper got page one in the paper, marigolds up to the top of his chin
Nobody printed page two, the winter he couldn't get out of his bed or let anyone in
Dad's dream, Mum's dream, the aunties' dream, the poster's dream, so tell me, whose dream am I?

[Hook]
Whose dream am I, whose name is on the line?
Not a number, not a rank, I'm drawing mine

[Drop]
Say your name

[Verse 2]
Sunday at dinner, hands under the plate, the uncle from Pune is here for the show
Listing the colleges, fees and the fallbacks, he's reading my future like it's his to own
Heart at a hundred and eighty, I stood up, the dal going quiet, the fan going slow
Put the sketchbook down next to the rice and I opened the page I had never once shown
Papa asleep in his chair with the paper, every grey hair, every line in his face
He looked so long that the uncle stopped talking, the fan was the only sound in the place
Then he took a magnet off the fridge and stuck it right over the rank, closing the case
Called the coaching centre on speaker, "She won't be coming", and gave me my space
Not every father moves a magnet, so to the kid up at two with a pencil, keep the page

[Hook]
Whose dream am I, whose name is on the line?
Not a number, not a rank, I'm drawing mine

[Outro]
Rank on the fridge
Magnet on the rank
Whose dream am I
Mine
All mine
"""

[[songs]]
id = "pretending-is-expensive"
title = "Pretending Is Expensive"
form = "confession"
groups = ["hiphop"]
model = "B"
voice = "soft weathered male tenor in his forties, close-mic half-time verses, chorus lifting into a cracked falsetto, audible breaths between lines"
about = "a father who lost his job and kept leaving home every morning in a pressed shirt, until he told his wife the truth"
lyrics = """
[Intro]
A pressed shirt on a hanger and a tiffin by the door
I kiss my daughter's head at eight like I did the day before

[Verse 1]
They let me go on a Tuesday, fifteen minutes on a call
A man said "restructuring", and I nodded at the wall
Next morning I still ironed my shirt and put on my watch
I still caught the eight-ten bus, then got off at the wrong stop
There's a park behind the station and a bench beneath a tree
The pigeons are my colleagues and the gardener nods at me
My wife asks, "How was work?" I tell her "busy", pass the dal
Busy feeding squirrels, busy hearing no on every call
My pride says, "Fix it first, then tell them when it's done"
My heart says, "Every evening that you lie, you lose someone"
Am I sparing them the worry, or just sparing me the shame?
Is it love to hide the hole, or fear with a nicer name?

[Chorus]
Pretending is expensive, it costs you every night
A pressed shirt and a story and a smile you hold too tight
You can lose a job on a Tuesday and find one again by June
But a lie at your own front door takes the air out of the room
Pretending is expensive, and the truth is the cheaper choice

[Drop]

[Verse 2]
Forty-one days, the savings dripping like a tap I never close
An old man on the next bench, retired railway, Sunday clothes
He says, "Son, you leave at nine, but you don't go to work
I did this in eighty-two, I know the shirt, I know the smirk
Worst part wasn't money, son, it was the door
Your wife already feels it, and your daughter knows the score"
I thought that I was strong because I carried it alone
Turns out carrying alone is just a slow way of leaving home
I was trying to be the father, I was turning into a ghost
Keeping safe the thing that mattered least, and losing what mattered most

[Chorus]
Pretending is expensive, it costs you every night
A pressed shirt and a story and a smile you hold too tight
You can lose a job on a Tuesday and find one again by June
But a lie at your own front door takes the air out of the room
Pretending is expensive, and the truth is the cheaper choice

[Bridge]
Day forty-two
I came home at noon
I sat her at the table
I told her all of it
My voice broke twice

[Verse 3]
She said, "I knew three weeks ago, you idiot, I knew
Your shirt came home too clean for a man who's working through"
She'd been cooking smaller portions, she'd been saving on the side
Quietly beside me every night I sat and lied
Now I go to interviews in the same pressed shirt, and it fits
Not because it's ironed, but because I'm the man inside of it

[Final Chorus]
Pretending was expensive, now I sleep through the night
The same shirt and a true story and a hand I'm holding tight
I lost a job on a Tuesday, I'll find one again by June
But the truth at my own front door gave me back the room
Pretending was expensive, and the truth was the cheaper choice

[Outro]
A pressed shirt on a hanger and a tiffin by the door
I kiss my daughter's head at eight, and I don't lie anymore
"""

[[songs]]
id = "whats-a-rating-worth"
title = "What's A Rating Worth"
form = "story"
groups = ["hiphop"]
model = "A"
voice = "husky young male rapper with a Bihari accent, breathless urgent double-time like he's still on the bike, hook sung in a warm rounded chest voice"
about = "a food delivery rider's flooded night shift and the old woman who opened the door with a towel, a cup of chai and a question about his name"
lyrics = """
[Intro]
Third floor, no lift, eleven minutes, so tell me, what's a rating worth?

[Verse 1]
Water to my ankles on the flyover ramp, my phone in a plastic bag tied to the bar
Eleven minutes on the timer, rain coming sideways, the map says it isn't that far
Every red light's a coin toss, every horn is a lecture, every pothole as deep as a car
Truck throws a wave, Juhu at high tide, I spit out the gutter and laugh at the sky
Crying is only more water, my shoes are a river, so tell me, why try to stay dry?
Fourteen hours on the seat, my back is a question mark, pulse at a hundred and eighty
Rent on the first, and my mother in Bihar thinks I'm working a job that is steady
One star cuts the bonus, two stars get a call, and three stars, they show me the door
Building with no lift and the guard is asleep, so I squelch up the stairs to the third floor

[Hook]
What's a rating worth when the rain is in your shoes?
Five little stars and a whole night to lose

[Drop]
Ring the bell

[Verse 2]
Door opens slow, an old lady in glasses, a shawl and a stick, ninety if a day
Grandson ordered from Bangalore, she lives alone, took one look at me, said, "Child, stay"
Came back with a towel and a steel glass of chai, said, "The rain can wait, so can they"
Twelve orders stacking, the phone in my pocket is buzzing, it's calling me late
But I sat on her plastic stool, dripping on newspaper, letting the whole city wait
She asked me my name, first time all year, not my ID, not my bike, not my rate
Said, "You carry the city, and nobody carries you", put two biscuits down on a plate
Rode out late with a penalty waiting, my rating dropped a point, and it felt light
Then at a red light I read her review, "kind boy, soaking wet", and smiled through the night

[Hook]
What's a rating worth when the rain is in your shoes?
Five little stars and a whole night to lose

[Outro]
Third floor, no lift
Rating went down
She knew my name
That's what it's worth
More than five stars
"""

[[songs]]
id = "walk-past-my-mistakes"
title = "Walk Past My Mistakes"
form = "letter"
groups = ["hiphop"]
model = "B"
voice = "gentle older-brother male baritone, unhurried spoken-sung verses, plain slightly rough chorus, a smile you can hear at the end of lines"
about = "a letter from an older brother who works at a loading bay to his fourteen-year-old little brother, asking him not to repeat his mistakes"
lyrics = """
[Intro]
I left my jacket on your bed, the one with the broken zip
Keep it, Chotu, it's yours now, I'm writing because of it

[Verse 1]
You're fourteen now and your voice cracks every time you're loud
You walk like me, you laugh like me, it makes me scared and proud
I saw you on the terrace with the boys I used to know
Same jokes, same corner, same "bro, where are we gonna go?"
I quit college second year because they said that it was dumb
Spent four years lifting cartons, now my shoulders just go numb
I'm not your father, not a preacher, I'm just the one ahead
I can see the broken stair that you haven't reached yet
My heart says, "Let him fall, that's how I learned, that's how he'll grow"
My head says, "Then why did I fall at all, if not so he would know?"
Is it love to let you choose, or love to tell you what I see?
Is it fair to ask you not to be the boy who's just like me?

[Chorus]
Walk past my mistakes, I left them on the road like signs
Every crooked step I took, I took so you'd walk straighter lines
You don't have to be me, you don't have to be better, just be you
Walk past my mistakes, I made them so you don't have to
I'll be standing on the corner where I used to waste my days
Not to drag you back, just pointing you the other way

[Drop]

[Verse 2]
Mum says you got eighty-nine in maths, I bragged the whole day at work
Told the whole loading bay, and even the supervisor smirked
You want to be like me? Then be me on my best day
The one who carried Grandpa to the bus when his knees gave way
When the boys say, "Skip it, come with us, the test can wait"
Tell them your brother's back still hurts from what he skipped at your age
And if you fall, call me, two in the morning, the first ring
I don't need you perfect, I need you breathing, that's the thing
I hated every lecture, so I won't preach you a sermon
I'll just leave the stair light on and trust the boy you're turning

[Chorus]
Walk past my mistakes, I left them on the road like signs
Every crooked step I took, I took so you'd walk straighter lines
You don't have to be me, you don't have to be better, just be you
Walk past my mistakes, I made them so you don't have to
I'll be standing on the corner where I used to waste my days
Not to drag you back, just pointing you the other way

[Bridge]
I'm not asking you to be careful
I'm asking you to be you
Fall if you have to
Just not in my holes
And call me

[Final Chorus]
Walk past my mistakes, I'll carry them, they're mine to keep
Every crooked step I took, I took so yours won't be so steep
You don't have to be me, you don't owe me anything back
Walk past my mistakes, and if you trip, I've got your back
I'll be clapping on the corner where I used to waste my days
Like an idiot, like a brother, while you walk the other way

[Outro]
I left my jacket on your bed, and I fixed the broken zip
Wear it somewhere I never went, that's the whole point of it
"""

[[songs]]
id = "which-side-is-handsome"
title = "Which Side Is Handsome"
form = "celebration"
groups = ["hiphop"]
model = "A"
voice = "round cheerful male tenor, bouncy playful double-time with a grin in every bar, sing-song hook, a laugh he can't hold in"
about = "a disastrous haircut from the colony barber an hour before a first date, and the girl who turns out to have the same barber"
lyrics = """
[Intro]
Just a little off the sides, I said, so which side is handsome?

[Verse 1]
Raju Uncle's shop, a crack in the mirror, a film hero poster with a perfect wave
Cricket on the TV, he's watching it more than my head, every ball a wicket to save
India hit a six, the whole lane screamed, he swung like a batsman, my sideburn flew
Wicket fell next ball, he jumped with the scissors, took a bite off my ear, said, "It's new"
Spray bottle water that used to be Rooh Afza, sticky and pink on the tip of my nose
Head massage so hard I said hi to my great-grandfather, forgot what I came for, I froze
Twenty rupees, he holds up the mirror, a staircase one side and a field on the other
He says, "Handsome", I say, "Uncle, which side?", he says, "Both", and he calls me his brother
Date's at seven with the girl from the bank queue, it's six, and my head is a hill

[Hook]
Which side is handsome, which side is me?
Crooked in the mirror but I'm walking out free

[Drop]
Pick a side

[Verse 2]
Tried my sister's hair gel, now it's crooked but shining like a steel plate in the sun
Dad looked up from the paper, said, "That's how I met your mother", and winked like he won
Walked in the cafe, heart at a hundred and seventy-six, and she looked up and froze
Then she laughed so hard that the chai she was sipping came flying right out of her nose
I reach for the cap, then she wipes off her chin and she points at the gap by my ear
"Did Raju Uncle do that?" "How'd you know?" "He did my brother's wedding last year
Every photo of the groom is a staircase", two strangers, and one barber in common
Second date on Sunday, we're both getting haircuts, same chair, same crack in the glass
Raju Uncle, you're a genius, a hazard, a crooked little cupid with scissors and class

[Hook]
Which side is handsome, which side is me?
Crooked in the mirror but I'm walking out free

[Outro]
Just a little off the sides
Which side is handsome
The side she's on
Book us in, Uncle
World Cup final
"""

[[songs]]
id = "slow-money-sleeps-better"
title = "Slow Money Sleeps Better"
form = "argument"
groups = ["hiphop"]
model = "B"
voice = "smoky low female contralto in her forties, steady grounded half-time flow, chorus sung slow and full like a folk singer at a wedding"
about = "a tailor with a high-interest loan on her shop, torn between a new loan to cover it and the women's savings group at the temple hall"
lyrics = """
[Intro]
The agent calls at nine every morning, on the dot
My needle stops mid-stitch, whether I've got the money or not

[Verse 1]
I borrowed two lakh for a shop and a sign that says my name
Fabric on the shelves and a mirror in a borrowed frame
The agent had a gold chain and a voice like jaggery tea
Said, "Monthly is nothing, madam, you'll be on your feet, you'll see"
Then the monsoon took the market, two whole weeks of dead
The water left in seven days, the interest stayed instead
I stitch blouses till my thumb forgets what it can feel
I pay the interest, never the loan, round and round a wheel
My fear says, "Take the next loan, buy a month, buy a breath"
My mother's voice says, "Beta, that's how I borrowed to my death"
Is it smart to borrow time, or is it just a slower fall?
Is it brave to tell him no, or am I gambling with it all?

[Chorus]
Fast money comes in smiling, and it never knocks just once
It eats your Sundays, eats your sleep, eats you by the month
I'd rather count in coins than count the nights I've got left
I'd rather owe my sisters than owe a stranger my breath
They say a big loan builds you up, they say a small heart stays poor
But slow money sleeps better, fast money waits outside your door

[Drop]

[Verse 2]
New agent at the shutter with a newer, kinder face
"Take from us, close the old one, madam, we will give you space"
Space, he says, like a well has space, you just keep falling through
Half of me reached for the pen, and half of me knew who
My mother paid them with her gold, her bangles, then her sleep
Then she paid them with her laughter, the one thing she had to keep
So I walked into the women's group in the temple hall that night
Twelve women on a cotton durrie underneath a tube light
Twelve stories, same agent, same gold chain, same call at nine
Four percent, a notebook, every rupee read out line by line
Nobody gets rich quick in there, every rupee has a name
Slow money, honest money, and nobody walks home in shame

[Chorus]
Fast money comes in smiling, and it never knocks just once
It eats your Sundays, eats your sleep, eats you by the month
I'd rather count in coins than count the nights I've got left
I'd rather owe my sisters than owe a stranger my breath
They say a big loan builds you up, they say a small heart stays poor
But slow money sleeps better, fast money waits outside your door

[Bridge]
I told him no
He stood at the shutter a long time
I kept on stitching
Then he left
The seam was straight

[Final Chorus]
Fast money came in smiling, and I let it knock just once
Now I pay four percent, and I pay my sisters every month
I count in coins, and I count the women at my side
I owe twelve names a little, and nobody owns my pride
They said a big loan builds you up, they said a small heart stays poor
But slow money sleeps better, and nobody's waiting at my door

[Outro]
The agent called at nine today, I let the phone ring through
My needle didn't stop this time, I had a blouse to finish too
"""

[[songs]]
id = "does-it-still-start"
title = "Does It Still Start"
form = "dialogue"
groups = ["hiphop"]
model = "A"
voice = "nostalgic mid-range male voice with a Delhi accent, swinging double-time that softens and slows for the father's lines, hook sung in a light falsetto"
about = "a father teaching his son to kick-start an old blue scooter, and thirty years later the son bringing it back to life for him"
lyrics = """
[Intro]
Thirty years under a cover in the corner, Papa, does it still start?

[Verse 1]
Listen, beta, blue Bajaj, ninety-one, and the seat's stitched shut with a sack of jute
Choke out, tilt her left, now kick, no, harder, the heel, put your weight in the boot
She never wakes on the first, like your mother, she says no, then yes, and that's the truth
Four of us rode her to Nani's at Diwali, your mum side-saddle with a tiffin of kheer
You on the footboard, your sister squeezed in, the mirror turned so I knew you were near
Get on the seat, your feet won't reach, it's fine, I'm holding the back, I'm right here
Eyes on the road, not the wheel, not the ground, you go where you look, so look where you go
Twenty feet down the colony lane I let go, and you didn't know, and you rode it alone
First kick's a question, beta, the second's the answer, remember that when you're grown

[Hook]
Does it still start when nobody believes?
Kick it twice, kick it twice, and it breathes

[Drop]
Kick it twice

[Verse 2]
Now you're seventy-two, your knee won't kick, she's a shape in the corner, plastic and dust
Cousin said, "Sell her for scrap, she's a rust bucket", you didn't argue, you just
Stood on the balcony evenings, watching the cover like a friend you could trust
Pushed her two kilometres to Karol Bagh, to Jaspal, the mechanic with grease to the wrist
New cables, new plug, and I told him to keep the dent from the wall I hit when I missed
Rode her home Sunday, heart at a hundred and eighty, I honked twice outside of the gate
You came to the balcony slow in your vest like a boy who got caught staying up late
First kick, nothing, you laughed, "Told you, she waits", second kick, and she roared down the lane
You on the back, your hand on my shoulder, "I'm holding, Papa", the same words again

[Hook]
Does it still start when nobody believes?
Kick it twice, kick it twice, and it breathes

[Outro]
Thirty years
Two kicks
She still starts
So do we
Hold on, Pa
"""
