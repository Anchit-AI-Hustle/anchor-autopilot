[[songs]]
id = "lantern-in-the-flood"
title = "Lantern In The Flood"
family = "devotion"
form = "letter"
groups = ["hiphop"]
model = "B"
voice = "tender husky female hip hop singer, half-sung verses like reading a letter aloud, chorus lifting into a soulful open alto"
about = "a letter to someone going under, promising not a rescue but a light to swim toward"
lyrics = """
[Intro]
I'm writing this in pencil so the rain won't make it run
You can hold it in the water when the lights go one by one

[Verse 1]
I heard the river's at your window, I heard it's climbing every stair
I heard you stopped returning calls, I heard you stopped brushing your hair
I can't promise I can fix it, I am not that kind of strong
I can't hold back what is falling, I've been wrong about that all along
My fear says, "Keep your distance, you'll go under if you stay"
My heart says, "Then we'll learn to float, there isn't any other way"
So I'm packing up a little light, a match, a wick, a glass
And I'm wading out to find you, and I'll stay until it's passed
You can't stop a flood, you can only refuse to leave
And I'm refusing, I'm refusing, I am here, so breathe

[Chorus]
If the river takes the road, if the bank turns into mud
I won't promise you a boat, I'll be a lantern in the flood
You don't have to swim tonight, you just have to see me there
Keep your eyes upon the light, I'll keep it burning in the air

[Verse 2]
I remember when you found me in a season just like this
When the water reached my collarbone, I couldn't feel my fists
You didn't come with answers, didn't come with any plan
You just sat beside the window with a light inside your hand
And I hated you for staying, and I loved you for it too
'Cause the night was so much smaller when the night had room for two
So I'm giving back the fire that you lent me long ago
It's been burning in my pocket so that you would never know
If you sink, I'll hold it lower, if you rise, I'll hold it high
There is nothing in this water that can make me say goodbye

[Bridge]
Look at me, not the waves
Look at me, not the rain
I'm not leaving
I'm not leaving

[Final Chorus]
When the river took the road, when the bank turned into mud
You swam toward the only light, I was a lantern in the flood
Now the water's at our knees and we're laughing in the air
And the light is in your hand now, I can see you holding it there

[Drop]
Hold the light

[Outro]
I wrote this all in pencil and the rain could not erase
Every word is still here, and so am I, in the same place
"""

[[songs]]
id = "hinges-give-way"
title = "Hinges Give Way"
family = "escape"
form = "dialogue"
groups = ["hiphop"]
model = "A"
voice = "duet of a restless male hip hop rapper with a quick nasal flow and a calm low female hip hop singer, trading verses, meeting in close harmony on the final hook"
about = "two people arguing at the edge of the only road out of a small life until the wind decides for them"
lyrics = """
[Intro]
Wind on the latch, can you hear it? The hinges give way

[Verse 1]
He said, "Look at the road, it goes straight past the hills and it never once asks you to stay"
"Every morning the same, every face is the same, I've been living the same single day"
"I've been circling this field like a dog on a chain and I wore out the grass in a ring"
"I can taste the horizon, it's salty and wide, and I'm tired of not wanting a thing"
She said, "Easy to talk about leaving, but leaving's a bill that you pay with your skin"
"Out there nobody knows you, nobody will catch you, there's nobody waiting within"
"Here at least I know where the floorboards are loose, I know which of the windows will stick"
"Here the walls are a hug and a hand on your throat and I'm not always sure which is which"

[Hook]
Hinges give way, wind coming in
Run if you're running, now's where it begins

[Drop]
Go, go, go

[Verse 2]
He said, "Safe is a room with no window, you breathe the same air till it's heavy as stone"
"I would rather be lost with the sky on my head than be found in a house all alone"
"A cage with the door left open is still a cage if you're too scared to leave"
"And I'm scared, I am terrified, look at my hands, but I'm going, I'm rolling my sleeves"
She said, "Then I'll be honest, I've packed it already, a bag by the bed for a year"
"Every night I'd unpack it again and again 'cause I didn't want you to see fear"
And the wind took the latch and the hinges gave way and the dust in the hallway went flying
And we laughed like two kids at the edge of the world, and we ran, and nobody was crying

[Final Hook]
The hinges give way and we're already gone
Ran for the road and the road ran on

[Outro]
Empty hallway
Swinging door
Field behind us
Wind before
Hinges give way
"""

