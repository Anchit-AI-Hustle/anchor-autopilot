about = "the only person in a bowing crowd who stays on her feet, and what happens to the crowd when she does"
lyrics = """
[Intro]
Every head in the hall went down, mine stayed up, every spine unbent

[Verse 1]
There's a hall full of people with eyes on the floor and a throne at the end made of gold
Somebody up there is pointing, deciding, and everyone's bending the way they've been told
I could feel it, the pull at the back of my knees like a hand on the scruff of my neck
Like the floor was a magnet, my spine was a nail, and the habit was winning the bet
And the voice in my ribs said, "Just do it, it's easy, it's only a second, it's only a bow"
But a second's a habit, a habit's a life, and a life on your knees doesn't know how
So I locked every joint and I lifted my chin and I stood like a tree in a storm
In a field of bent backs there was one standing up, and the air round my body got warm

[Hook]
Every spine unbent, every spine unbent
Stand in the fire till the fire is spent

[Drop]
Up, up, rise

[Verse 2]
