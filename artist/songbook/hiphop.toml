[[songs]]
id = "iron-before-sunrise"
title = "Iron Before Sunrise"
form = "story"
groups = ["hiphop"]
voice = "deep velvet male baritone, slow storytelling rap in the verses, sings the hook warm and low"
about = "a mother who ironed the whole neighbourhood's clothes before dawn to pay her son's school fees"
lyrics = """
[Intro: sung softly]
Coal in the box and steam on the air

[Verse 1: slow storytelling]
Four-thirty, she was up before the milkman and the crows
Coal in the box iron, mountains of the neighbours' clothes
Doctor's white coat, the teacher's Sunday best, a bride's silk sari
Pressed every crease out like she's pressing out the worry
I'd fake my sleep and count the pieces in her pile
Forty shirts was eighty rupees, eighty was a schoolbook and a smile
Burns on her wrist like the bangles that she never bought
When I asked, she just laughed and said "the iron's too hot"

[Hook: sung]
Iron before sunrise, steam on the glass
She smoothed out the whole world so her boy could pass
Iron before sunrise, I never saw her rest
Every shirt in the colony, she made it look its best

[Drop]

[Verse 2: heavier]
Fees due on a Friday and we came up four hundred short
She took a whole wedding's laundry, ninety kurtas, didn't stop
Thursday night to Friday with the coal burning grey
Paid the office in coins that were still warm from the day
Never once said tired, only asked me "did you eat?"
Still asks that on the phone when I'm calling from the street
Now my name's on a glass door and my collar's always crisp
Bought her a steam iron, she says it doesn't know her wrist

[Bridge: spoken]
She still keeps the old one. Says it remembers.

[Drop]

[Final Hook]
Iron before sunrise, now I'm the one awake
Pressing out her sari for my mother's sake
Iron before sunrise, she can finally rest
Every crease she carried, I'm wearing on my chest

[Outro: spoken]
Coal's gone cold, Ma. Sleep in.
"""

[[songs]]
id = "group-photo-ghost"
title = "Group Photo Ghost"
form = "argument"
groups = ["hiphop"]
voice = "clipped female rapper, crisp diction, clipped staccato verses, hook sung in a thin airy head voice"
about = "a friend who shows up for every celebration and none of the hard days, and deciding what to do with fifteen years"
lyrics = """
[Intro: spoken, dry]
Tagged in forty photos. Present for zero hospital visits.

[Verse 1: staccato]
Front row at my birthday, right between the candles
Ghost on moving day, I did six floors with the handles
You know my best angle but you don't know my blood type
Dad was in the ICU, you double-tapped it, said "good night"
First one in the frame at every wedding, every launch
Last one to the hospital, you never made it, not once
Your love's got good lighting and it only works by day
When the sun goes down, it finds a reason to stay away

[Hook: sung, airy]
Group photo ghost, you only come for the cake
Never for the hard days, never for my sake
Group photo ghost, should I crop you from the frame?
Fifteen years of laughing and you never held the pain

[Drop]

[Verse 2: the other side]
But I scroll back to Class Six, you split your tiffin every lunch
Mum was on the night shift and you never asked me much
Maybe you're a fair-weather friend, but you were my first weather
Maybe people come in seasons, you were summer, not forever
I don't need you at the hospital if you can't stand the halls
But I'm done saving seats for someone who never calls
So I'm keeping the picture, I'm just changing the caption
From "friends for life" to "thank you, that was a chapter"

[Bridge: spoken]
I'm not deleting you. I'm just not tagging you anymore.

[Drop]

[Final Hook]
Group photo ghost, you can stay in the frame
I'm just not waiting by the door with your name
Group photo ghost, you were summer, not the year
Smile in the picture, babe, you just don't live here
"""

[[songs]]
id = "uncle-cut-it-crooked"
title = "Uncle Cut It Crooked"
form = "celebration"
groups = ["hiphop"]
voice = "cheerful round-voiced male tenor, goofy bounce flow, sing-song hook, giggles he can't hold in"
about = "getting a disastrous haircut from the colony barber the day before a first date and owning it anyway"
lyrics = """
[Intro: spoken]
Just a little off the sides, I said. Just a little.

[Verse 1: bounce]
Raju Uncle's shop got a mirror with a crack in
Poster of a hero with the hairstyle I was asking
TV playing cricket and he's watching more than me
India hit a six, he swung, my sideburn got set free
Wicket fell, he jumped, took a chunk above my ear
Said "don't worry, beta, crooked is the fashion this year"
Spray bottle full of water that was once Rooh Afza
Head massage so hard I said hello to my great-grandpapa
Twenty rupees, held the mirror, I'm a staircase on one side
He said "handsome", I said "Uncle, which side? Pick a side"

[Hook: sing-song]
Uncle cut it crooked, one side up, one down
Looking like a hill road, best haircut in town
Uncle cut it crooked and I'm wearing it with pride
Date's at seven, baby, you can pick a side

[Drop]

[Verse 2]
Tried my sister's hair gel, now it's crooked but it's shiny
Dad looked up from the paper, said "that's how I met your mummy"
Walked into the cafe and she looked at me and froze
Then she laughed so hard that her chai came out her nose
Said "did Raju Uncle do that?", I said "how'd you know?"
"He cut my brother for his wedding, it's in every photo"
Now we got a thing in common and a second date set
Raju Uncle, you're a genius, crooked, but I'm not upset

[Bridge: spoken, giggling]
Booked my next appointment. World Cup final. Pray for me.

[Drop]

[Final Hook]
Uncle cut it crooked, one side up, one down
Looking like a hill road, best haircut in town
Uncle cut it crooked and she's laughing by my side
Second date on Sunday and we still can't pick a side
"""

[[songs]]
id = "park-bench-office"
title = "Park Bench Office"
form = "confession"
groups = ["hiphop"]
voice = "soft cracked male tenor, close-mic and quiet in the verses, rising to a raw shout, hook sung in falsetto"
about = "a man who lost his job and kept leaving home in a pressed shirt every morning so his family wouldn't know"
lyrics = """
[Intro: whispered]
Bye, Ma. Running late.

[Verse 1: quiet, close-mic]
Laid off on a Tuesday, fifteen minutes on a call
Man said "restructuring", I nodded at the wall
Next morning, pressed the shirt and kissed my daughter on the head
Took the eight-ten bus like always, got off at the park instead
Office bag with nothing but a tiffin and a lie
Same bench by the banyan, watching walkers going by
Pigeons are my colleagues and the gardener is my boss
Clock out at six and walk in home like nothing's lost
Wife asks "how was work?", I say "busy", pass the dal
Busy feeding squirrels, busy hearing no at all

[Hook: sung, falsetto]
Park bench office, nine to six
Pretending's the one job I can't quit
Park bench office, pressed shirt, empty day
Smile at the door like I earned my pay

[Drop]

[Verse 2: rising]
Forty-one days, savings dripping like a tap
Squirrel got so brave that it was sitting on my lap
Old man on the next bench, retired railway clerk
Said "son, you leave the house at nine, but you don't go to work"
Said "I did this in eighty-two, a month and then some more
Worst part wasn't money, it was lying at the door"
Day forty-two, I came home early, sat her at the table
Told her all of it, voice shaking, barely able
She said "I knew three weeks ago, you idiot, I knew
Your shirt came home too clean for a man who's working through"

[Bridge: shouted, raw]
I lost a job, I didn't lose my name
Say it out loud and the bench ain't the same

[Drop]

[Final Hook]
Park bench office, closed for good
Told the truth the way I always should
Park bench office, pigeons, say goodbye
Home at noon and I don't have to lie
"""

[[songs]]
id = "five-star-monsoon"
title = "Five Star Monsoon"
form = "story"
groups = ["hiphop"]
voice = "husky young male rapper, breathless urgent flow like he's still on the bike, hook sung in a warm chest voice"
about = "a food delivery rider's flooded night shift and the one customer who came to the door with a towel and chai"
lyrics = """
[Intro: spoken, out of breath]
Order forty-two. Eleven minutes. Third floor, no lift.

[Verse 1: breathless]
Water to my ankles on the flyover ramp
Phone in a plastic bag and the map's going damp
Eleven minutes left or the rating takes a dive
Every red light's a coin toss, every horn says "drive"
Truck throws a wave on me like I'm Juhu at high tide
Spit out the gutter, laugh, 'cause crying's just more rain inside
Building with no lift and the guard is fast asleep
Up three floors of stairs and my shoes go squelch and squeak

[Hook: sung]
Give me five stars, I gave you my monsoon
Rode through the river just to make it to your room
Five star monsoon, wet down to the bone
Hot food at your door and a cold ride home

[Drop]

[Verse 2]
Door opens, old lady, glasses and a shawl
Grandson ordered from Bangalore, she lives alone, that's all
Took one look at me dripping, said "wait", went down the hall
Came back with a towel and a steel glass of chai
Said "sit for two minutes, son, the rain can wait outside"
Twelve orders waiting and the phone kept screaming "late"
But I sat on her plastic stool and let the whole night wait
She asked me my name, first time all year
Customers don't ask, they just tap and disappear
Rated me five stars, wrote "kind boy, soaking wet"
Read it at a red light, best review I ever get

[Drop]

[Final Hook]
Give me five stars, she gave me a towel
Rode through the river, still smiling somehow
Five star monsoon, wet down to the bone
Hot chai at her door and a warm ride home
"""

[[songs]]
id = "rank-aint-my-name"
title = "Rank Ain't My Name"
form = "revolt"
groups = ["hiphop"]
voice = "fierce young female rapper, bright loud chest voice, rapid double-time verses, a chanted hook a crowd can shout back"
about = "a student refusing to be reduced to an entrance exam rank by her relatives and coaching centre"
lyrics = """
[Intro: shouted]
Every aunty asks the same thing. Not anymore.

[Verse 1: double-time]
Coaching at six, school at nine, more coaching back at four
Mock test on the fridge like a ransom note on the door
Aunty at the reception skips "hello", goes straight to "rank?"
Like I'm a fixed deposit and she's checking with the bank
Mum found my sketchbook, said "drawings don't pay the rent"
I said "neither does a breakdown at nineteen, that's money spent"
Last year's topper made page one with a garland and a grin
Nobody wrote a page two when he couldn't leave his bed again

[Hook: chanted]
Rank ain't my name, say it back
I'm not a number on a list, I'm not a stat
Rank ain't my name, write it down
Priya with a pencil, gonna draw this town

[Drop]

[Verse 2]
Told my dad at dinner with my hands under the plate
Showed him one sketch, said "Papa, I can't carry one more year of weight"
It was him asleep in his chair, every grey line in his hair
He looked at it so long I thought the silence was a prayer
Then he took a magnet, stuck it right over the rank
Called the coaching centre on the speaker, said "no thanks"
I know not every father puts the magnet where mine did
So this is for the one still up at two, for every kid

[Bridge: chant]
Not a rank, not a roll number, not a seat
I'm a name, I'm a face, I'm a heartbeat

[Drop: crowd shouts]
Say your name!

[Final Hook]
Rank ain't my name, say it back
I'm not a number on a list, I'm not a stat
Rank ain't my name, say your own
Every kid with a pencil, you're not alone
"""

[[songs]]
id = "not-my-footsteps"
title = "Not My Footsteps"
form = "letter"
groups = ["hiphop"]
voice = "gentle older-brother male baritone, warm spoken-word verses, hook sung plainly and a little rough, not polished"
about = "a letter from an older brother to his fourteen-year-old little brother, asking him not to walk into the same mistakes"
lyrics = """
[Intro: spoken]
Chotu. Don't show this to Mum.

[Verse 1: spoken-word warm]
You're fourteen now and your voice cracks when you're loud
You walk like me, you laugh like me, it makes me scared and proud
Saw you on the terrace with the boys I used to know
Same jokes, same corner, same "bro, where we gonna go?"
I quit college second year 'cause the boys said it was dumb
Spent four years lifting cartons, now my shoulders go numb
I'm not your father, Chotu, I'm just the one ahead
Hold the rail where I slipped, take the stair I missed instead

[Hook: sung plainly]
Walk your own road, not my footsteps
Some of them are crooked, some of them I regret
Walk your own road, I'll be behind you
Not to push, just to remind you

[Drop]

[Verse 2]
Mum says you got eighty-nine in maths, I bragged at work
Told the whole loading bay, even the supervisor smirked
You wanna be like me? Then be me at my best
The one who carried Grandpa to the bus, forget the rest
When the boys say "skip the exam, come with us to the mall"
Tell 'em your brother's got a bad back from skipping it all
And if you fall, call me, two a.m., first ring
I don't need you perfect, I need you breathing, that's the thing

[Bridge: spoken]
P.S. The jacket's yours. Keep it. Just don't wear my mistakes with it.

[Drop]

[Final Hook]
Walk your own road, not my footsteps
I'll carry the crooked ones, you don't owe me yet
Walk your own road, I'll be behind you
Clapping like an idiot, the way that brothers do
"""

[[songs]]
id = "seventeen-percent"
title = "Seventeen Percent"
form = "argument"
groups = ["hiphop"]
voice = "heavy hoarse female contralto, slow grinding flow, smoky sung hook, tired but unbroken"
about = "a tailor trapped by a high-interest loan on her shop, arguing with herself over taking another loan to cover it"
lyrics = """
[Intro: spoken]
The agent calls at nine. Every day. At nine.

[Verse 1: slow grinding]
Borrowed two lakh for a tailoring shop and a sign with my name
Fabric on the shelf and a mirror in a borrowed frame
Agent wore a smile and a gold chain, talked so sweet
Said "monthly is nothing, madam, you'll be on your feet"
Then the monsoon flooded the market, two weeks dead
Water left in a week but the interest stayed instead
Now I stitch blouses till my thumb forgets the feel
Pay the interest, never the loan, the whole thing's a wheel

[Hook: sung, smoky]
Seventeen percent of every night I don't sleep
Seventeen percent of every promise I keep
Do I borrow from the next one just to pay the last?
Or do I stand here, say no, and let the hard days pass?

[Drop]

[Verse 2: heavier]
New agent at the door with a newer, kinder face
"Take from us, close the old one, we'll give you some space"
Space, he says, like a well's got space, you just keep falling through
Half of me says sign it, buy a month, buy a breath or two
Other half remembers Mum, who borrowed till the day she left
Paid them with her gold, her sleep, and then she paid them with her breath
So I walked into the women's group inside the temple hall
Twelve women, twelve stories, same agent, same call
Four percent, a notebook, every rupee read out loud
Slow money, honest money, and I don't have to bow

[Bridge: spoken]
I told him no. He stood at the door a long time.
Then he left.

[Drop]

[Final Hook]
Seventeen percent, you don't get my sleep
Four percent and twelve women, that's the company I keep
I won't borrow from the next one just to pay the last
I'll stand here, say no, and let the hard days pass
"""

[[songs]]
id = "kick-it-twice"
title = "Kick It Twice"
form = "story"
groups = ["hiphop"]
voice = "nostalgic mid-range male voice with a Delhi accent, laid-back swing flow, hook sung in a light falsetto"
about = "a father's old scooter that only starts on the second kick, and the son who learns to ride it, then rides his father home"
lyrics = """
[Intro: spoken]
Choke out, tilt it left, now kick. No. Twice.

[Verse 1: laid-back swing]
Dad's blue scooter, nineteen ninety-one
Seat stitched with a jute sack, mirror pointing at the sun
Four of us on it, Mum side-saddle with the tiffin
Me up on the footboard, sister squeezed in the middle, grinning
Never started first kick, not one time in my life
Dad would wink and say "your mother said no first, then yes the second time"
Taught me on the colony road, his hand behind my seat
"I'm holding, I'm holding", then he'd let go twenty feet

[Hook: sung, falsetto]
Kick it twice, it'll start for you
Some things wake up slow but they still come through
Kick it twice, don't let it see you scared
First kick's a question, second kick's the dare

[Drop]

[Verse 2]
Now Dad's seventy-two and his knee won't do the kick
Scooter in the corner under a cover, gathering grit
Cousin says "just sell it, it's a scrap, it's just a load"
Dad said nothing, just kept looking at the colony road
So I took it to Karol Bagh, a mechanic named Jaspal
Three weeks, new cables, kept the dent from when I hit the wall
Rode it home on Sunday, honked it twice outside the gate
Dad came to the balcony like a boy who'd stayed up late
Put him on the back, his hand on my shoulder this time
Said "I'm holding, Papa, I'm holding", and I meant it every mile

[Bridge: spoken]
First kick, nothing. He laughed. Second kick.

[Drop]

[Final Hook]
Kick it twice, it started for you, Pa
Thirty years later and it still knows the way
Kick it twice, don't let it see you cry
First kick's for the past, second kick, let's ride
"""
