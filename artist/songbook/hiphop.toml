voice = "booming male hip hop hype man with a deep baritone, call-and-response double-time bars, sung hook belted like a stadium chant"
about = "a crowd of strangers at midnight turns the dance floor into a ceremony until the ground itself seems to wake up"
lyrics = """
[Intro]
Lift your feet, let them fall, we are stomping the earth awake

[Verse 1]
Midnight and the ground is still sleeping, there is dust on the boots of a thousand strangers in a field
Everybody came carrying something, a weight on the shoulders, a wound that won't heal
I don't know your name and you don't know mine, but your heel hits the floor at the same time as me
And the first kick lands like a knock at the gate of a world that has slept for a century
Now the second one shakes all the dust off the ceiling, the third one is lifting the hair on my arms
Every body in here is a drum with a heartbeat and every heartbeat is sounding alarms
My mind said, "Stand at the back where it's safe", but my feet said, "Brother, you came here to shake"
So I'm down in the middle and lifting my knees, and together we're stomping the earth awake

[Hook]
Stomping the earth awake, stomping the earth awake
Every heart a drum, every drum a quake

[Drop]
Stomp, stomp, wake

[Verse 2]
Look at the ground, it is cracking with light, there is heat coming up from below like a breath
Every foot is a prayer with no words and the floor is the altar we pound until nothing is left
A stranger is just a friend you never stomped beside, and tonight there are no strangers here
Hands on the shoulders in front of me, swaying, a river of bodies, a wave with no fear
If you've been carrying grief, put it down on the floor and then stamp on it, stamp till it breaks
If you've been carrying doubt, let the bass take it under, the ground can take more than it takes
Sun's coming up at the edge of the field and the sky's going pink with the sweat on our face
We were strangers at midnight and now we are thunder, we're stomping the earth awake

[Final Hook]
Stomping the earth awake, look what the night became
Every drum a heart, every heart a flame

[Outro]
Feet down
Dust up
No strangers
Morning
Stomping the earth awake
