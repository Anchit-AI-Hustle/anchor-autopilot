[[songs]]
id = "numbness-breaks"
title = "Numbness Breaks"
family = "awakening"
form = "story"
groups = ["hiphop"]
model = "A"
voice = "hushed male hip hop rapper in his late twenties, low husky tenor that starts almost whispered and swells into a ringing sung hook, double-time bars with real breaths"
about = "someone who went numb for a year is dragged into a basement full of bass and feels his own heartbeat come back"
lyrics = """
[Intro]
I was breathing for a year and never felt it, then the numbness breaks

[Verse 1]
Twelve months walking round like a ghost in a coat, I was nodding at faces and missing the jokes
Every colour went grey like a photo in sun, and I swallowed my voice like a stone in my throat
People asked me, "You good?" and I gave them the grin that I practised, no light in the eyes
I said "fine" so often the word lost its shape, it was rubber, it covered the lies
Then a friend pulled me out at midnight, a basement, a stairway, a wall full of sound
I was stuck at the back with my arms folded tight like a statue that's scared of the ground
My head said, "Leave, you don't belong in a room where the living go", and I turned to the stair
But the kick hit my chest like a fist on a door, and a door I had nailed shut swung open in there
Something under my ribs started knocking, a rhythm I buried and lost to the years
I could feel it, the heat in my hands and my face, the pulse returns, loud in my ears

[Hook]
The numbness breaks, the numbness breaks
I wasn't gone, I was learning how it aches

[Drop]
Knock, knock, wake up

[Verse 2]
Now I'm sweating right through it and laughing at nothing, at everything, fast as the night
There is salt on my lips, is it tears, is it sweat, and I don't even care, I'm alive in the light
Every kick is a shovel that's digging me out of the snow that I lay in and called it a bed
Every snare is a slap on the cheek of the sleeper I was, yelling, "Get up, you're not dead"
I mistook all the quiet for peace, I was calling it calm when it was a grave with a view
A quiet heart is not a healed heart, I know it now, and the stillness was lying to you
So I'm feeling it all, every ache in the bone, every hope that I starved through the years
If it hurts let it hurt, I'd be bleeding and breathing before I'd be safe in my fears
My heart said, "Stay", and for once in my life I obeyed it, I stood in the middle and burned
Hands up to the ceiling, I'm shaking, I'm screaming, I'm here, and the pulse returns

[Final Hook]
The numbness breaks, the numbness breaks
I'm not hiding now, I can feel every ache

[Outro]
Grey coat
On the floor
Leave it there
I can feel it
The numbness breaks
"""

[[songs]]
id = "tear-the-rulebook-down"
title = "Tear The Rulebook Down"
family = "defiance"
form = "revolt"
groups = ["hiphop"]
model = "A"
voice = "loud raspy female hip hop MC with a punk edge, barked double-time bars locked to the kick, hook chanted wide open like a protest leader"
about = "a woman handed a book of rules for staying small strikes a match and lights the whole room up with it"
lyrics = """
[Intro]
They handed me a book on how to be small, so I struck a match, tear the rulebook down

[Verse 1]
Page one said sit down and keep your voice in your pocket, keep your head at the height of the crowd
Page two said smile when they step on your fingers, and never, not ever, be angry out loud
They gave me a map with the roads drawn already, a fence on the left and a fence on the right
Every turn had a toll and a guard with a whistle, a lamp in my eyes every night
And a voice in my head with a ruler and frown kept on asking, "Who do you think that you are?"
So I wrote my name small in the margin of things like an apology scratched in a scar
But a margin's a cage with a view of the page, and I'm done being a footnote to fear
I am tearing the spine and I'm feeding the flame, and the smoke says the same thing, I'm here

[Hook]
Tear the rulebook down, tear it down
Nobody kneels in this crowd

[Drop]
Strike, light, burn

[Verse 2]
Now the ash on the floor is a carpet, we're dancing on paragraphs, stomping on every "you can't"
Every "not for your kind" is a spark in the air and I'm catching them all in the palm of my hand
They will call me a riot, they'll call me too reckless, too rude, say I'm wrecking the house that they built
But a house built on silence was shaking already, I'm only the hand on the tilt
A rule that needs you quiet is a leash with a name, and I'm chewing right through it tonight
My mind said, "Careful", my blood said, "Louder", and I let my blood win the fight
Every girl who was told to sit pretty is standing on chairs with a match and a grin
Tear the rulebook down, the pages are curling, the fire's a door and we're all walking in

[Final Hook]
Tore the rulebook down, tore it down
Now we write the law out loud

[Outro]
Page one
Is blank
Pick up the pen
Write it
Loud
"""

[[songs]]
id = "starve-the-envy"
title = "Starve The Envy"
family = "inner-demons"
form = "confession"
groups = ["hiphop"]
model = "B"
voice = "soft gravelly male hip hop singer-rapper in his thirties, confessional half-time verses close to the mic, chorus sung low and aching, audible breaths"
about = "a man admits that every time a friend won he quietly fed his own envy, and decides to starve it"
lyrics = """
[Intro]
There's a story of two wolves that live inside a single chest
I know which one is hungry, 'cause I know which one I fed

[Verse 1]
Every time somebody passed me, I would smile and I would clap
Then I'd go home counting distance like a debt they owed me back
I would feed it little pieces, just a scrap of someone's win
Just a "they don't really deserve it", just a slow and bitter grin
My heart said, "Let them have it, there is room on every stage"
My pride said, "Keep a record, every gift is someone's wage"
And I listened to the louder one, the one with teeth and need
'Cause the quiet one was patient and the patient never plead
Was I hungry, or just frightened that there wasn't enough light?
Was I honest, or just practised at a jealousy polite?

[Chorus]
I've been feeding the wrong wolf, I've been feeding it for years
Every bitter thing I swallowed came back sharper in the mirror
What you starve will learn to leave you, what you feed will learn your name
Starve the envy, starve the envy, and the wolf is not to blame

[Verse 2]
There's a night I won't forget, I said a thing I can't take back
To a friend who brought good news, I made the good news crack
Watched the light go from their face just like a match out in the rain
While the wolf inside me rolled over, warm and full and unashamed
That's the moment that I saw it, not a monster, just a mouth
Every meal I gave it out of fear came back to bite me now
It was never really fire, it was smoke I called a flame
It was never really power, it was envy with a frame
Now my mind says, "Keep on feeding, or it turns its teeth on you"
And my heart says, "Let it go hungry, there's a wolf that's starving too"

[Bridge]
I'm not killing anything, I'm only closing up the door
Let it howl outside the window, it won't eat in here no more
I am kneeling by the other one, I'm learning how to wait
It was gentle all along, it was starving at the gate

[Final Chorus]
I was feeding the wrong wolf, now I'm feeding something new
Every blessing I give away comes walking back to you
What you starve will learn to leave you, what you feed will learn your name
Starve the envy, starve the envy, and the night is not the same

[Drop]
Starve the envy

[Outro]
Two wolves inside a single chest
I know which one I fed
Not anymore
Sleep now
"""

[[songs]]
id = "outpace-the-fear"
title = "Outpace The Fear"
family = "drive"
form = "story"
groups = ["hiphop"]
model = "A"
voice = "bright breathless young male hip hop rapper, sprinting double-time flow, hook sung in a clean light tenor, a laugh breaking through on the last line"
about = "a man who stood at the edge of the water for a year finally jumps before his fear can catch up with him"
lyrics = """
[Intro]
Fear is always one step late, so outpace the fear

[Verse 1]
Standing at the edge of the water, my toes on the stone, I've been counting to three for a year
Every time I got close to the jump I could hear it, the footsteps, the breath, getting near
It said, "Wait for the weather, wait for a sign, wait till you're stronger and older and sure"
So I waited and waited, the tide kept on turning, and nobody came to the shore
I watched other people dive in with their clothes on, laughing and bleeding and loud
Couldn't tell if they were brave or just quicker, but they surfaced and stood on the cloud
And I figured it out on the stone in the wind, it was never about being bold
Fear is a hunter that only can catch you if you stand there long enough to grow cold

[Hook]
Outpace the fear, outpace the fear
Be gone before it finds you here

[Drop]
Jump, now, go

[Verse 2]
So I jumped with my eyes open wide and the water was fire and ice on my skin when I hit
And I sank for a second, I swallowed the sea, and a voice in my head said, "See, you quit"
But my legs started kicking before I could think, it's amazing what bodies remember to do
Ready is a feeling that shows up in the air, it never shows up on the stone with you
Every stroke was a no to the waiting, a no to the someday, the after the rain
And I came up roaring with salt in my teeth and a laugh that was louder than all of the pain
Now I'm out in the deep where the current is strong and the shore is a line in the haze
I don't need to be ready, I need to be moving, the rest is just weather and days

[Final Hook]
Outpace the fear, I outpaced the fear
Now it's running to catch me here

[Outro]
Toes on the stone
Count to three
Don't
Just go
Outpace the fear
"""

[[songs]]
id = "soft-lie-slow-knife"
title = "Soft Lie, Slow Knife"
family = "truth"
form = "argument"
groups = ["hiphop"]
model = "B"
voice = "steady warm female hip hop vocalist in her thirties, conversational half-time sung rap, a firm clear chorus, small catches in the voice on the hard lines"
about = "a woman torn between a sweet lie and a hard truth for someone she loves who is walking toward a fire"
lyrics = """
[Intro]
I have held a sentence in my mouth for half a year
Rolled it like a stone until it wore my tongue down to the fear

[Verse 1]
You keep telling me the plan, and I keep nodding at the plan
I keep handing you the sugar when you're reaching for a hand
You are walking toward a fire with a smile and a map
And I'm clapping from the side because I'm scared of what comes back
My heart says, "Let them be, they're happy, who are you to steal the sun?"
My mind says, "If you love them, you will say it, say it once"
One of them is gentle and the other one is right
And I'm losing sleep between them like a moth against the light
Is it kindness if it's comfortable, or kindness if it's true?
Is it loyal to be quiet when the quiet's hurting you?

[Chorus]
Soft lie, slow knife, but a hard word cuts you clean
It will sting you for a moment, but it won't rot in between
I would rather lose your smile tonight than lose you to a dream
I love you too much to lie to you, honesty cuts clean

[Verse 2]
There was someone long ago who told me just what I could take
Said the thing that no one dared to, said, "You're making a mistake"
I was furious for weeks, I called them cruel, I called them cold
Then I watched the thing they warned me of come down the way they told
Every friend who only cheered me let me walk into the wall
The one who made me angry was the only one who called
So I owe it to that voice to be that voice for you
Even if you hate me for it, even if we're through
My heart says, "You will lose them", and my mind says, "Maybe so
But the ones who never warn you are the ones who let you go"

[Bridge]
So here it is, no sugar, no disguise
I can see the cliff from here, I can see it in your eyes
If you walk, I'll still be standing where the road begins to bend
I said it 'cause I love you, not because I need to win

[Final Chorus]
Soft lie, slow knife, so I put the knife away
It might sting you for a moment, but it heals and it will stay
I would rather lose your smile tonight than lose you to a dream
I said it 'cause I love you, honesty cuts clean

[Drop]
Say it once

[Outro]
That sentence in my mouth, I finally set it down
Lighter on my tongue now, whatever road you choose now
"""

[[songs]]
