I'm not running from the near side, I am simply not there now
I'm the water and the crossing and the light across the bow
There's a stillness in the middle where the current doesn't pull
Where the empty heart I carried is already somehow full
And the far bank isn't far, it was the river all along
And the one who wanted crossing was the crossing and the song

[Chorus]
Asato ma sadgamaya
Tamaso ma jyotirgamaya
Mrityor ma amritamgamaya
Carry me across, carry me across

[Bridge]
No more near side
No more far
Just the river
And the light where you are

[Final Chorus]
Asato ma sadgamaya
Tamaso ma jyotirgamaya
