How the quiet started talking, how it pulled my shoulders down
And I swore I'd never stop again, I'd keep the wheel in flight
I would dance through every morning, I would outrun every night
But you can't outrun the weather when the weather is your own
And a top that's spun too wildly wobbles off and hits the stone
So I'm learning there's a centre in the middle of the whirl
Where the axis doesn't move at all, the stillest point in the world
My body says, "Then rest there, you don't have to stop to breathe"
My spirit says, "Then turn there, let the turning carry me"
