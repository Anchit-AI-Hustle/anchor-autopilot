about = "two old friends who drifted to opposite ends of the festival meet again at dawn under the trees and find out that what held them never let go"
lyrics = """
[Intro]
Two trees on the hill and a mile of crowd in between
But under the ground, where nobody's been, roots find each other

[Verse 1]
You say, "We were close once, then the years pulled us apart
You went out into the morning, I went deeper in the dark"
I say, "I watched you dancing from the far side of the field
And I didn't cross the crowd to you, I didn't know how it would feel"
You say, "I thought you'd changed, I thought you'd found another tribe
Somebody new to laugh with, someone braver at your side"
I say, "I thought the same of you, I'd see you laughing in the sun
And I'd tell myself you'd outgrown me, and I'd go back to the drum"
You say, "So why, when the thunder came, did I look round for you?"
I say, "The same reason I was searching every face I knew"
You say, "Maybe what we had is just a story that we keep"
I say, "Look down at your feet, the story's running deep"

[Chorus]
Branches go where the wind decides
Leaves come down when the summer dies
But under the ground where the dark is warm
Roots find each other through every storm
Roots find each other, roots find each other
Under the field, like a hand finds another

[Verse 2]
You say, "I'm scared of how it was, I'm scared we've grown too strange"
I say, "So am I, but strange is just a word for things that change"
You say, "I missed the night you fell, I wasn't there to catch your hand"
I say, "You're here at sunrise now, and that's enough to understand"
You say, "Then what do we do now, do we start it all again?"
I say, "We don't have to start it, we just sit here in the rain"
And we sit beneath the oak with both our backs against the bark
While the first light finds the valley and the last stars leave the dark
You say, "Do you feel that?" and I feel it through the ground
Like a heartbeat in the soil, like a slow and steady sound
I say, "That's the thing that held us when we didn't hold at all"
You say, "Then I'll stop counting miles," and we watch the shadows fall

[Drop]

[Chorus]
Branches go where the wind decides
Leaves come down when the summer dies
But under the ground where the dark is warm
Roots find each other through every storm
Roots find each other, roots find each other
Under the field, like a hand finds another

[Bridge]
Far apart
Up top
Tangled tight
Down below
Nothing broke
We just grew

[Final Chorus]
Branches go where the wind decides
Leaves come down and the summer dies
But under the ground where the dark is warm
Roots find each other, and we held through the storm
Roots find each other, roots find each other
Under the field, we were holding each other

[Outro]
Two trees on the hill, and the crowd going home in a stream
And under the ground, where nobody's been, roots find each other
"""

