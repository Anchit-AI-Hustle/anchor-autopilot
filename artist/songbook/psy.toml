[[songs]]
id = "light-needs-shadow"
title = "Light Needs Shadow"
form = "letter"
family = "truth"
groups = ["psy"]
model = "B"
voice = "warm grainy female contralto, psy soul half-time sung rap, unhurried and intimate like reading a letter aloud, a full ringing chorus"
about = "a letter to the you who only ever wanted to be bright, saying the glow only shows because of the shadow behind it"
lyrics = """
[Intro]
I'm writing this to you before the sun is fully up
To the you who only ever wanted to be gold

[Verse 1]
You used to hide the parts of you that didn't catch the light
Kept your smile turned to the stage and your back turned to the night
You thought that if they saw the bruise they'd never see the glow
So you painted every crack in gold and never let it show
I watched you dance at sunrise like the dark had never been
Like the tears you cried at midnight never once had touched your skin
But I was there in the middle when the strobes all cut out
When you sat down on the floor and you were swallowed up in doubt
And I swear the lights came back and hit you different than before
Like the shadow gave them something they could finally shine for

[Chorus]
Light needs shadow, the flame needs the night
Nobody sees a candle in a room full of white
So bring me the dark that you keep in your chest
Light needs shadow, so I'll hold you with the rest

[Drop]

[Verse 2]
I know you'll read this and you'll say, "But I was hard to hold"
You'll say the shadow made you sharp, it made you hard and cold
And maybe sometimes, yes, it did, I won't pretend it didn't sting
But a song without a silence isn't any kind of thing
The water only glitters 'cause the deep is underneath
A smile only means something when you've known what it is to grieve
So stop apologizing for the hours you went dim
For the nights you didn't answer and the weeks you couldn't swim
I'd rather have the whole of you, the ember and the ash
Than a picture of a sunrise someone painted in a flash

[Chorus]
Light needs shadow, the flame needs the night
Nobody sees a candle in a room full of white
So bring me the dark that you keep in your chest
Light needs shadow, so I'll hold you with the rest

[Bridge]
Keep the scars
Keep the quiet
Keep the night you couldn't sleep
They're the reason that you glow

[Final Chorus]
Light needs shadow, the flame needs the night
I never saw you shining till I saw you without light
So I'll keep the dark that you hid in your chest
Light needs shadow, and I love you with the rest

[Outro]
The sun is fully up now, and I'm signing off in gold
To the you who's finally learning that the shadow makes it whole
"""

[[songs]]
id = "the-body-knows-first"
title = "The Body Knows First"
form = "dialogue"
family = "awakening"
groups = ["psy"]
model = "B"
voice = "duet of a low hushed male baritone and a bright clear female soprano, psychedelic call and response, half-time sung verses trading lines, the two voices meeting in harmony on the chorus"
about = "the mind and the body argue on the dance floor about whether anything has changed, and the body is right first"
lyrics = """
[Intro]
Before I had the word for it, before I had a thought
The body knows first

[Verse 1]
My head says, "Nothing's changed, it's just another night
Same lights across the ceiling, same heat, same fight"
My feet say, "Something's moving, can't you feel it in the floor?
There's a door inside the bassline that was never there before"
My head says, "That's the tiredness, that's the sweat, the hour"
My hands say, "Then why are we opening like a flower?"
My head says, "Give me proof and I'll believe you, give me reason"
My chest says, "Reason is a coat for a colder season"
My head says, "I have kept us safe, I've kept us small"
My spine says, "Small was never safe, it was a wall"

[Chorus]
The body knows first, before the mind can say
Goosebumps on my arms like the sun before the day
I don't need to understand it to know that it is real
The body knows first, and the mind will learn to feel

[Drop]

[Verse 2]
My head says, "Wait, let's think about it, slow it down"
My heart says, "We've been thinking, now we're starting to drown"
My skin says, "Every hair is standing up to listen"
My head says, "That's a shiver, it's the air, it's nothing missing"
My lungs say, "Then why are we breathing like we've climbed a hill?
Why is every light in here so bright, and why am I so still?"
My head goes quiet, puts its worries down for once
And the body takes the lead like it was waiting there for months
My head says, "Okay, show me," and the body says, "Just stay"
And the two of us are dancing and the doubt has moved away

[Chorus]
The body knows first, before the mind can say
Goosebumps on my arms like the sun before the day
I don't need to understand it to know that it is real
The body knows first, and the mind will learn to feel

[Bridge]
Mind, you're not the enemy
Body, you're not a fool
One of you is the lantern
And one of you is the fuel

[Final Chorus]
The body knew it first, before the mind could say
Goosebumps on my arms and now the sun is on the way
I don't need to understand it, I can feel that it is real
The body knows first, now the mind has learned to feel

[Outro]
Before I had the word for it, before I had a thought
My feet were already moving, and the light was already caught
"""

[[songs]]
id = "sweat-the-ghost-out"
title = "Sweat The Ghost Out"
form = "revolt"
family = "inner-demons"
groups = ["psy"]
model = "A"
voice = "gritty female rapper with a low raspy chest voice, psy rap double time hard on the kick, half-whispered verses, a shouted hook the crowd throws back"
about = "an old regret that follows you everywhere gets danced out through the skin until it has nowhere left to hide"
lyrics = """
[Intro]
There's a ghost in my chest, and tonight we sweat the ghost out

[Verse 1]
It's been living in the cage of my ribs, every night it is rattling the bars when I sleep
Every mistake that I made with my mouth is a whisper it shoves in my ear on repeat
It wears the face of the worst of my days and it sits on my shoulder and laughs when I speak
I have tried to outrun it, outdrink it, outsmile it, it follows me everywhere, quick on its feet
So I came to the floor where the bass is a furnace, the kick is a hammer that knocks on the bone
I am pouring it out of my pores, every drop is a memory leaving and leaving me alone
Let the strobe be the sun on the fog, let the acid line peel all the paint from the walls
Every bead running down from my temple's a sentence it whispered, and I'm letting them fall
I'm not scared of the shape in the corner, I'm looking it straight in the eye and I'm dancing on top
It can scream all it wants in my chest, but the beat is a hundred and sixty and it won't make it stop

[Hook]
Sweat the ghost out
Sweat the ghost out, let it go

[Drop]
Out, out

[Verse 2]
Now it's slipping, it's losing its grip on my throat, it is sliding away down the line of my back
Every spin that I take is a twist of a key and I'm hearing the lock of it crack
It was never as big as it looked in the dark, it was only as big as I fed it at night
Now it's starving, it's thin, it's a sheet on a line, and the wind of the bass blows it out of my sight
I can feel where it lived, there's a room in my chest and the room is just air and a window and light
And the crowd is a storm that is washing it out, every shout is a wave, and the floor's running white
I'm not saying I'm healed, I'm not saying it's gone and it won't come knocking again
But I know where to bring it, I know what to do, I'll be here with the kick and my friends
So tonight I am salt, I am steam, I am heat coming off of a body that's finally free
And whatever was haunting the rooms of my ribs has to sweat its way out and get off of me

[Hook]
Sweat the ghost out
Sweat the ghost out, let it go

[Outro]
Breathe
It's gone quiet
Only me in here
Sweat the ghost out
"""

