# ANCHOR songbook, group psy: psychedelic hard techno, 160 to 176 BPM, hypnotic, acid lines, human vocals.

[[songs]]
id = "sunrise-at-the-fence"
title = "Sunrise at the Fence"
form = "story"
groups = ["psy"]
voice = "warm female alto, slightly hoarse from a long night, half-sung close to the mic, smiles audibly on the long vowels"
about = "losing your best friend in a festival crowd at 4am and finding her at the back fence as the sun comes up"
model = "B"
family = "ritual"
lyrics = """
[Intro: half-whispered]
Phone at two percent, your name still on the screen

[Verse 1: half-sung]
We came in holding hands like the gates might close on us
You tied my wristband tighter, said don't you dare get lost
Then the kick dropped low and the whole field leaned
And your yellow scarf went under like a coin in a stream

[Verse 2]
I asked a boy in face paint, I asked a girl with a flag
I walked the stage three times with your water in my bag
Every hour folded over, every song was the same song
My feet said it was minutes and the sky said it was long

[Pre-Chorus]
Then the black went grey, then the grey went gold

[Chorus]
And there you were at the sunrise at the fence
Shoes in your hand like nothing ever happened
Hair full of dust, you said where did you go
Like I was the one the morning had to find

[Drop]

[Bridge: whispered]
We sat on a cooler and didn't say a word
Watched the cleaners rake the cups into a little hill
I thought, this is what I'll keep when I'm old
Not the drop, not the lights, just your cold hand still

[Drop]

[Final Chorus]
Meet me at the sunrise at the fence
Every year, whoever loses who
Hair full of dust, I'll say where did you go
And you'll say I was right here waiting for you

[Outro: spoken]
Two percent. Still enough to take one picture.
"""

[[songs]]
id = "melt-the-hours"
title = "Melt The Hours"
form = "revolt"
family = "defiance"
groups = ["psy"]
model = "A"
voice = "husky female psy trance vocalist in her late twenties, half-whispered double-time verses riding the acid line, a ringing terrace chant on the hook, real breaths between bars"
about = "refusing to let the hour decide when the night is over: the crowd sets fire to time and dances straight past it"
lyrics = """
[Intro]
Every hand on every wrist is ticking, so tonight we melt the hours

[Verse 1]
They hung a face above the door and said the hour decides when I rise and I fall
Every second was a coin in a fist, and the fist never opened at all
I was keeping the time like a prisoner keeps all the scratches he cuts in the stone
Counting minutes on the back of my hand till the minutes had swallowed me whole
Now the acid is bending the line and the bass is melting the hands on the face
Twelve becomes water, the one becomes smoke, and the six is a snake in the haze
I can feel every heartbeat refusing the order, a hundred and sixty and climbing
Every body around me is swinging the same way, a tide that has slipped out of timing
So I strike the first match on the glass of the dial and I watch how the minute hand bends
There is no closing time when the floor is alive and the morning is only a friend

[Hook]
Melt the hours, melt the hours
Let the morning wait outside

[Drop]
Melt it down

[Verse 2]
They will tell you the night has a border, a line on the floor that you are not meant to cross
I am stepping right over it laughing, my arms in the air, and I am not counting the cost
Every warning they wrote on the wall is a ripple of light that is sliding away
Every rule that they bolted to time is unscrewing itself as the strobes start to sway
Now the crowd is one animal breathing, a thousand of lungs pulling air on the beat
And the floor is a drum and the drum is a heart and the heart has forgotten defeat
I will not kneel to an hour again, I will not hand my nights to the wall
Let the hands on the dial go spinning like dancers, let the glass of the face start to fall
When the sun comes to find us still moving, it will have to come in through the smoke
And the clock will lie down in the ashes and tick, and nobody hears it, it is broke

[Hook]
Melt the hours, melt the hours
Let the morning wait outside

[Outro]
Listen
No ticking
Only the kick
Melt the hours
We are still here
"""

[[songs]]
id = "face-the-undertow"
title = "Face The Undertow"
form = "confession"
family = "inner-demons"
groups = ["psy"]
model = "B"
voice = "soft-edged male tenor in his thirties, psychedelic half-sung confession close to the mic, the voice cracking open into full chest on the chorus, audible breaths"
about = "admitting that the pull you keep swimming away from lives inside you, then turning round to face it and finding you can breathe"
lyrics = """
[Intro]
I have stood at the edge of the water a thousand nights
Ankles in the foam, pretending I was only watching the lights

[Verse 1]
There's a pull below the surface that I never say out loud
It waits behind my ribs while I am laughing in the crowd
I hold my smile up like a lantern high above the tide
And nobody thinks to ask me what is moving down inside
I've been swimming parallel, the way the lifeguards always teach
Never fighting with the current, never drifting out of reach
But the shore just keeps on sliding and the sand gives way to stone
And every time I swim away, I swim back here alone
My head says, "Keep on moving, it can't drown what doesn't stop"
My chest says, "It's not water, it's the weight you never dropped"

[Chorus]
So I turn around and face the undertow
Let it wrap around my legs and pull me low
I was running from the deep, but the deep was always me
Face the undertow, and find out I can breathe

[Drop]

[Verse 2]
I confess I loved the running, it was easier than truth
Every mile was an excuse and every night was my proof
I could blame it on the music, I could blame it on the dark
I could dance until the morning just to never hear it bark
But tonight the kick is slower in the middle of my chest
And the strobe lands on the water like it's asking me to rest
So I let my feet stop kicking and I let my arms go wide
And the thing I feared for years just pulls me gently to its side
It is heavy and it's freezing and it knows me by my name
It has every face I hid from, and it holds them all the same

[Chorus]
So I turn around and face the undertow
Let it wrap around my legs and pull me low
I was running from the deep, but the deep was always me
Face the undertow, and find out I can breathe

[Bridge]
No more swimming sideways
No more smiling on the shore
I went down with my eyes open
And I found a floor

[Final Chorus]
Now I turn around and face the undertow
It still wraps around my legs, but I don't go
I was running from the deep, but the deep was always me
I can face the undertow, and now I know I breathe

[Outro]
I still stand at the edge of the water some nights
But I walk in to my chest now, and I'm the one who holds the lights
"""

[[songs]]
id = "wake-inside-the-wave"
title = "Wake Inside The Wave"
form = "celebration"
family = "awakening"
groups = ["psy"]
model = "A"
voice = "bright female mezzo psy trance singer, airy half-sung double time that lifts into a full open shout on the hook, laughter caught between the lines"
about = "the drop hits and you wake up inside your own body for the first time in years, together with everyone around you"
lyrics = """
[Intro]
Somewhere under all the noise I feel it start, I wake inside the wave

[Verse 1]
I was sleepwalking for years with my eyes open wide, nodding along to the rhythm of days
Every morning a copy of morning, my feet on the ground and my mind in a haze
Then the bassline came in like a tide through the soles of my feet and it climbed up my spine
And a light I forgot I was carrying flickered and broke through the frost on the glass of my mind
Every hair on my arms is awake and the skin on my neck is a field in the rain
I can taste the electric of air in my mouth like a storm rolling over the plain
Somebody beside me is laughing out loud and I'm laughing, I don't even know why
There is gold in the smoke on the ceiling, a sun coming up in the middle of night
And the fog in my head that I wore like a coat is evaporating into the beam
I have never been this awake in my life and I swear to you this is no dream

[Hook]
Wake inside the wave
Wake inside the wave, we rise

[Drop]
Rise up

[Verse 2]
Now the second wave crashes, it lifts me up higher, my shoulders are loose and I'm climbing
Every tired old version of me is a skin I am shedding and throwing behind me
I can hear my own heart like a drum in a canyon, it's louder than all of my doubt
And the doubt was a whisper, the heart is a choir, and the choir is shouting it out
Thousands of us with our arms in the air while the lasers are painting the sky
Every one of us woke at the very same moment and nobody's asking us why
I was waiting for something to save me, a sign, or a hand coming down from above
But the wave was inside me the whole time, the swell and the lift and the love
So I open my arms to the light as it floods and I let it wash over my skin
I am done being half of myself, I am wide awake, let the morning come in

[Hook]
Wake inside the wave
Wake inside the wave, we rise

[Outro]
Breathe in
I'm here
I'm awake
Wake inside the wave
"""

[[songs]]
id = "chase-the-first-light"
title = "Chase The First Light"
form = "argument"
family = "drive"
groups = ["psy"]
model = "B"
voice = "earnest warm male baritone, psy hip hop half-time sung rap, two inner voices argued in the same tone, an open lifted chorus with a grin in it"
about = "half of you wants to wait for the perfect moment, the other half wants to move now, and by dawn both of them are running toward the first light"
lyrics = """
[Intro]
The sky is still black but the edge is wearing thin
I can feel it on my skin, the day about to begin

[Verse 1]
Half of me says, "Wait, you are not ready, not yet
Learn a little more, sleep a little more, settle every debt"
Half of me says, "Ready is a story fear repeats
You've been standing on the start line till it grew roots in your feet"
I can see both sides, I'm not pretending one is wrong
The careful one has kept me breathing and kept me safe so long
But safe became a room and the room became a wall
And the wall became the only thing I ever saw at all
So I hear the kick come in like footsteps on a road
And my legs begin to answer before my mind can tell them no

[Chorus]
Chase the first light, don't wait for the sun to call your name
Every hour you hold still is an hour that won't come again
Fear says stay, but the morning never waits for anyone
Chase the first light, and run

[Drop]

[Verse 2]
The careful voice gets louder, says, "Remember how you fell
The gravel in your knees, the night you couldn't tell"
And I remember, yes, I carry every bruise I earned
But a bruise is just a lesson and the lesson is I learned
The fearless voice gets quiet, doesn't shout, just takes my hand
Says, "Nobody gets a map, you draw it as you land"
Maybe both of them are right and both are trying to be kind
One is guarding what I have and one is chasing what I'll find
So I let the careful one pack water and the brave one tie the lace
And I carry both together as I step into the race

[Chorus]
Chase the first light, don't wait for the sun to call your name
Every hour you hold still is an hour that won't come again
Fear says stay, but the morning never waits for anyone
Chase the first light, and run

[Bridge]
No more waiting rooms
No more someday
The horizon is a line I can touch
If I move today

[Final Chorus]
I chase the first light, I don't wait for the sun to call my name
Every hour I held still is an hour I'm taking back again
Fear can stay, but the morning never waits for anyone
I chase the first light, I run

[Outro]
The sky was black but the edge has broken through
I can feel it on my skin, the day is running too
"""

[[songs]]
id = "surrender-to-the-pulse"
title = "Surrender To The Pulse"
form = "mantra"
family = "devotion"
groups = ["psy"]
model = "A"
voice = "deep resonant male bass-baritone, psychedelic temple-style chant on the Sanskrit, low unhurried double-time English verses, a warm open swell on the hook"
about = "letting go of the self on the floor while the crowd chants Om Namah Shivaya, devotion to the stillness that dances under the beat"
lyrics = """
[Intro]
Om namah shivaya, om namah shivaya

[Verse 1]
I walked in with my name like a badge on my chest and my pockets all heavy with plans
Every shoulder I passed was a wall, every glance was a contest, I held myself tight in my hands
Then the drone of the bass started low like a hum from the floor of a cave in the hills
And the hum found the hum in my throat and the two of them met where the breath becomes still
I could feel every heartbeat around me arriving in time with the beat of my own
Like a river that splits into thousands of streams and then finds it was one all along
I let go of my name on the second drop, I let go of my face on the third
I let go of the story I tell when I'm lonely and found I was more than a word
There is fire on the stage like a forehead, a flicker of ash and a crescent of light
And I bow to the stillness that dances, the one who keeps time in the heart of the night

[Hook]
Surrender to the pulse
Om namah shivaya
Surrender to the pulse

[Drop]
Om namah shivaya

[Verse 2]
Now the drums are a rain on a lake and each ripple is someone I used to be
And I watch them roll out to the edges and soften and vanish as far as I see
Every worry I brought is a garment I drop on the floor as I spin through the smoke
Every grudge is a stone I have carried for miles and I lay it down gently and go
I am not the one dancing, the dance is the one who is moving this body tonight
I am not the one breathing, the breath is a tide coming in from the edge of the light
There's a stillness in the middle of the storm like an eye where the dancer can rest
And a thousand of us bowing together with nothing to ask and nothing to protect
When the sun climbs the hill I will pick up my name and I'll wear it a little more loose
For I know what is under the name and the mask, and it's nothing that I can lose

[Hook]
Surrender to the pulse
Om namah shivaya
Surrender to the pulse

[Outro]
Om namah shivaya
Bow to the stillness
Surrender to the pulse
Om
"""

[[songs]]
id = "leaving-the-shoreline"
title = "Leaving The Shoreline"
form = "story"
family = "escape"
groups = ["psy"]
model = "A"
voice = "smoky female alto, psy rap double time, breathy and urgent like she is still running, the hook sung long and wide over the acid line"
about = "two friends slip away from the festival before dawn and run into the sea, leaving everything heavy behind on the sand"
lyrics = """
[Intro]
Shoes in the sand and your hand in my hand, we are leaving the shoreline

[Verse 1]
We slipped out the back while the drop was still falling, the crowd was a forest of arms in the air
You tugged at my sleeve and you pointed at nothing, a stripe in the black where the sea was out there
So we ran down the dunes with the bass in our backs and the grass drawing lines on the skin of our legs
Every step was a door that we shut on the noise, every breath was a rope that we cut from the pegs
We were laughing so hard that we fell in the sand and lay still with the sky turning over our heads
And the stage far behind was a heart in a shell, all the lights just a smear of the blues and the reds
Then you stood up and walked to the lip of the foam with the moon spilling silver along your back
And you turned and you said, there is nothing back there that the tide cannot carry, so don't you look back
I could feel all the weight that I brought to the field, every doubt I had packed, every fear I had stacked
And I dropped it like clothes on the sand at my feet and I followed you into the black

[Hook]
Leaving the shoreline
Leaving the shoreline, we're gone

[Drop]
Swim out

[Verse 2]
Now the water is cold and it bites at my chest and it knocks every thought from my head like a bell
And the swell lifts us up and it sets us back down like a hand that has rocked us before, I can tell
Every wave is a page that I don't have to read, every crest is a wall I don't have to climb
You are floating beside me, your hair like a weed, and we're dancing in water, off rhythm, in time
The festival hums like a hive on the hill and the beach is a line getting thinner and gone
All the names they had called me are shells on the sand and the sea is already rolling them on
When the sun cracks the edge of the water in gold, it's a door coming open in front of our eyes
And we swim for the crack like it's calling us home, with the salt in our mouths and the gulls in the skies
I don't know where we're going, I don't need to know, there is light on the water as far as I see
We are leaving the shoreline, the shore can keep everything, everything heavy that used to be me

[Hook]
Leaving the shoreline
Leaving the shoreline, we're gone

[Outro]
Look back once
It's so small
Let it go
Keep swimming
"""

