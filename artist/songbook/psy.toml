[Drop]

[Chorus]
Spin or fall, spin or fall
Nothing stands still when the morning calls
A top only stands while it's turning round
Spin or fall, and I won't touch the ground
Every turning thing is quiet at its core
Spin or fall, and I'm not afraid anymore

[Bridge]
Feet on the earth
Head in the sky
Still in the middle
Wide in the eye
Turning, turning
Never down

[Final Chorus]
Spin or fall, spin or fall
I found the stillness inside of it all
A top only stands while it's turning round
Spin or fall, and I'm spinning on solid ground
Every turning thing is quiet at its core
Spin or fall, and I'm home on the floor

[Outro]
A top only stands while it's turning around
