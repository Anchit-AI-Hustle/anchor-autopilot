about = "a letter to the friend who went home before sunrise, telling them how the first light turned the mud and every tired face gold and woke something in me"
lyrics = """
[Intro]
You left at four with your shoes in your hand and a yawn
So I'm writing you this from the hill, because you missed the dawn

[Verse 1]
The night was nothing special, I was tired to the bone
Dancing out of habit with the crowd and still alone
The mist was in the valley and the bass was in the trees
And the cold was on my shoulders and the mud was on my knees
Then the sky behind the stage began to crack along the seam
Like an egg about to open, like the ending of a dream
And the first light hit the speakers and it ran along the ground
And it poured across the puddles till they shone without a sound
And I swear I felt it happen in the middle of my chest
Like a window someone opened in a room I'd never guessed
Every stranger had a halo made of sweat and morning glow
Every tired face was lit like it had something new to show

[Chorus]
And the mud turned gold
On the boots and on the skin
On the hands that we were raising
On the field that we were in
I was waking and I didn't
Know that I'd been sleeping long
And the mud turned gold
And I wish you'd seen the dawn

[Verse 2]
I know you'll say a sunrise is a sunrise, nothing more
That you've seen a hundred mornings and you've walked out of the door
But this one didn't rise, it came and found me where I stood
It walked right through the crowd to me the way a good friend would
There's a girl who'd lost her voice and she was laughing anyway
There's a boy asleep against a speaker, smiling at the day
And the music didn't stop, it just got softer, like it knew
Like the whole field had been waiting for the light to come through
I was grey for half a year, and I didn't even know
That a person can go out like a candle, very slow
But a match can strike at sunrise in the middle of a hill
And I'm burning as I write this, and I think I'm burning still

[Drop]

[Chorus]
And the mud turned gold
On the boots and on the skin
On the hands that we were raising
On the field that we were in
I was waking and I didn't
Know that I'd been sleeping long
And the mud turned gold
And I wish you'd seen the dawn

[Bridge]
Next time
Stay
Next time
Wait
Next time
Watch the sky with me

[Final Chorus]
And the mud turned gold
On the boots and on the skin
On the hands that we'll be raising
On the field we'll be dancing in
I was sleeping and I didn't
Know it till the light came on
And the mud turned gold
And next time you'll see the dawn

[Outro]
You left at four with your shoes in your hand and a yawn
Next time I'm keeping the other hand, and we'll stay for the dawn
"""

[[songs]]
id = "stop-the-rewind"
title = "Stop The Rewind"
family = "inner-demons"
form = "revolt"
model = "A"
groups = ["psy"]
voice = "sharp male baritone with a whispered edge, psy rap double time locked to the rolling bass, the hook chanted low like a spell"
about = "one memory keeps replaying behind my eyes every night, and at sunrise on the floor I refuse to press it again and let it play out to the end"
lyrics = """
[Intro]
Same night, same words, same door, every night, stop the rewind

[Verse 1]
There's a reel in my head with a night on it, one night, and it plays when I lie down to sleep
Every word that I said is in focus, the look on your face is a cut that is fresh and deep
I can see every second in slow motion, the door and the rain and the light on the street
And I wake up at four with it playing again like a fever that wants to repeat
I have watched it a thousand times over, the edges are scratched and the colour is gone
But my hand keeps on pressing it back to the start like a tongue on a tooth that is wrong
And the acid line loops like the loop in my head, the same bend and the same little climb
Every turn of the bass is a turn of the reel, every bar is the same piece of time
But tonight in the field with the sun coming up there is something that won't let me sink
There's a voice in my blood saying, play it out once to the end, and then let it go blank

[Hook]
Stop the rewind
Stop the rewind, let it play out

[Drop]
Let it run

[Verse 2]
So I sit with it, watch it, the door and the rain and the words that I wish I had swallowed
And I let it go past the place where I always stop, past the part that I never have followed
There's a me in the film who walks out in the rain and he's hurting, but look, he survives
There's a morning that comes after that, and a year, and a field, and a crowd full of lives
I was keeping it stuck at the worst of the scene like the worst was the end of the reel
But the film keeps on going, it always kept going, it's only my hand on the wheel
So I take my hand off, and I let the reel spin, and it rattles and flutters and runs
And it ends in a flicker of white on the screen, and the white is the light of the sun
Now the loop in the bass is just music again, it's a circle that carries me home
And the night I replayed is a night that I lived, it was mine, it was real, and it's gone

[Hook]
Stop the rewind
Stop the rewind, I let it play out

[Outro]
Credits roll
Lights up
The reel runs out
Stop the rewind
Breathe
"""

