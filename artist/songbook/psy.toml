[[songs]]
id = "did-you-eat"
title = "Did You Eat?"
form = "dialogue"
groups = ["psy"]
model = "B"
voice = "duet of a husky young female alto, giggly and worn out after a long night, and an older female mezzo with a firm, tender, sleepy speaking-singing tone; they overlap only on the final chorus"
about = "a daughter tiptoes home at dawn after a rave and finds her mother awake at the kitchen table, asking only whether she ate"
lyrics = """
[Intro]
Five fifteen, the gate latch, my boots off before the step
The kitchen light still burning and a tiffin on the table, wrapped

[Verse 1]
I came in like a burglar with my glitter and my hum
Practised "I slept at Ria's" in the auto all the way home
My ears are still ringing and the bass is in my knees
There's a stamp on my hand like a bruise I hope she won't see
And there she is in her nightie with her glasses on her head
Pretending to be reading the news she's already read
I wait for the lecture, the "do you know what time it is"
The cousins, the neighbours, the "what if this, what if this"
But she looks at me a long time like she's counting all my bones
Then she gets up and she lights the stove and leaves the rest alone

[Chorus]
"Did you eat?" That's the whole of it
Not where were you, not who with, not what you did
"Did you eat?" and the tawa starts to hiss
Every fear she had all night is folded into this
"Did you eat, beta, did you eat?
Sit, there's ghee, the roti's hot, take a seat"

[Drop]

[Verse 2]
I heard the gate at three and it was only the wind
At four it was the milkman, and I started counting in
I didn't call, I promised I would never be my mother
Who stood out on the road in her slippers for my brother
So I sat with the newspaper and read one line for hours
Kept your parathas in a cloth beside the temple flowers
I can smell the smoke in your hair and a thousand strangers' heat
I was twenty once, I had my own late nights and sore feet
My heart says, "Ask her everything, the who and the where"
My head says, "Ask her that and she'll stop coming here"
So I ask the only question that I know she'll answer true
If she's eaten, she's still mine, and the rest can wait till noon

[Chorus]
"Did you eat?" That's the whole of it
Not where were you, not who with, not what you did
"Did you eat?" and the tawa starts to hiss
Every fear she had all night is folded into this

[Bridge]
"Ma, I'm sorry, I should have called"
"Eat first"
"It was the best night of my life"
"Then eat more"
"You waited up"
"I always will"

[Final Chorus]
"Did you eat?" Yes, Ma, and you?
Two plates at the table and the sky going blue
"Did you eat?" means "come home, I'm awake"
Means a light in the kitchen for as long as it takes
"Did you eat, beta, did you eat?"
"Sit with me, Ma, the roti's hot, take a seat"

[Outro]
Five forty, the gate latch, and she's asleep in her chair
I put the tiffin back and her shawl over her hair
"""

[[songs]]
id = "late-by-whose-clock"
title = "Late By Whose Clock?"
form = "revolt"
groups = ["psy"]
model = "A"
voice = "smoky male baritone with a sharp, amused edge, cool double-time half-rap delivered almost like conversation, a laugh breaking into the final outro line"
about = "a thirty two year old refuses the family timetable for marriage, salary and a house, and keeps his own pace"
lyrics = """
[Intro]
Wall clock in the drawing room ticking at my back, late by whose clock?

[Verse 1]
Bua at the wedding with a plate of jalebi says, "Beta, you're thirty two, what's the plan?"
Every uncle has a girl on his phone and a flat and a salary in hand
They have drawn me a calendar, boxes filled in, the promotion, the wedding, the son
With a little red circle round the year I should be done, and that year has already gone
Like I'm running behind in a race I never entered, on a lap I never agreed
Like the hands on the clock in the drawing room spin for the neighbours and never for me
But my body keeps time of its own, it's a drum that was tuned long before I was born
And it says I am growing the way that a banyan grows, roots first, slow, then out like a storm

[Hook]
Late by whose clock?

[Drop]
Tick, tock, mine

[Verse 2]
So I took the clock down from the wall and I sat on the floor with it ticking in my lap
Papa came in in his vest with his tea and he looked at the nail and he looked at the gap
He sat down beside me, his knees cracking loud, and he told me what I'd never been told
Married at twenty two, nobody asked him, his father just pointed and said, "You're old"
"I was happy," he said, "but I never once chose, I ran early for somebody's bell
So be late, be as late as you want, be so late that the aunties forget how to tell"
He opened the back with a coin and took out the battery, held it up to the light
And the room went so quiet I heard my own pulse, not early, not late, it was right
I wake when I wake, I love when I love, I'll marry when I mean it, not before
And the clock's in a drawer with the battery out and its hands pointing up at the door

[Hook]
Late by whose clock?

[Outro]
Wall clock in a drawer
No tick at my back
Late by whose clock?
Mine
And mine says now
"""

[[songs]]
id = "papa-finally-danced"
title = "Papa Finally Danced"
form = "celebration"
groups = ["psy"]
model = "B"
voice = "round female alto with a gospel-tinged warmth, beaming half-sung delivery with quick little laughs between lines, opening up full and loud on the chorus"
about = "at her sangeet, a bride watches her father, who sat out every wedding for forty years, finally get up and dance"
lyrics = """
[Intro]
Marigolds strung from the ceiling and a dhol going wild by the door
Papa on his plastic chair, the one he's guarded forty years and more

[Verse 1]
Forty years of weddings and he never left that chair
Held the coats and held the gifts and held the handbags with care
Clapped a little off the beat, tapped one shoe under the cloth
Told the aunties, "No, no, no," and waved the whole thing off
Mummy used to pull his sleeve, he'd smile and shake his head
"Someone has to watch the shoes," is all he ever said
It's my sangeet tonight and the courtyard's full of light
Thirty cousins on the floor and the bulbs strung up like kites
Then the DJ played the song from his college cassette
The one he hums when he shaves, the one he can't forget
I saw his shoulder move, just a little, like a wave
I saw Mummy see it too, and I saw her look away

[Chorus]
Papa finally danced, Papa finally danced
Arms up like a schoolboy who just got his first chance
Forty years of sitting down, forty years of "no"
And tonight he's in the middle and he's never letting go
Papa finally danced and the whole room lost its mind
Somebody hold the coats, he left the chair behind

[Drop]

[Verse 2]
After, at two, by the gate with the tea going round
He told me why he never danced, his eyes down on the ground
He was seventeen at a cousin's and he jumped in with the band
His father laughed in front of everyone and took him by the hand
Walked him back to the chair and said, "Men don't make a show"
And he sat for forty years because one man told him so
I said, "Papa, why tonight?" and he wiped his glasses clean
Said, "I watched you dance, and I've never seen you look that free"
"I didn't want to be the chair in my daughter's memory
Sixty two is late, but late is better than a seat"

[Chorus]
Papa finally danced, Papa finally danced
Arms up like a schoolboy who just got his first chance
Forty years of sitting down, forty years of "no"
And tonight he's in the middle and he's never letting go

[Bridge]
His knees hurt the next morning
He didn't care
He asked for the song again at breakfast
Mummy hid the chair

[Final Chorus]
Papa finally danced, and he's dancing on the stairs
To the pressure cooker whistle and the bells at evening prayers
Forty years of sitting down and one night of "yes"
And the boy his father sat down is up in his best
Papa finally danced, and he's teaching me the step
Somebody hold the coats, we are not finished yet

[Outro]
Marigolds still on the ceiling, the dhol's gone home for the night
Papa's plastic chair is out in the yard, and it's empty, and that's right
"""

[[songs]]
id = "water-cannot-wet-it"
title = "Water Cannot Wet It"
form = "mantra"
groups = ["psy"]
model = "B"
voice = "clear older female voice with a soft temple-singer vibrato, unhurried half-sung English, the Sanskrit chanted slowly and evenly in a low warm register"
about = "a woman afraid of water since childhood stands on the ghat steps at Rishikesh while her grandmother recites Bhagavad Gita 2.23"
lyrics = """
[Intro]
Ghat steps at Rishikesh, the iron chain tight in my fist
Nani on the step behind me with her beads turning in her wrist

[Verse 1]
I was six at the canal when the bank gave way beneath
Brown water in my nose, my ears, and in between my teeth
My cousin pulled me out by the plait, I coughed for hours
