about = "after years of saving every joy for some perfect later, I realise at dawn that later never promised me anything and throw a party for right now"
lyrics = """
[Intro]
I kept every good thing for later, but later is a liar

[Verse 1]
I was saving my laugh for a better occasion, my dance for a summer to come
Kept the best of my voice like a coin in my pocket, I'd spend it when all this was done
Every hug I held back for a holiday, every big word for a day in the sun
Every thank you, I'm sorry, I love you, I folded and kept them for some other one
Then the sky at the back of the forest went pink and the mist started lifting away
And I stood in the crowd with my pockets all heavy with everything saved for a day
That was never once promised to anyone here, it's a rumour that nobody made
Every later I banked on was sand at the edge of the water, and look how it fades
So I'm pulling it out, every word, every dance, every laugh I was keeping for good
And I'm spending it here on the grass in the mud at the dawn like I always knew that I could

[Hook]
Later is a liar, later is a liar
Now is all I've got

[Drop]
Now, now

[Verse 2]
So I'm holding my people too long and too tight till they laugh and they tell me to go
And I'm telling the stranger beside me her dancing is lighting the field, so she'll know
