Every thank you, I'm shouting it up to the trees like I'm throwing a fistful of snow
Let the careful keep waiting for perfect, the perfect is somebody's story, a lie
There is only the now, and the now is a river, it runs and it never runs dry
Every second I'm in is a firework going, I'm catching it bright in my eye
And I swear I won't save it, I won't put it back, I won't wait for a cloudless sky
When tomorrow arrives, if it comes, I will meet it the way that I'm meeting today
With my arms open wide and my pockets turned out and with nothing at all put away

[Hook]
Later is a liar, later is a liar
Now is mine

[Outro]
Spend it
All of it
Here
Later is a liar
Now
