# ANCHOR songbook, group psy: psychedelic hard techno, 160 to 176 BPM, hypnotic, acid lines, human vocals.

[[songs]]
id = "sunrise-at-the-fence"
title = "Sunrise at the Fence"
form = "story"
groups = ["psy"]
voice = "warm female alto, slightly hoarse from a long night, half-sung close to the mic, smiles audibly on the long vowels"
about = "losing your best friend in a festival crowd at 4am and finding her at the back fence as the sun comes up"
model = "B"
lyrics = """
[Intro: half-whispered]
Phone at two percent, your name still on the screen

[Verse 1: half-sung]
We came in holding hands like the gates might close on us
You tied my wristband tighter, said don't you dare get lost
Then the kick dropped low and the whole field leaned
And your yellow scarf went under like a coin in a stream

[Verse 2]
I asked a boy in face paint, I asked a girl with a flag
I walked the stage three times with your water in my bag
Every hour folded over, every song was the same song
My feet said it was minutes and the sky said it was long

[Pre-Chorus]
Then the black went grey, then the grey went gold

[Chorus]
And there you were at the sunrise at the fence
Shoes in your hand like nothing ever happened
Hair full of dust, you said where did you go
Like I was the one the morning had to find

[Drop]

[Bridge: whispered]
We sat on a cooler and didn't say a word
Watched the cleaners rake the cups into a little hill
I thought, this is what I'll keep when I'm old
Not the drop, not the lights, just your cold hand still

[Drop]

[Final Chorus]
Meet me at the sunrise at the fence
Every year, whoever loses who
Hair full of dust, I'll say where did you go
And you'll say I was right here waiting for you

[Outro: spoken]
Two percent. Still enough to take one picture.
"""

[[songs]]
id = "whose-voice-is-this"
title = "Whose Voice Is This?"
form = "revolt"
groups = ["psy"]
model = "A"
voice = "raspy male baritone in his thirties, half-rapped double time just above a whisper, clipped consonants and audible breaths between bars, opens into a full chest shout only on the last hook"
about = "a man realises the voice in his head calling him useless belongs to his old maths teacher, and stops obeying it"
lyrics = """
[Intro]
Chalk on my sleeve, a ruler on the desk, whose voice is this?

[Verse 1]
Twenty years gone and I still hear the chalk when I stand up to speak in a room full of names
Mister Sharma at the board with the dust on his collar, the ruler, the sigh and the shame
"Sit down, you will never get it," and the back row laughed and I burned like a match in the rain
Now I'm thirty four with a son and a loan and a beard going grey at the side
But my shoulders still drop when a boss clears his throat, like a boy with his homework to hide
Every sentence I build has a crack down the middle, he walks in before I decide
He's the hand on my neck when I lift up my own, he's the red pen that lives in my ear
He's the reason I mumble my name at the counter and say it again so they hear
I have carried this man up the stairs of my life on my back for some twenty two years
And he never once asked if I wanted the weight, so tonight I am asking him here

[Hook]
Whose voice is this in my head?

[Drop]
Not his

[Verse 2]
So I looked him up last winter, found a thin old man in a shawl with a walking cane
Feeding pigeons by a temple in Meerut, and he couldn't remember my name
All this time a stranger held the keys to my chest and the switch for the light in my brain
So I'm taking it back, every word that he stole, I am pulling them out of my mouth
Every "never," every "sit down," every "who do you think you are," every inch of the doubt
I can stand in the room, put my hand up, be wrong and be wrong out loud
When my son brings his sums to the floor of the kitchen I tell him go slow, it is free
When he gets one wrong I say good, now we know where to look, and he laughs back at me
Now the chalk's in my hand and I write my own name on the board where that man used to be

[Hook]
Whose voice is this in my head?

[Outro]
Chalk in my hand
The desk is mine
Whose voice is this?
Mine
Say it again
"""

[[songs]]
id = "calm-is-my-costume"
title = "Calm Is My Costume"
form = "confession"
groups = ["psy"]
model = "B"
voice = "warm female mezzo in her late twenties, soft half-sung delivery close to the mic, steady and kind on the chorus, the breath audibly shaking on the admissions"
about = "the friend everyone calls in a crisis admits she has been hiding panic attacks in the office bathroom"
lyrics = """
[Intro]
Third stall from the window, and the tap that never stops
I count the floor tiles, forty two, and then I count them twice

[Verse 1]
When my sister lost her job it was me she rang at night
I made her tea down the phone and I told her it's all right
When the river took Priya's flat she slept two weeks on my couch
I held her like a sandbag till the water ran out
I'm the one with the plasters, the charger, the spare set of keys
The one who stays level when the whole room's on its knees
"Ask her, she won't panic," that's what everybody says
And I nod like a lighthouse with a crack along the base
But at eleven every morning something knocks inside my ribs
Like a moth in a jar throwing wings against the lid
So I smile at the guard and I walk down the hall
And I lock the third stall and I lean on the wall

[Chorus]
Calm is my costume, I wear it to work
Buttoned to the collar so nobody sees it hurt
You hear the soft voice and you watch the steady hands
You don't see me on the floor counting tiles so I can stand
Calm is my costume and it fits me too well
I can carry the whole city and I can't carry myself

[Drop]

[Verse 2]
I learned it at twelve in a hospital hall
Mum in a gown and Dad not picking up his calls
A nurse said, "Be brave," so I folded the fear
Like a school shirt in a drawer for the next fifteen years
Nobody gets hurt if the quiet one's fine
Nobody looks under a floor that's been shined
My heart says, "Tell someone, you're allowed to fall"
My mind says, "Who holds them if you drop the wall?"
Was I strong, or just scared of the noise if I broke?
Was it kindness, or a scarf pulled so tight I would choke?
I've been everybody's harbour with no water of my own
Holding every boat steady, then rowing home alone

[Chorus]
Calm is my costume, I wear it to work
Buttoned to the collar so nobody sees it hurt
You hear the soft voice and you watch the steady hands
You don't see me on the floor counting tiles so I can stand

[Bridge]
Tuesday, eleven, third stall
I didn't count the tiles
I rang Priya with my back against the door
I said, "It's my turn, can you come?"
She came in twenty minutes in her slippers

[Final Chorus]
Calm was my costume, I'm letting it go
Unbuttoned at the collar so the people I love know
You can hear my voice shake, you can watch my hands drop
I can cry on the floor and the world doesn't stop
Calm was my costume, now it hangs on the door
I still carry the city, I just don't hide anymore

[Outro]
Third stall from the window, and the tap still runs
I didn't count the tiles today, I counted who came
"""

[[songs]]
id = "who-is-breathing"
title = "Who Is Breathing?"
form = "mantra"
groups = ["psy"]
model = "A"
voice = "low husky female alto with an unhurried teacher's calm, hypnotic half-rapped verses spoken almost in one breath, the Sanskrit chanted plainly and slowly from the chest"
about = "a sleepless woman on a rooftop at four in the morning follows her breath with the so ham mantra until she cannot find who is doing the breathing"
lyrics = """
[Intro]
So ham, so ham, on a roof at four, who is breathing?

[Verse 1]
Up on the roof by the tank with a mat and a shawl, and the city asleep at my feet
I can hear every fan in the building go round and a dog dreaming down in the street
I came up here to sleep but my head is a market that shouts out the price of my needs
So I do what my Dadi once taught me, spine like a stack of old coins, hands open, and breathe
In on so, out on ham, like a rope from a well that is pulled up and let down slow
Feel it cool at the nose, feel it warm going out, feel the belly rise up and then go
Every thought is a crow on the lip of the tank, and I watch it and let the crow go
And the rope keeps on moving, the bucket comes full, and the water keeps rising below

[Hook]
Who is breathing when I let go?

[Drop]
So ham

[Verse 2]
After forty I forget I was counting, the numbers slide off the edge of the roof
And my skin goes as soft as the milk when it falls in the tea and it's gone into the brew
I stop pulling the rope and the rope keeps on pulling, the well doesn't need me to choose
Yo sav asau purushah, that one in the sunrise, so ham asmi, I am that too
The pigeons, the tank, the man with the milk cans, the bell from the temple, the gold on the glass
There's no wall where I end, there's no gate where it starts, there's a breath and it lets itself pass
I was scared of the quiet, I thought I would vanish, I thought I'd be nothing at last
But the nothing is full and it's breathing me now, and it's warm and it's slow and it's vast

[Hook]
Who is breathing when I let go?

[Outro]
So ham
The sky goes grey
The tank, the crows, the milk cans
Who is breathing?
All of it, so ham asmi
"""

[[songs]]
id = "your-noon-my-midnight"
title = "Your Noon, My Midnight"
form = "letter"
groups = ["psy"]
model = "B"
voice = "gentle male tenor with a light Punjabi lilt, half-sung like reading a letter aloud on a balcony, conversational and fond, fuller and brighter on the last chorus"
about = "a letter to his sister in Toronto, written at midnight in Delhi while she is on her lunch break, from the brother who stayed home"
lyrics = """
[Intro]
Didi, it's twelve here, the geyser's ticking and the street dogs are done
You're on your lunch break in Toronto, eating rice out of a box in the sun

[Verse 1]
I'm writing on the balcony in Papa's old sweater
Your call froze on a smile again, so I'm sending you a letter
You said the snow comes sideways and it squeaks under your boots
I said the mango man still shouts your name at half past two
We used to share a bunk bed, one torch, one quilt, one fight
Now we share a moon that reaches you a whole half day behind
When I'm brushing my teeth you are taking off your shoes
When you're dreaming I'm in traffic reading all your news
My heart says, "Book a flight and go and ring her bell"
My head says, "Ma's knees, the shop, who keeps them if you leave as well?"
So I stay with the shutters and the ledger and the stock
And I keep your chair at dinner and I wind your old clock

[Chorus]
It's your noon, my midnight, and we talk across the dark
You're squinting at the sunlight, I'm whispering by the park
It's your noon, my midnight, one day pulled into two
I keep the lamp on in the window so the morning can find you

[Drop]

[Verse 2]
The night you flew I carried both your suitcases and grinned
You cried at gate eleven, I made jokes about your chin
Then I drove Ma home and she didn't say a word
Just held your old school ID like a feather from a bird
I was angry for a year, I'll admit it in this ink
That you got to be the brave one and I got to fix the sink
That you got the snow and a brand new name for your street
And I got the same chai stall and the same cracked seat
But Ma says leaving isn't losing, and staying isn't small
They're two hands on the same rope, and the rope holds us all
So I sold the old scooter and I filled in the form
I've a seat in March, Didi, I'll be landing in a storm

[Chorus]
It's your noon, my midnight, and we talk across the dark
You're squinting at the sunlight, I'm whispering by the park
It's your noon, my midnight, one day pulled into two
I keep the lamp on in the window so the morning can find you

[Bridge]
I won't move there
You won't move back
That's fine
We'll meet in the middle of the night
Or the middle of the day
Whichever one it is for you

[Final Chorus]
For one week your noon is my noon, the same plate, the same sun
I'll squint at your sunlight and you'll laugh, "Look, the tourist's come"
Then it's your noon, my midnight, one day pulled into two
And the lamp stays on in the window, but now I know it points to you

[Outro]
Didi, it's twelve here, the geyser's quiet and the street dogs are done
Eat your lunch, I'm going to sleep now, and say hi to the sun
"""

[[songs]]
id = "can-you-see-it"
title = "Can You See It?"
form = "story"
groups = ["psy"]
model = "A"
voice = "rough-edged male tenor from the coast, fast hushed half-rapped storytelling like talking low in a boat at night, salt in the throat, slowing right down on the hook"
about = "a fisherman's son describes the glowing plankton to his father, whose eyesight is going, on their last night out in the boat"
lyrics = """
[Intro]
Lantern off, oars in, Baba, can you see it?

[Verse 1]
Two in the morning off the rocks at Havelock with the tide going out like a breath
Baba's hands on the net still remember each knot but his eyes have gone grey at the edge
Doctor in Port Blair said it comes like a fog, in a year it'll be shapes and then less
So he wanted one night on the water with me, with the lantern and the old wooden chest
Then I dipped the oar in and the sea came alight, every stroke left a trail of blue fire
Like somebody spilled all the stars in the water and stirred them around with a wire
Every fish was a comet, every wave was a lamp, every drop on my arm was a spark
And my father sat still with his face to the sound and his hands on the side in the dark

[Hook]
Can you see it, Baba, can you see it?

[Drop]
Blue

[Verse 2]
So I told it the way he told stories to me when I feared all the waves in the night
It's like milk with the moon in it, Baba, like Diwali fell into the tide
He said, "Pour some in my hand," so I cupped up the sea and I poured, and his palms filled and glowed
And he laughed like a boy with the light running out through his fingers and onto his clothes
"I can't see it," he said, "but I see you seeing, that's the better half of the show"
Then he took both the oars and he rowed us back home through the light like a man who still knows
Every rock, every current, the bend by the temple, the shape of the beach in the black
He steered me my whole life, now I'm steering for him, and we're steering each other back

[Hook]
Can you see it, Baba, can you see it?

[Outro]
Lantern on
Sand on our feet
He said, "Tell me again"
Can you see it?
Through you, I can
"""

[[songs]]
id = "one-more-hour"
title = "One More Hour?"
form = "argument"
groups = ["psy"]
model = "B"
voice = "bright female soprano with a husky low end, quick breathy half-singing, argues with herself in two colours, playful and high for the heart, flat and low for the head"
about = "at five in the morning on a warehouse dance floor she argues with herself over staying for the closing set or sleeping before her first day at a new job"
lyrics = """
[Intro]
Wristband turning grey, and my left shoe in my hand
There's a shirt ironed on a chair at home for the girl who starts at nine

[Verse 1]
Five in the morning and the kick's still a pulse in the floor
The skylight's gone pink and the smoke's drifting out the side door
My feet stopped complaining an hour ago, I think they left
There's a stranger's gold glitter on my collar and my chest
And at nine I start the job I spent a whole year trying to get
Lanyard on the table, alarm on, the shirt pressed and set
My body says, "Stay, you will never get this hour twice"
My head says, "You've got three hours, and sleep has a price"
One sees a sunrise I'll be telling my kids about
One sees me on day one with my eyes falling out
Was I free, or just scared that the good part was ending?
Was I wise, or just old before my time and pretending?

[Chorus]
"One more hour?" says the heart in the bass
One more hour with the light on my face
One less hour, says the shirt on the chair
Says the girl who starts at nine, says, "Be there"
Is it one more hour, or is it one less me?
Who do I owe the morning to, the floor or who I'll be?

[Drop]

[Verse 2]
Last summer I stayed past the last song they played
Missed Nani's eightieth lunch, came in grey and afraid
She laughed and gave me halwa, but I saw the empty chair
And the photo on the fridge with everybody but me there
So I know what the night costs, I have paid it in full
But I know what it gives me, the hush and the pull
The man selling water who's been dancing since ten
The circle of strangers who won't meet again
My heart says, "This is church, you don't walk out in the prayer"
My mind says, "You can pray and still get up from the chair"
Maybe freedom's not staying till they sweep up the cups
Maybe freedom is knowing the right time to get up

[Chorus]
"One more hour?" says the heart in the bass
One more hour with the light on my face
One less hour, says the shirt on the chair
Says the girl who starts at nine, says, "Be there"

[Bridge]
The closing track comes in
I give it one chorus
I hug the girl with the flag
I put my shoe back on
I walk out while it's still beautiful

[Final Chorus]
One more hour, I gave it a song
One more hour, and I knew I belonged
Not one less hour, I'm taking it along
In the shirt on the chair, on the bus, in the sun
It was never one more hour or one less me
I can walk out of the music and the music walks with me

[Outro]
Wristband in my pocket, both shoes on, and the shirt from the chair
Eight fifty nine at my new desk, and the kick is still in there
"""

