And I know what it is, the thing that waits for me to rest
The heavy that comes crawling when it's quiet in my chest
But the tired one is honest, and the tired one is kind
It's the one who caught me falling every time I ran too blind
So who do I believe when they're both pulling at my sleeve?
One says, "Stay and you will drown," and one says, "Run and you will grieve"
Is the stillness that I'm scared of just a place I've never been?
Or the spinning just a way to never let the silence in?

[Chorus]
Spin or fall, spin or fall
Nothing stands still when the morning calls
A top only stands while it's turning round
Spin or fall, and I won't touch the ground
