[[songs]]
id = "ashes-for-a-throne"
title = "Ashes For A Throne"
family = "defiance"
form = "revolt"
groups = ["rap"]
model = "A"
voice = "raspy male baritone rapper, barked double-time flow with a chest punch on every kick, short sharp breaths between bars"
about = "someone told to kneel burns every rule handed down to them and sits on what is left"
lyrics = """
[Intro]
They gave me a crown made of rules, so I'm trading it in, ashes for a throne

[Verse 1]
They wrote me a rule for the way that I walk and a rule for the way that I talk in the light
Bolted a chain to the back of my name and they told me to smile and be grateful tonight
Every command was a nail in the wood and they hammered it in till my knuckles went white
Now I'm striking the match on the edge of the page and I'm watching the letters ignite
Fire on the floor of the hall where they taught me to bow, I'm not kneeling, I'm lighting the fuse
Every gold seat in the room is a lie that was built on the backs of the people they use
Blood in my teeth and the smoke in my lungs and I swallow it down like a fighter would do
Hundred and fifty, the kick in my chest, every beat is a door I am kicking right through

[Hook]
Ashes for a throne, ashes for a throne

[Drop]
Burn it, own it

[Verse 2]
Now the alarms in the hall start to scream and the guards at the gate start to run for the wall
I'm walking in slow through the smoke with a grin, I was born in the blaze, I was raised in the brawl
Every rule that they wrote is a curl of grey paper that floats like a moth to the ceiling and falls
Glass in the windows exploding like thunder, the echo is stomping the crowns in the hall
They wanted me silent, they wanted me grateful, they wanted me small on the floor of the stage
Now I'm standing on top of the pile that they built and I'm wearing their fire like a medal of rage
Nobody hands you the key to the kingdom, you melt down the lock and you pour it like gold
Sit on the cinders and say it out loud, I'm the heat that they swore they would never hold

[Hook]
Ashes for a throne, ashes for a throne

[Outro]
Look at the smoke
That was their kingdom
Now sit down
It is warm
It was always yours
"""

[[songs]]
id = "feeding-the-wolves"
title = "Feeding The Wolves"
family = "inner-demons"
form = "confession"
groups = ["rap"]
model = "B"
voice = "husky female alto rapper, low close-mic half-time verses that open into a full belted chorus, soft breaths at the line ends"
about = "someone admits they kept every grudge and fear alive by feeding it, then lets the pack go hungry"
lyrics = """
[Intro]
There are wolves in my chest and I know them by name
I've been feeding the wolves and I'm feeding them shame

[Verse 1]
Every night I throw the scraps to the anger and the doubt
Every bone of my old pride till the hungry ones come out
I told myself I needed teeth to make it through the cold
So I raised them on my grudges till the grudges took control
One wolf eats the kindness people offer at the door
One wolf sleeps across the threshold so that no one comes in anymore
I said I'm only guarding, I said I'm only tough
But a guard who never sleeps becomes a prisoner soon enough
My heart says, "Starve them out, they were never meant to stay"
My fear says, "Feed them more, or they'll eat you anyway"
Was I strong, or was I scared of who I'd be without the bite?
Was I safe, or just alone with all these eyes that glow at night?

[Chorus]
I've been feeding the wolves, I've been feeding the wolves
Every bite that I gave them was a bite of my youth
I called it protection, I called it my pride
But the teeth that I sharpened were sharp on the inside

[Drop]
Let them howl

[Verse 2]
There's a scar along my wrist from the night I reached in late
Tried to pull a memory back and they bit me at the gate
Every lover that I lost had to step around the bones
Every friend who came to find me found me guarding them alone
I confused a hungry mouth with a heart that tells the truth
I believed the loudest howling was the only kind of proof
Now I hear them pacing circles when the music hits the floor
And I know if I stop feeding, they will scratch against the door
But a wolf that isn't fed will either leave or learn to sleep
And the scraps I saved for them are finally mine to keep
So I'm sitting in the dark with empty hands and open eyes
Letting every hungry thing inside me starve before sunrise

[Chorus]
I've been feeding the wolves, I've been feeding the wolves
Every bite that I gave them was a bite of my youth
I called it protection, I called it my pride
But the teeth that I sharpened were sharp on the inside

[Bridge]
No more scraps
No more bones
No more blood
On the stones
Let them pace
Let them whine
Hunger's theirs
Now the night is mine

[Final Chorus]
I stopped feeding the wolves, I stopped feeding the wolves
Every bite that I saved is a bite of the truth
I called it protection, now I call it a lie
And the teeth that I sharpened are dull in the light

[Outro]
There are wolves in my chest and I know them by name
They are thinner tonight and they don't sound the same
"""

