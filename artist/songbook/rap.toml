about = "a new father writes to his mother, a night-shift nurse he resented as a boy, after a nurse like her gets him through his daughter's birth"
lyrics = """
[Intro]
There's a note still on our fridge in your hurried nurse's hand
"Dal is in the cooker, lock the door, I'm back by eight, understand?"

[Verse 1]
You left at seven every evening in your white and your blue
