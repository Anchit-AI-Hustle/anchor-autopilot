[[songs]]
id = "landlord-knocks-twice"
title = "Landlord Knocks Twice"
form = "revolt"
groups = ["rap"]
model = "A"
voice = "gravelly male baritone rapper, barked double-time flow locked to the kick, breath audible between bars"
about = "twelve tenants in a leaking building take their landlord to the rent board instead of paying his hike"
lyrics = """
[Intro]
First of the month, he's on the stairs, so who opens up when the landlord knocks twice?

[Verse 1]
Bucket in the kitchen catching every drop the ceiling cried all night
Paint peeling off like a sunburn, the fan on the ceiling is wobbling left and right
Wires from the switchboard like a nest a crow designed, and you never climbed the flight
Now a paper under every door, ten percent, and you even typed it polite
Auntie Joseph, ground floor, forty-two years, and she never once missed on the rent
Every rupee of her pension on time, now her back is a question mark, bent
You patched a crack with a calendar, stuck it with spit, and you told her it's fresh cement
Counting the shoes in my hallway like every guest owes you a percent
So we met on the roof by the tank that's been leaking since ninety-eight, one complaint
Wrote it in red on my mother's old bedsheet, Fix The Roof First, hung it over the gate

[Hook]
Landlord knocks twice, who's gonna open the door?

[Drop]
Twelve doors, shut tight

[Verse 2]
Monday he cut off the water, the whole block queueing at the public tap
Tuesday he sent us a lawyer in loafers who slipped in the puddle and fell on his back
Wednesday we answered with photos, the mould and the rust and every crack
Heart at one-seventy, standing in court, fists in my pockets, keeping it clean
Auntie Joseph stood up with her stick, the smallest lady that courtroom had seen
She said, "I paid you through floods and a funeral, son, now fix it, you know what I mean"
Judge read the file, looked at the landlord, said, "Fix it in thirty days, or the hike goes"
Kohli went quiet, the colour went out of him, lawyer dripping from collar to toes
Now a man's on my roof with tar, and Auntie's got chai, telling him where it goes

[Hook]
Landlord knocks twice, now we open the door

[Outro]
Knock knock
Twelve doors open
Floor is dry
Rent stays the same
Come in, Mr Kohli
"""

[[songs]]
id = "dented-hatchback"
title = "Dented Hatchback"
form = "celebration"
groups = ["rap"]
model = "A"
voice = "nasal playful male tenor rapper, bouncy double-time flow with little laughs between the bars"
about = "a guy brags about the fifteen-year-old car he paid for himself, then tows his rich classmate's SUV down a ghat"
lyrics = """
[Intro]
Three owners, one dent, so tell me, what's a dented hatchback worth?

[Verse 1]
Bought it from a dentist and the engine came with a cavity, no lie
Park it on a slope and now I'm negotiating with gravity every night
Three previous owners, I call it a pedigree, you call it a tragedy, fine
Paid for it in cash with eight months of my salary, no bank in my life
AC is the window, the rest is a little bit of praying and a lot of sweating
Radio stuck on a cricket match from ninety-nine, and Sachin is still batting
Speedometer lies like a cousin at a wedding, autos overtaking
Passenger door only opens from inside, my date climbs over, VIP seating
Rearview mirror taped up, but I can see the haters fine, they're all behind me in a line
Horn sounds like a goat with a sore throat, but the whole colony moves when it whines
Uncle at the red light asks the mileage, I tell him, "Depends how hard you push it, bye"

[Hook]
Dented hatchback, paid in full, no EMI

[Drop]
Push start, beep beep

[Verse 2]
Reunion in Lonavala, Rohan rolls in with an SUV the size of my flat
Leather and lights and a screen in the headrest, laughs at my ride, says, "Bro, what's that?"
Zip-tied bumper, I call it custom tuning, Shaktiman sticker keeping it intact
Petrol light been glowing since March, runs on confidence, bro, and that is a fact
Then the rain hits the ghat and his SUV panics, a hundred alerts on the screen
Sensor says tyre, sensor says engine, then sensor says sorry, the saddest I've seen
Forty-three lakh on the shoulder, no network, and Rohan is slowly turning green
I pull up in first gear, rope from the dickey, I tell him, "Get in, we're towing you down"
Dented hatchback dragging a tank down the ghat like an ant with a loaf into town
Rohan in my passenger seat, climbing over the gearstick, I hand him the crown

[Outro]
What's it worth?
One dent
Zero loans
And Rohan owes me petrol
"""

[[songs]]
id = "who-carries-the-bricks"
title = "Who Carries The Bricks"
form = "story"
groups = ["rap"]
model = "A"
voice = "deep weathered male bass-baritone rapper, heavy chest voice, deliberate double-time flow that lands on every kick"
about = "a construction worker on a Gurugram tower builds flats he will never live in, and the crew stops work until they are paid and safe"
lyrics = """
[Intro]
Thirty-two floors of glass in Gurugram, so who carries the bricks?

[Verse 1]
Four in the morning, tin roof on the labour camp shaking, the bus doesn't wait
Forty men standing, the driver is chewing his paan and running it late
Helmet's too big, the harness is frayed, the contractor ticks it as safe, he gets paid
Thirty-two floors and the lift is for cement, the men take the stairs with the weight
Ten bricks a trip on a folded up gamchha, my neck is a pillar of sinew and dust
Rebar is rusting, the scaffold is singing, the wind at the top doesn't care who you trust
Lunch on the twenty-ninth, onion and roti, legs over the edge in the gust
Down at the gate, a billboard, a couple in white with a pool and a skyline at night
Ninety-five lakh for the view from the balcony, I'm the one hanging it up in the sky
Hands cracked like a field before monsoon, but steady, I'm laying it level and right

[Hook]
Who carries the bricks to the sky?

[Drop]
Lift, carry, climb

[Verse 2]
August monsoon on the thirtieth floor, Ramdeen slipped on a plank in the rain
Net caught him at twenty-six, arm in two, and the contractor asked about the delay
Not "is he alive", not "is he okay", just "when does the slab get poured again?"
Forty-one days without pay, and they want us back up on that rope, not again
Two hundred men on the stairwell, the bricks on the landing, the hammering stopped
Builder came down with a driver, his shoes so white that the dust was in shock
We said, "Harness, wages, a doctor for Ramdeen, then we go back to the top"
He looked at the tower, he looked at our hands, knew without us it's a parking lot
Heartbeat one-sixty, the same as the hammer, the kick in the night
Morning, new harness, the wages in envelopes, Ramdeen in plaster, his thumb in the sky

[Outro]
Ribbon cut
Marble lobby
Under the marble, my handprint
Who carries the bricks?
Now the building carries me
"""

[[songs]]
id = "who-waters-mas-plants"
title = "Who Waters Ma's Plants"
form = "argument"
groups = ["rap"]
model = "B"
voice = "warm conversational male mid-baritone, half-sung half-rapped, unhurried half-time phrasing with a soft catch in the voice"
about = "a son with a job offer in Toronto argues with himself about leaving his widowed mother in Lucknow"
lyrics = """
[Intro]
Ma waters the balcony at six with a steel lota, humming
Tulsi, money plant, a chilli that never grew, and a question she won't ask me

[Verse 1]
The email came at midnight, Toronto, start in March
A salary with commas my father never got that far
I read it on the terrace with the neighbour's TV loud
Then I read it to the water tank 'cause I couldn't say it out
My head says, "Go, you earned it, every tuition, every fee"
My heart says, "Watch her knees on the stairs, who climbs them when you leave?"
She's sixty-three and stubborn and she still haggles for peas
She says, "Beta, I'm fine," like a crack in the wall says "please"
Was I raised to stay a son, or raised to go and send it home?
Is a video call on Sunday being there, or being alone?

[Chorus]
Who waters Ma's plants when I'm nine time zones gone?
Who checks the gas cylinder, who turns the porch light on?
I can send her money, I can call her every night
But you can't water tulsi through a phone screen's light
Staying can be love and leaving can be love too
And I swear I can't tell you which one of them is true

[Verse 2]
My father worked in Dubai, came home every second May
With a suitcase full of Tang and a face we learned again each day
He built this house on money orders, every brick a missed birthday
And I swore at his cremation I would never live that way
Then I found Ma's little diary underneath the rice tin lid
She wrote, "Let him go further than his father ever did"
She wrote, "I was not a sacrifice, I'm the one who chose"
And the care for every plant she keeps, written out in rows
Maybe staying isn't love if all it does is make her wait
For the day I start to blame her for the life I didn't take

[Chorus]
Who waters Ma's plants when I'm nine time zones gone?
Who checks the gas cylinder, who turns the porch light on?
I can send her money, I can call her every night
But you can't water tulsi through a phone screen's light
Staying can be love and leaving can be love too
And I swear I can't tell you which one of them is true

[Drop]

[Bridge]
I'm not my father
She's not alone
A plan is not a promise
A flight is not a stone
I'll come home every winter
She'll come and see the snow

[Final Chorus]
Who waters Ma's plants when I'm nine time zones gone?
Mrs Bhatt from upstairs, and a timer that I put on
I can send her money, I can call her every night
And in June she flies to see me with her pickles packed tight
Staying can be love and leaving can be love too
I'm going like she raised me, and that's how I know it's true

[Outro]
Ma waters the balcony at six with a steel lota, and finishes the song
Tulsi, money plant, and a chilli that finally grew the week that I was gone
"""

[[songs]]
