title = "Ramesh Knows Everyone"
form = "story"
groups = ["rap"]
model = "A"
voice = "warm mid-range male storyteller rapper with a slight Marathi accent, conversational double-time flow, a smile in the voice"
about = "the neighbourhood fixer who can get anyone anything lands in hospital with no one to call, until the whole colony turns up"
lyrics = """
[Intro]
Licence, cylinder, a plumber at midnight, call him, Ramesh knows everyone

[Verse 1]
Ramesh at the corner by the paan shop, phones going off like a rocket
Knows the man at the RTO, the gas agency, the fellow who fixes your socket
Need a seat on a full train to Nagpur? Two calls, and your berth's in your pocket
Lose your mother's locket? He knows a pandit, a constable, a dog, and he'll spot it
Wedding needs a horse by Sunday? Ramesh. Hospital bed at three in the morning? Same
Your cousin's visa, your landlord's mood, the cricket score before it even came
Never takes a rupee, just a chai and a pat on the back and his name
Whole colony saved under R in their phones, Ramesh Ji, Ramesh Gas, Ramesh Train
Ask him for anything, he just says, "Consider it done," and it's done by the night
Ten years I been calling him, never once asked him a thing about his own life

[Hook]
Ramesh knows everyone, but who knows Ramesh?

[Drop]
Call Ramesh, call Ramesh

[Verse 2]
Then a Tuesday, the corner is empty, no Ramesh, no phones, no paan, no call
Paan wala says, "Heart, they took him at dawn," and I felt my stomach fall
Ward number six, bed by the window, a drip and a form and a nurse in the hall
