[[songs]]
id = "landlord-knocks-twice"
title = "Landlord Knocks Twice"
form = "revolt"
groups = ["rap"]
voice = "gravelly male baritone, barked choppy staccato, double-time in the verses, breath audible between bars"
about = "a building of tenants refusing a rent hike from a landlord who never fixed the leaking roof"
lyrics = """
[Intro: spoken]
Mr. Kohli, it's the first of the month again

[Verse 1: choppy, double-time]
Bucket in the kitchen catching what the ceiling cried
Paint peeling like a sunburn on the bedroom side
Fan wobbling like a drunk uncle at a wedding dance
You fixed nothing, then you raised it, never gave a chance
Deposit like a hostage that you're keeping on principle
Mould on my wall got a lease more official than my rental
I pay on the first and you still come collecting
Counting shoes in my hallway like my guests need inspecting

[Hook: chanted]
Landlord knocks twice, I don't answer the door
Fix the roof first, then we talk about more
Landlord knocks twice, hear the whole block roar
We ain't paying for the rain on the floor

[Drop]

[Verse 2: heavier]
Third floor, fourth floor, every door got the same letter
Ten percent up, says the market's getting better
Better for who? Auntie Joseph on the ground floor
Forty years of rent paid, she can't climb the stairs no more
So we met on the roof where your water tank leaks
Twelve flats, one voice, first time in weeks
Wrote it on a bedsheet, hung it off the railing
"Fix it or forget it", watch your Sunday start failing

[Bridge: spoken, low]
Knock once, that's a neighbour
Knock twice, that's a bill
Twelve doors stayed shut and the hallway went still

[Drop: crowd shouts]
Twice!

[Final Hook]
Landlord knocks twice, twelve doors stay closed
Fix the roof first, that's how this one goes
Landlord knocks twice and the whole block knows
We ain't paying for the rain on our clothes

[Outro: spoken]
Bucket's still full, Mr. Kohli. Come and see.
"""

[[songs]]
id = "dented-hatchback"
title = "Dented Hatchback"
form = "celebration"
groups = ["rap"]
voice = "nasal playful male tenor, laid-back bouncy flow, grins through every bar, little laughs between lines"
about = "showing off a fifteen-year-old secondhand first car like it's a supercar, because he paid for it himself"
lyrics = """
[Intro: spoken, laughing]
Bought it off a dentist. Yeah. It's got character.

[Verse 1: laid back, bouncy]
Bought it from a dentist and it still had a cavity
Park it on a hill and I'm in talks with gravity
AC is the window and a little bit of praying
Radio stuck on cricket, same old match still playing
Passenger door only opens from inside
So my date climbs over, that's the VIP ride
Speedometer lying like a cousin at a wedding
Says I'm doing ninety, rickshaws wave while I'm sweating
Rearview mirror taped up, I can see the haters fine
They're all behind me, that's the point, they're stuck in line

[Hook: sung, bouncy]
Dented hatchback, but it's mine, all mine
Every bump in the road, I just wave it bye
Dented hatchback, rolling slow like a king
Paid in full, baby, I don't owe a thing

[Drop]

[Verse 2: faster, cheeky]
Petrol light's been glowing since the end of last March
Car runs on confidence and a little bit of heart
Uncle at the red light asks me "what's the mileage, beta?"
Told him "depends how hard you push it, see you later"
Bumper on with zip ties, I just call it custom tuning
Mechanic sees me coming and he starts his chai brewing
Parked beneath a neem tree, crows paying me no rent
Every morning on the windshield they leave me their comments
It ain't a Lambo, man, it's a lamb, it's a goat
But I paid it off myself, every rupee, every note

[Bridge: spoken]
Dad rode a bicycle. I drive this. My kid's gonna fly. That's the plan.

[Drop]

[Final Hook]
Dented hatchback, but it's mine, all mine
Every bump in the road, I just wave it bye
Dented hatchback, first thing that I own
Paid in full, baby, now I'm driving Mum home
"""

[[songs]]
id = "corner-shop-credit"
title = "Corner Shop Credit"
form = "story"
groups = ["rap"]
voice = "warm husky female alto, unhurried storyteller pace, Indian English accent, a smile in the softer lines"
about = "a shopkeeper who kept a broke family fed on credit in his notebook, and the daughter who came back twenty years later to pay"
lyrics = """
[Intro: spoken]
Page forty-one, in pencil. My mother's name.

[Verse 1: conversational]
Shutter half open and a radio playing old songs
Mr. Iyer on his stool, knew who did right and who did wrong
That monsoon the mill shut, Dad came home with a box
Mum stood at the counter, fingers counting what she'd got
Two kilo rice and a soap and a sweet for me
He licked the pencil, turned a page, said "pay me when you're free"
Six months of milk on one line in that book
And never once did he give my mother the look

[Hook: sung]
Corner shop credit, pencil on a page
He never charged interest, he just charged us faith
Corner shop credit, kept us through the rain
One day I'm coming back to clear my mother's name

[Drop]

[Verse 2]
Twenty years later, got a job in another city
Same lane, new mall where the paddy fields sat pretty
Shop's still standing, shutter rusted, sign gone pale red
His son behind the counter, said his father's in bed
Eighty-four, forgets the names of the streets
But he remembered my mother and her coconut sweets
I asked to see the book, the son pulled it off a shelf
Page forty-one in pencil, there's my mother, there's myself
Counted every line, rounded up and then some more
Took it to his bedside, watched his hand cross out the score

[Bridge: spoken]
He didn't want the money. He wanted to see the line go through.

[Drop]

[Final Hook]
Corner shop credit, pencil on a page
He never charged interest, he just charged us faith
Corner shop credit, kept us through the rain
Walked back twenty years to clear my mother's name

[Outro: spoken]
Crossed out. In his own hand.
"""

[[songs]]
id = "nani-runs-it"
title = "Nani Runs It"
form = "celebration"
groups = ["rap"]
voice = "sharp female soprano rapper, rapid-fire sassy delivery, Punjabi-English lilt, cackles between bars"
about = "a five-foot grandmother who is the real boss of the neighbourhood, told with full gangster swagger"
lyrics = """
[Intro: spoken]
Everybody on this street answers to one woman. Five foot nothing.

[Verse 1: rapid-fire]
Five foot nothing in a cardigan, the colony's queen
Haggled with the sabzi man until he owed her for the greens
Slipper in her hand got a range of thirty feet
Hasn't missed a target since nineteen sixty-three
Her WhatsApp forwards travel faster than the news
She knew about your breakup way before you knew
Pickle in the jar has been aging for a decade
Neighbours bring her gossip like a tribute parade
Doctor said "cut sugar", she said "you cut the advice"
Then she ate a whole jalebi just to say it twice

[Hook: chanted, call and response]
Who runs it? Nani runs it
Who's the boss? Nani runs it
Don't touch her tulsi plant, don't you park in front of it
Who runs it? Nani runs it

[Drop]

[Verse 2]
Walked into the bank and didn't even take a token
Manager said "madam, there's a queue", she said "it's broken"
Cricket ball went through her window back in ninety-eight
Kid still sends her mangoes every summer, still afraid
Taught three generations how to roll a round roti
Mine come out like maps, she squints and says "that's Italy"
Eighty-one years old and she still don't need a cane
Only thing she leans on is the fact she's right again
Pressed a hundred in my pocket, said "don't tell your mum"
Gangster with a soft heart, that's where all my swagger's from

[Bridge: spoken]
She raised my mother. She raised me. Now she's raising hell at the sabzi man.

[Drop: crowd]
Nani!

[Final Hook]
Who runs it? Nani runs it
Who's the boss? Nani runs it
Ask the whole colony, they'll tell you who's the one in it
Who runs it? Nani runs it
"""

[[songs]]
id = "spare-house-keys"
title = "Spare House Keys"
form = "dialogue"
groups = ["rap"]
voice = "two male rappers trading: MC one a smooth light tenor with quick conversational flow, MC two a deep gruff bass with slow heavy bars"
about = "two brothers, one who left for the big city and one who stayed home with their parents, finally saying it to each other"
lyrics = """
[Intro: MC two, spoken]
You left the keys on the hook. I kept them.

[Verse 1: MC one]
Got the job in the city, sixteenth floor, glass view
Send money home on the fifth like I'm supposed to
Video call on a Sunday, Mum's face freezing in the frame
Dad never says he's proud, but he forwards every game
Rent eats half and the loneliness eats the rest
Dinner from a paper box, my laptop on my chest
Ten million people and I've never felt less known
You think I got it easy? I'm just easy on the phone

[Hook: both, sung]
You took the highway, I kept the spare house keys
Both of us carrying what the other never sees
Same roof, same mother, different kind of weight
Come home, brother, before it gets too late

[Verse 2: MC two]
I'm the one who drove Dad to the cardiac ward
Signed the forms in a hallway with a pen on a cord
Fixed the geyser, fixed the gate, fixed the TV twice
Every aunty asks about you, never asks me how's life
I tore up the offer letter when the doctor called
Ain't a martyr, I just answered when the whole house stalled
You send money, I send time, and both of them run out
Come and sit with Dad one evening, that's what this is about

[Drop]

[Bridge: MC one]
I was scared if I came back, I'd never leave

[Bridge: MC two]
I was scared if I said it, you'd never believe

[Final Hook: both]
I took the highway, you kept the spare house keys
Booked a train for Friday, leave the porch light on for me
Same roof, same mother, now we split the weight
I'm coming home, brother, it ain't too late

[Outro: MC two, spoken]
Key's on the hook.
"""

[[songs]]
id = "badge-on-the-desk"
title = "Badge On The Desk"
form = "revolt"
groups = ["rap"]
voice = "hoarse male tenor, shouted punk-rap energy, fast choppy bursts, voice fraying at the top of every line"
about = "walking out of a job that took seven years and paid him mostly in praise"
lyrics = """
[Intro: shouted]
Seven years. Here's your lanyard back.

[Verse 1: choppy bursts]
Seven years of "rockstar" in the subject of an email
Rockstars get paid, man, I got a cake that was stale
Called us family at the offsite, then they froze the family's pay
My real family never made me fill a form to take a day
Boss on a yacht in his holiday story
Telling me to hustle while he's soaking up the glory
Missed my cousin's wedding for a deck nobody opened
Missed Nani's eightieth for a meeting that got postponed

[Hook: shouted chant]
Badge on the desk and the chair still spinning
Lost a paycheck, got my evenings, call it winning
Badge on the desk, I'm not coming back Monday
Tell 'em I'm busy being alive on a Sunday

[Drop]

[Verse 2: heavier]
Lift going down and every floor peels off my shoulders
Ravi at the gate just grins and says "you finally told 'em"
Scared? Of course. My savings thin as office chai
But I'd rather be broke for a month than numb until I die
Nobody's gonna clap for this, no pizza and no plaque
Just me and an auto driver, windows down, not looking back
Called my dad from the footpath, waiting for the scolding
He said "I gave thirty years for a pen, son. You're golden."

[Bridge: chant]
No two weeks, no farewell cake
Just the sun on my face for my own sake

[Drop: crowd shouts]
Badge on the desk!

[Final Hook]
Badge on the desk and the chair still spinning
Dad lost thirty years, I'm not giving, I'm living
Badge on the desk, I'm not coming back Monday
Tell 'em I'm busy being alive on a Sunday
"""

[[songs]]
id = "chai-at-four"
title = "Chai At Four"
form = "vibe"
groups = ["rap"]
voice = "low sleepy female voice, half-whispered close-mic bars, unhurried, a soft crowd chant behind her"
about = "the city at four in the morning around a roadside tea stall, before anyone is anyone"
lyrics = """
[Intro: whispered]
Four o'clock. Kettle's on.

[Drop]

[Verse 1: half-whispered, slow psy rap]
Milk van rattles past, crates clinking in the cold
Night guard on his last yawn, telling stories getting old
Sweeper with a broom of sticks, humming nineteen seventy
Taxi uncle counting coins, the city owes him plenty
Steam off the glasses like the sky's exhaling slow
Nobody here is famous, nobody needs to know
Cardamom and diesel, that's the perfume of the hour
Fifteen rupees, one small glass, the morning still ours

[Hook: chant]
Chai at four, nobody's watching
Chai at four, the kettle's talking
Chai at four, nobody's watching
Chai at four, the kettle's talking

[Drop]

[Drop: crowd chants]
