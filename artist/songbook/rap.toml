Sky goes blue like ink in water
Somebody's mother, somebody's daughter
Shutters lifting one by one
Last sip warm before the sun

[Drop]

[Hook: chant]
Chai at four, nobody's watching
Chai at four, the kettle's talking

[Outro: whispered]
Same time tomorrow.
"""

[[songs]]
id = "ledger-of-favors"
title = "Ledger Of Favors"
form = "argument"
groups = ["rap"]
voice = "measured male bass, slow deliberate flow, every word placed, quiet steel, never shouts"
about = "a co-founder who got written out of the story by his best friend, deciding whether to settle the score or let it go"
lyrics = """
[Intro: spoken, low]
I kept a list. I'm not proud of it.

[Verse 1: slow, heavy]
We started in a garage with one fan and one chair
Took turns on the sofa, took turns saying prayers
I wrote the pitch at two a.m., you wore it to the meeting
Magazine said "visionary", I was in the back, reading
I pawned my mother's bangles so we'd make the first payroll
You thanked your wife, your mentor and your dog in the keynote
Every favour's written in a ledger in my chest
Interest compounding every night I don't rest

[Hook: sung low]
Ledger of favors, I could read it out loud
Every page you borrowed, every time you stood proud
Ledger of favors, do I burn it or keep?
Holding on is heavy, letting go ain't cheap

[Drop]

[Verse 2]
Half of me wants to post the receipts with your face
Other half remembers who carried me out of that place
You drove me to the hospital the night my father fell
Sat there till the morning, didn't post it, didn't tell
So which one are you, the thief or the friend in the chair?
Both, and that's the part I can't put anywhere
I don't need your sorry framed up on a wall
Just say my name once where you said yours to them all
Grudges are a loan where only I keep paying
Seven years of instalments and I'm tired of staying

[Bridge: spoken]
Page one. Your name. My handwriting.
I'm closing the book. Not for you.

[Drop]

[Final Hook]
Ledger of favors, I won't read it out loud
Let you keep the stage, let you keep the crowd
Ledger of favors, I'm closing it for me
Holding on was heavy, letting go is free
"""

[[songs]]
id = "thrift-store-royalty"
title = "Thrift Store Royalty"
form = "celebration"
groups = ["rap"]
voice = "bright squeaky upper-register male rapper, sharp comic timing, bouncing triplet flow, laughs mid-bar"
about = "dressing like a millionaire from the Sunday secondhand market on three hundred rupees, and finding his grandfather's coat"
lyrics = """
[Intro: spoken]
Three hundred rupees. Sunday market. Watch this.

[Verse 1: triplet flow]
Blazer from an uncle who was obviously a banker
Lottery ticket in the pocket, didn't win, so no thank ya
Shoes two sizes big, every step's a round of applause
Flap flap down the footpath, I'm a star without a cause
Shades missing one lens, so I'm winking at the city
Aunties think I'm flirting, nah, the other side is empty
Tie from eighty-five with a little ketchup stain
Told 'em it's a red accent, priced it like champagne
Mothballs in the collar so mosquitoes pay respect
Whole fit cost three hundred, bargains are my architect

[Hook: sung, bouncy]
Thrift store royalty, three hundred for the crown
Second-hand swagger, first place in this town
Thrift store royalty, wear it like it's new
Somebody's old Sunday, now it's my debut

[Drop]

[Verse 2: faster]
Walked into my cousin's wedding, uncles stood up straight
Thought I was the groom's boss, handed me the first plate
Photographer asked my designer, I said "Sunday, by the station"
Now his whole crew's there at seven fighting for my inspiration
Price tag still hanging, I just wear it like a medal
Thirty rupees, framed it, that's a trophy, that's a level
Mum touched the collar, went quiet, "that's your grandfather's coat"
We gave it away in ninety-nine. I paid thirty. What a quote.

[Bridge: spoken, laughing]
Original owner, original swagger. It came home.

[Drop]

[Final Hook]
Thrift store royalty, Grandpa's in the crown
Second-hand swagger, first place in this town
Thrift store royalty, wear it like it's new
Somebody's old Sunday, Grandpa, this one's for you
"""

[[songs]]
id = "benched-not-buried"
title = "Benched Not Buried"
form = "revolt"
groups = ["rap"]
voice = "raw gritty female mezzo rapper, chest voice, double-time bursts that slow into single pounding words"
about = "a footballer written off after a knee injury fighting two years to get her name back on the team sheet"
lyrics = """
[Intro: spoken]
Coach said "maybe next season". That was two seasons ago.

[Verse 1: double-time bursts]
Eighty-first minute, the knee went, I heard it in my teeth
Stretcher and an ice pack and the grass gone underneath
Physio said "other dreams", like they're sold in a pack
I said "wrap it up, doc, I'm just taking the long way back"
Team photo the next season, they cropped me at the shoulder
Group chat stopped tagging me, every message getting colder
Cried on step forty of the stadium at five
Kept climbing forty-one, that's the day I came alive

[Hook: chanted, pounding]
Benched, not buried, I'm still breathing on the line
Bruised, not broken, wait your turn, I'm taking mine
Benched, not buried, put my name back on the sheet
Every doubt you threw at me is turf beneath my feet

[Drop]

[Verse 2: slower, every word lands]
Trial day. Same coach. Same clipboard. Same cap
Looked at my knee brace like he's reading a map
Girl they picked instead of me is nineteen and fast
I'm not here to take her spot, I'm here to take my past
First touch heavy. Second touch clean
Third touch, net shaking, clipboard dropped on the green
They say "comeback" like it's a story with a bow
It's two years of mornings that nobody will know

[Bridge: spoken, slow]
Not. Done.
Same two words for two years. Not done.

[Drop: crowd]
Benched not buried!

[Final Hook]
Benched, not buried, I was breathing on the line
Bruised, not broken, now the number nine is mine
Benched, not buried, there's my name upon the sheet
Every doubt you threw at me is turf beneath my feet
"""

[[songs]]
id = "ramesh-knows-everyone"
title = "Ramesh Knows Everyone"
form = "story"
groups = ["rap"]
voice = "warm mid-range male voice with a slight Marathi accent, unhurried conversational flow like a story told at a bus stop, chuckles between lines"
about = "a city bus conductor who knows every passenger on his route, and the day the route finally learns about him"
lyrics = """
[Intro: spoken]
Route nineteen. Six forty-two. Front door.

[Verse 1: conversational]
Ramesh got the ticket punch and khaki on his back
Knows your stop before you say it, knows your mother, knows your snack
Wakes the nurse who sleeps through Sion right before her station
Gives the old man with the cane his seat without a conversation
Caught the kid who skipped tuition, didn't tell, just raised a brow
Kid's an engineer in Pune, sends him sweets at Diwali now
Change for a hundred? Ramesh keeps it folded in his sock
Twenty-six years on route nineteen, he's the bus's only clock

[Hook: sung, whole bus singing along]
Ramesh knows everyone on route nineteen
Who got married, who got sick, who's somewhere in between
Ramesh knows everyone, two bells and we go
But who knows Ramesh? Funny, we don't know

[Drop]

[Verse 2]
Last day was a Friday, driver Shinde let it slip
So the whole route planned it, every stop and every trip
Nurse brought a garland, old man brought a song
Engineer took the night bus down, said "sorry, it's been long"
Fish auntie brought a cake and it was shaped just like a bus
Smelled a bit like pomfret but nobody made a fuss
Ramesh stood there, punch in hand, mouth open, not a sound
Punched one last ticket for himself, said "my stop", stepped down

[Bridge: spoken]
His name is Ramesh Pawar. Wife, Sunita. Likes cutting chai and old Kishore songs.
We asked.

[Drop]

[Final Hook]
Ramesh knows everyone on route nineteen
Who got married, who got sick, who's somewhere in between
Ramesh knows everyone, two bells, let him go
Ramesh Pawar, now the whole bus knows
"""
