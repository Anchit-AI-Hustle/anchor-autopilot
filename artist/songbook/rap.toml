voice = "nimble wiry male tenor rapper, fast clipped double-time flow that drops into a lower growl for the answering voice"
about = "a doubter and a doer trade bars on a ridge as a storm rolls in, until the doer stops listening and runs"
lyrics = """
[Intro]
Lightning in the hills, so you better move before thunder

[Verse 1]
Doubt says, "Wait for the weather to clear, wait for the green, wait for the perfect alignment"
I say, "The weather is never gonna clear, every day that I wait is a day of confinement"
Doubt says, "The road isn't paved and you'll fall on the gravel and everyone watching will laugh"
I say, "Then let them all laugh while I'm bleeding and running, I'm already halfway down the path"
Doubt says, "Remember the last time you jumped, how the ground came up fast and it shattered your knees"
I say, "I remember, I still got the scars, and the scars taught me landing is never with ease"
Clouds on the ridge and the sky getting heavy, the air in my lungs is electric and thick
Count from the flash to the boom, I got seconds, so every decision I make has to be quick

[Hook]
Move before thunder, move before thunder

[Drop]
Go now, go

[Verse 2]
Doubt says, "You're reckless, you're running on fire with no map and no water, no shelter, no plan"
I say, "The plan is my feet on the ground and the fire in my chest and the blood in my hands"
Doubt says, "The storm's gonna catch you, it's faster than anyone born, you will drown in the rain"
I say, "Then I'll drown with my legs still in motion, I'd rather that than to rot in the same"
Lightning is splitting the sky like a blade and the trees on the ridge are exploding in light
I'm sprinting the ridge with the wind at my back and I'm laughing out loud at the size of the fight
Doubt getting quieter, quieter, quiet, I barely can hear him behind me in the rain
Every step is a drumroll, the beat is the thunder, I'm already gone when it rolls in again

[Hook]
Move before thunder, I move before thunder

[Outro]
Hear that
That was the thunder
You're still standing there
I'm already gone
Move
"""

