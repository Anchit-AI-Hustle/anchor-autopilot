voice = "sharp female soprano rapper, rapid-fire sassy double-time delivery with punchline pauses"
about = "a grandchild brags that their seventy-eight-year-old Nani is the real boss of the colony, right up to saving the park's neem tree"
lyrics = """
[Intro]
Not the cops, not the RWA, so who runs this colony? Ask anybody

[Verse 1]
Seventy-eight in a cotton sari, she walks through the mandi like it's her show
Tomato wala sees her and starts sweating, drops it to twenty before she says no
One eyebrow up and the onion guy folds like a plastic chair at a wedding, bro
Stick tapping the pavement on beat, and the whole of the gully is moving in tempo
RWA secretary stands when she enters, he hands her the chair and the keys
Parking fight settled in thirty seconds, no lawyer, no paper, just "Beta, please"
Guard at the gate does a full salute and the street dogs bow on their knees
Colony WhatsApp, two hundred members, but only her good morning gets the likes
Sends a pink rose with a sparkle by six, and by seven the whole block replies
Nobody posts after nine, house rules, Nani says the phone light dries out your eyes

[Hook]
Nani runs it, Nani runs it, don't ask why

[Drop]
Whistle twice, sit down

[Verse 2]
Then a builder rolls up in a Fortuner, gold chain, says he's cutting the old neem tree
Nani's on her evening round, number seventeen, she stops, and the lane goes quiet as can be
Puts her stick on his bonnet, says, "I planted that neem when your father was cutting his teeth
I know your mother, I gave you tuition, you failed in your Hindi, so listen to me"
Builder goes red, and his bodyguards bend down and touch her feet right there in the street
By noon she's got three hundred names, rummy aunties and the whole yoga gang came
Milkman signed it, the press wala signed it, the builder's own driver signed his name
No muscle, no money, just a walking stick and a memory that never fades
Neem is still standing, the builder sends sweets every Diwali and says sorry by name

[Hook]
Nani runs it, Nani runs it, don't ask why

[Outro]
Who runs it?
Phone rings
"Beta, did you eat?"
