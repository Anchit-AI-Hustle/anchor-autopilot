[[songs]]
id = "pen-in-my-hand"
title = "Pen In My Hand"
form = "revolt"
groups = ["rap"]
model = "A"
voice = "hoarse male tenor rapper, shouted punk-rap energy, fast clipped double-time bars with a crack on the high notes"
about = "a son walks out of the engineering, office and arranged marriage his family wrote for him and opens an egg bhurji cart"
lyrics = """
[Intro]
Marriage profile printed, horoscope matched, so whose pen is in my hand?

[Verse 1]
Father filled my forms at fourteen, wrote engineer in the column under my name
Kota at sixteen, a room with one fan, a timetable taped to the wall like a frame
Four hundred faces in a hall every morning, the same test, the same rank, the same blame
Only place I could breathe was the mess at midnight, frying eggs on a borrowed flame
Cleared it on the third try, B.Tech in a college with a gate and a guard and a fee
Then an MBA 'cause the cousins all did, then a desk in Andheri with a view of a tree
Sundays I'm cooking for twenty in a one-room flat, and the whole building eating for free
Now my marriage profile's printed, my height and my salary rounded up for the brand
Horoscope matched with a girl who wants to be a pilot, and her parents won't let her land

[Hook]
Whose pen is in my hand?

[Drop]
Sign it, mine

[Verse 2]
Engagement lunch at a banquet in Thane, forty relatives watching me close
Pilot girl looks at me over the paneer, and I swear I can see that she knows
Both of us stand at the same time, chairs scraping, a hundred and seventy beats in my throat
She says, "I'm flying," I say, "I'm cooking," and a gulab jamun hits the floor in slow-mo
Father's face like a door slammed shut, and he didn't speak to me for ninety-one nights
I quit the desk, sold the bike, rented a cart with a tawa and two lights
Station road, seven to midnight, burnt fingers, egg bhurji, the queue going round twice
Nobody wrote it for me, it's my handwriting on the menu, my spelling, my price
Day ninety-two, a man in the queue in his office shirt, waiting his turn for a plate
Father eats standing, says, "Too much salt," then he orders another and tells me, "It's late"

[Outro]
Whose pen? Mine
Licence on the cart
Pen in my hand
My name on top
His signature under it
"""

[[songs]]
id = "i-laughed-along"
title = "I Laughed Along"
form = "confession"
groups = ["rap"]
model = "B"
voice = "soft husky female alto, close-mic, quiet half-rapped verses that rise into a full chest voice on the chorus"
about = "a woman admits she laughed along when a colleague was mocked for his accent, and years later, as team lead, finally stands up"
lyrics = """
[Intro]
I still have the screenshot, three laughing faces in a row
The third one's mine, sent at ten forty-two, and I let it go

[Verse 1]
Arjun came from Muzaffarpur with a pressed shirt and a plan
Said "vegetable" in four syllables, said "sir" to every man
His spreadsheets were the cleanest that the building ever saw
But in standups he said "pleasure" like it scraped against his jaw
Then Rohit made a sticker of his face mid-sentence, mouth wide
And the chat lit up like Diwali, and I joined in from the side
I was new, the only woman on the floor, I wanted to belong
And a laugh is cheap admission, so I paid it, played along
My conscience said, "He's sitting there, two chairs away from you"
My fear said, "Keep your head down, girl, and let them laugh it through"
Was I cruel, or just a coward borrowing somebody's grin?
Either way, the man two chairs away wore it on his skin

[Chorus]
I laughed along, I laughed along
It was easy, it was small, it was wrong
I didn't throw the stone, I just clapped when it was thrown
And a clap is still a hand, and the hand was my own
Silence isn't neutral when it's sitting in the room
I laughed along, and a good man packed his desk up in June

[Verse 2]
He resigned on a Friday, left a box of laddoos on the shelf
Note said, "Thank you all for everything," no anger, nothing else
I ate one by the printer and it wouldn't go down whole
Sugar on my fingers, and a stone where my excuse would go
Five years later I'm the team lead with a glass door and a chair
And the new girl from Silchar says "schedule" and the whole room stares
Somebody screenshots her slide, puts a caption, presses send
And my thumb is on the laughing face, the same one, at the end
My fear says, "You're the boss now, keep it light, it's just a joke"
My memory says, "Laddoos on a shelf, and a man who never spoke"

[Chorus]
I laughed along, I laughed along
It was easy, it was small, it was wrong
I didn't throw the stone, I just clapped when it was thrown
And a clap is still a hand, and the hand was my own
Silence isn't neutral when it's sitting in the room
I laughed along, and a good man packed his desk up in June

[Drop]

[Bridge]
I put the phone face down
I stood up in the room
I said, "Delete it"
And nobody laughed
Not one
Not even me

[Final Chorus]
I don't laugh along, I don't laugh along
It was easy, it was small, it was wrong
I won't throw the stone, and I won't clap when it's thrown
'Cause a clap is still a hand, and this hand is my own
Silence isn't neutral when it's sitting in the room
I laughed along once, and I wrote to Arjun this June

[Outro]
I still have the screenshot, three laughing faces in a row
I sent it to Arjun with "I'm sorry", and he wrote back, "I know"
"""

