# The decided genres and their mashups, each defined as its own genre (Anchit, 2026-11-21:
# "rap songs are still attrocious - mashups are incorrect - havent you integrated all learnings
# into the new productions - there is no sync in the music and the lyrics"). Every field here
# replaces the same field of the lane in artist/anchor.toml; the lanes there keep their old
# words only for the records already out.
#
# What each lane is built from (artist/genres.toml and Anchit's references):
# - hard techno: straight, no swing, heavy distorted kick with a rumble tail, offbeat hats,
#   hard industrial stabs, dissonant acid; never bright supersaw chords or swing
# - industrial techno: distorted clipped kick fused with the bass rumble, metallic hits,
#   factory noise, steel factory atmosphere; never melodic leads, bright pads or funky swing
# - warehouse techno: big rumbling kick with a long concrete-room tail, raw stabs, few melodies
# - acid techno: the TB-303 as bass and lead, distorted, resonant filter that opens over the track
# - psychedelic techno: rolling off-beat bass, phased acid sequences, trippy delays, swirling arps
# - techno rap: the hard techno kick stays under every verse; the rap rides the half-time
#   pocket (75 over 150), in 8-bar blocks. Outrun Your Shadow: gravelly barked staccato bars;
#   Red Dust Warning: aggressive clipped delivery, chant-ready hook, warehouse pressure
#
# ``flow`` (rap lanes) is added to the groove with {half}, the half-time tempo, filled in: at
# 181 BPM a rap in sixteenths of the kick is 12 syllables a second and falls off the beat.
# ``palette`` is the lane's own instruments: a song never borrows a brass hook or power
# chords from another genre. ``feel`` replaces the channel-wide feel for the lane.

