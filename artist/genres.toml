# Every genre ANCHOR makes or mixes, what it is made of, and how it must never sound
# (Anchit, 2026-11-10: "completely learn about each and every genre of music ... and about
# mashups so that you can create the perfect type of music, songs, videos and sets").
#
# Researched 2026-11-10 from the pages in each entry's sources. Where sources disagree the
# range covers both and `note` says so; `confidence` is "low" where no strong source was found.
# `prompt` holds the words a text-to-music prompt needs for the genre to come out; `negative`
# what makes it sound wrong; `visual` is the video's look (a creative choice, not sourced).
# anchor/genres.py loads this file; every lane in anchor.toml names its genres, and the tests
# check each lane against them (tempo, signature words in, wrong-sounding words out).
#
# ANCHOR's "raw hard tech" (Anchit, 2026-11-10: high BPM, industrial drums and bass) is hard
# techno and industrial techno pushed into hardtek tempo: the sources put hard techno at
# 140-160 and French hardtek/free tekno at 150-185. "Hard tech" alone is ambiguous (a 130-140
# tech house meaning exists but has no solid source), so prompts always spell the sound out.

# ---------------------------------------------------------------- techno
[[genre]]
id = "hard_techno"
name = "Hard Techno"
family = "techno"
bpm = [140, 160]
feel = "four-on-the-floor, straight, no swing"
kick = "heavy distorted kick with a rumble tail, close to a hardstyle kick"
bass = "aggressive, sidechained, often an acid line"
percussion = "sharp offbeat hats, sparse percussion"
synths = "dark industrial stabs, dissonant acid"
vocals = "sparse vocal chops"
structure = "8-bar sections, first drop near bar 16, first breakdown near bar 32, something new every 8 bars"
prompt = ["hard techno", "distorted kick", "rumble kick", "offbeat hats", "sidechained bass", "industrial stabs", "acid line"]
negative = ["swing shuffle", "clean house kick", "bright supersaw chords", "acoustic drums", "long 64-bar intro"]
visual = "strobe-lit concrete warehouse, red and white strobes, smoke, silhouettes"
sources = ["https://www.edmprod.com/what-is-hard-techno/", "https://mixmagmena.com/feature/has-dance-music-got-harder-faster-hor-berlin-hard-techno-rave-music-interview-investigation"]

