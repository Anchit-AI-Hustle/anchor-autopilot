[titles]
# Title patterns: V = verb, N = noun, A = adjective, P = particle ("Pull Under").
# no one-word titles: a single common word is nearly always a song already (checked 2026-10-24)
patterns = [["V N", 4], ["N N", 3], ["A N", 3], ["PH", 1]]
verbs = ["Initiate", "Breach", "Ignite", "Override", "Detonate", "Fracture", "Engage", "Unleash", "Grind", "Forge", "Dissolve", "Pierce", "Shatter", "Surge", "Summon", "Reclaim", "Command", "Awaken", "Distort", "Compress", "Eject", "Invoke", "Transmit", "Accelerate", "Strike", "Charge", "Collide", "Launch", "Bounce", "Spin", "Shake", "Twist", "Elevate", "Amplify", "Unlock", "Rewind", "Ricochet", "Levitate", "Electrify", "Catapult"]
# ready-made phrases for the "PH" pattern, in the spirit of "Pull Under"
phrases = ["Break Through", "Push Through", "Break Loose", "Cut Loose", "Run Deep", "Hold Tight", "Fall Inside", "Lift Off", "Spin Out", "Blast Off", "Bounce Back", "Take Off", "Get Loose", "Go Higher", "Freak Out", "Float Away", "Light Up", "Turn It Up", "Move Faster", "Feel It Rise"]
nouns = ["Mayhem", "Pressure", "Machine", "Signal", "Circuit", "Furnace", "Engine", "Static", "Voltage", "Protocol", "Reactor", "Frequency", "Pulse", "Tremor", "Chamber", "Horizon", "Gravity", "Chrome", "Iron", "Carbon", "Magnet", "Current", "Relay", "Sector", "Grid", "Axis", "Orbit", "Vector", "Cipher", "Tension", "Friction", "Impact", "Overload", "Afterburn", "Piston", "Turbine", "Hammer", "Monolith", "Prism", "Spiral", "Comet", "Laser", "Rocket", "Mirage", "Vortex", "Nebula", "Kaleidoscope", "Trampoline", "Hologram", "Satellite"]
adjectives = ["Molten", "Kinetic", "Heavy", "Feral", "Radiant", "Deep", "Raw", "Static", "Electric", "Hydraulic", "Magnetic", "Nuclear", "Sonic", "Iron", "Rogue", "Neon", "Cosmic", "Hyper", "Liquid", "Acid", "Golden", "Wild", "Lucid", "Turbo", "Rubber", "Elastic", "Spinning", "Floating", "Fluoro", "Supersonic"]

[youtube]
title = "{title}"
playlist_url = "https://www.youtube.com/playlist?list=PLSA3gW62zSYE"
category_id = "10"        # Music
privacy = "public"
ai_generated = true       # YouTube "AI use" disclosure: always on
notify_subscribers = true
# YouTube Data API units the robot may spend per day (Google's limit is 10,000, reset at
# midnight Pacific); the rest is headroom for the Uploads, sync and playlist jobs.
daily_quota_budget = 9500
# The Short goes through Buffer (no API quota) and through the API only if Buffer refuses it.
shorts_via = "buffer"
# The Shorts go up before the full-length videos exist, so every Short says so on its
# own line, high in the description where YouTube shows it before the "more" fold.
# short_note is gone: it said "Full song out soon" on every Short long after the full tracks
# were published - telling every viewer to wait for something already up, and pointing none
# of them at it. The copy links the full track instead.
# Instagram is hashtag-driven and allows 30; YouTube effectively ignores past the first few.
instagram_hashtags = ['#hardtechno', '#acidtechno', '#technomusic', '#psytechno',
  '#hardbounce', '#peaktimetechno', '#rawtechno', '#undergroundtechno', '#technoreel',
  '#electronicmusic', '#aimusic', '#newmusic', '#technolovers', '#rave', '#clubmusic',
  '#technodaily', '#psychedelictechno', '#anchortechno']
hashtags = ["#hardtechno", "#acidtechno", "#techno"]
base_tags = ["techno", "hard techno", "techno visualizer", "anchor techno", "techno official visualizer"]

