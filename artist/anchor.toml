[youtube]
title = "{title}"
playlist_url = "https://www.youtube.com/playlist?list=PLSA3gW62zSYE"
category_id = "10"        # Music
privacy = "public"
ai_generated = true       # YouTube "AI use" disclosure: always on
notify_subscribers = true
# The Shorts go up before the full-length videos exist, so every Short says so on its
# own line, high in the description where YouTube shows it before the "more" fold.
# short_note is gone: it said "Full song out soon" on every Short long after the full tracks
# were published - telling every viewer to wait for something already up, and pointing none
# of them at it. The copy links the full track instead.
# Instagram is hashtag-driven and allows 30; YouTube effectively ignores past the first few.
instagram_hashtags = ['#hardtechno', '#industrialtechno', '#technomusic', '#warehousetechno',
  '#darktechno', '#peaktimetechno', '#rawtechno', '#undergroundtechno', '#technoreel',
  '#electronicmusic', '#aimusic', '#newmusic', '#technolovers', '#rave', '#clubmusic',
  '#technodaily', '#instrumental', '#anchortechno']
hashtags = ["#hardtechno", "#industrialtechno", "#techno"]
base_tags = ["techno", "hard techno", "techno visualizer", "anchor techno", "techno official visualizer"]

