[titles]
# Title patterns: V = verb, N = noun, A = adjective, P = particle ("Pull Under").
patterns = [["V N", 4], ["N N", 3], ["A N", 3], ["PH", 1], ["N", 1]]
verbs = ["Initiate", "Breach", "Ignite", "Override", "Detonate", "Fracture", "Engage", "Unleash", "Grind", "Forge", "Dissolve", "Pierce", "Shatter", "Surge", "Summon", "Reclaim", "Command", "Awaken", "Distort", "Compress", "Eject", "Invoke", "Transmit", "Accelerate", "Strike", "Charge", "Collide", "Launch", "Bounce", "Spin", "Shake", "Twist", "Elevate", "Amplify", "Unlock", "Rewind", "Ricochet", "Levitate", "Electrify", "Catapult"]
