[titles]
# Title patterns: V = verb, N = noun, A = adjective, P = particle ("Pull Under").
patterns = [["V N", 4], ["N N", 3], ["A N", 3], ["PH", 1], ["N", 1]]
verbs = ["Initiate", "Breach", "Ignite", "Sever", "Override", "Detonate", "Descend", "Fracture", "Crush", "Engage", "Unleash", "Grind", "Forge", "Dissolve", "Pierce", "Shatter", "Rupture", "Surge", "Drown", "Hunt", "Summon", "Reclaim", "Command", "Awaken", "Enforce", "Corrupt", "Distort", "Compress", "Eject", "Terminate", "Invoke", "Devour", "Consume", "Transmit", "Accelerate", "Strike", "Charge", "Collide", "Dominate", "Erase"]
