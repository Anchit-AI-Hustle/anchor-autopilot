# ANCHOR artist profile
# The robot makes every creative decision from this file.
# Edit it to steer the sound, visuals, titles and schedule; no code changes needed.

[artist]
name = "ANCHOR"
handle = "@AT_ANCHOR"
suno_handle = "anchor_at"          # public profile the website syncs from
instagram_handle = "anchor_at2803"
youtube_channel_id = "UCAKPJrMOwspkOXY1aLKaAkQ"
youtube_url = "https://www.youtube.com/@AT_ANCHOR"
site_url = "https://anchor.anchit-tandon.com"
tagline = "Official tracks and releases by ANCHOR"
bio = "Hard techno, acid and psychedelic bounce at 160 to 200 BPM, with whispers and crowd chants. One new track every day."
# Titles already on the channel. The robot never reuses them.
existing_titles = ["Pull Under", "Apex Ascent", "Initiate Mayhem", "Fall Inside"]

[queue]
# Your own Suno songs go out first: every day the robot reads the public profile and queues
# the best song that is on format, above the floor, not another take of a song already out,
# and not personal. The engine renders only when the queue is empty. Songs about family,
# birthdays or love stay home: any of these words in the title or prompt keeps a song
# private, and never_titles names exact titles to keep private whatever they say.
auto = true
min_rating = 6.0
never_words = ["birthday", "happy birthday", "anniversary", "wedding", "mom", "mum", "mummy", "dad", "papa", "father", "mother", "sister", "brother", "family", "my love", "wife", "husband", "girlfriend", "boyfriend", "baby girl", "baby boy", "valentine", "proposal"]
never_titles = []

[schedule]
# Publish time in UTC. 17:30 UTC = 23:00 IST = 19:30 CEST = 13:30 ET.
post_time_utc = "17:30"
# One release every day: the full track as a video and the strongest 45 s as a Short, in
# the same slot. every_days = 2 makes it every second day, counted from anchor_date.
every_days = 1
anchor_date = "2026-09-20"

[music]
# Free or open-source tools only (your rule, 2026-10-04). Songs come from your own Suno
# songs first (see [queue]; the robot releases what you publish on your profile), then
# ACE-Step 1.5 (open source, MIT licence) running on the free GitHub runner through
# acestep.cpp. Paid engines (ElevenLabs, Lyria, Replicate) stay in the code but are never
# in this chain, and the daily run never receives their keys.
engines = ["acestep_cpp"]
elevenlabs_model = "music_v2_5"
duration_s = 150          # full track length when no range is set (tests, queued tracks)
duration_range_s = [135, 170]   # the day's length is drawn from here, and its arrangement shape from music.SHAPES
short_s = 45              # YouTube Short = the strongest 45 s of the track
# sft, not turbo: the turbo DiT is distilled to 8 steps and silently clamps CFG to 1.0,
# so the caption barely steers it - an "acid" brief came out as generic techno. The sft
# DiT honours guidance, at 32-50 steps (model card), which is what makes the genre land.
dit_model = "acestep-v15-sft-Q8_0"
lm_model = "acestep-5Hz-lm-0.6B-Q8_0"
steps = 32        # sft range is 32-50; 32 keeps the render inside the runner budget
guidance = 5.0    # real CFG: the lever turbo never had
shift = 3.0
keys = ["F minor", "G minor", "A minor", "D minor", "E minor", "C minor", "B minor", "F# minor", "C# minor", "G# minor"]
# The style prompt is composed layer by layer (genre -> era -> mood arc -> tempo/groove ->
# instruments and when they enter -> vocals -> production -> arrangement arc -> special
# moment), then compressed into prose; see brief.compose_style. These two lines are the
# layers every lane shares; each lane below supplies its own era, groove, moods, production
# and special moments, and rotates them day to day.
# Whispers and chants (Anchit, 2026-10-04): words are whispered in the quiet sections and
# shouted as short crowd chants in the drops (brief.vocal_sheet writes them under each
# section of the lyrics sheet). Never a sung melody.
vocals = "Vocals: whispers in the quiet parts, shouted crowd chants in the drops, never sung"
# What the channel's best records share (measured 2026-09-23): the kick's click and the bass's
# harmonics carry on a phone speaker, the textures are wide while kick and sub stay centred,
# and the record falls away and comes back rather than holding one level.
mastering = "club master, sub-bass harmonics audible on small speakers, kick with a clear click, wide textures over a centred kick and sub, real dynamics"
# Bouncy, fun and psychedelic, never dark (Anchit, 2026-10-04): gloom and stiffness are
# named in the negative so the LM steers away from them.
feel = "bouncy, fun and psychedelic, never dark"
negative = "sung melody, pop vocals, rap verses, ballad singing, acoustic guitar, piano ballad, lo-fi, jazz, cheesy EDM build-ups, trailer-music cliches, constant full-volume loop, dark horror drones, gloomy menacing atmosphere, stiff robotic groove"
# A model asked for N seconds renders N seconds and stops mid-bar. The arrangement (see
# music.structure) is the real fix; this is the safety net, and it only fires when the
# track is measurably still at full level on its last second.
outro_fade_s = 3.0
# Measured on the channel 2026-09-23: the -11 LUFS / -1 dBTP masters came back from
# YouTube's AAC encoder at +0.2 to +1.2 dBTP (codec overshoot, audible as grit on the
# kick), and YouTube turns everything down to -14 anyway, so the extra 3 dB bought nothing.
# -14 with 1.5 dB of true-peak headroom plays at exactly the level YouTube would have set,
# with the transients intact.
loudness_lufs = -14.0     # integrated loudness of the master = YouTube's playback level
true_peak_db = -1.5

[music.voice]
# Words for the whispers and chants. The chant in every drop is the song's own title, so the
# record is named after what the crowd shouts; whispers and shouts rotate from these lists.
whispers = ["let it melt", "deeper now", "close your eyes", "feel the acid", "lose control", "we fly tonight", "breathe it in", "follow the light", "inside the sound", "higher and higher", "never stop moving", "let the colours in"]
shouts = ["jump", "hey", "bounce", "go", "hands up", "louder", "again", "move"]

