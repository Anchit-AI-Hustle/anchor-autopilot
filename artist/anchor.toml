# ANCHOR artist profile
# The robot makes every creative decision from this file.
# Edit it to steer the sound, visuals, titles and schedule; no code changes needed.

[artist]
name = "ANCHOR"
handle = "@AT_ANCHOR"
suno_handle = "anchor_at"          # public profile the website syncs from
instagram_handle = "anchor_at2803"
youtube_channel_id = "UCAKPJrMOwspkOXY1aLKaAkQ"
youtube_url = "https://www.youtube.com/@AT_ANCHOR"
site_url = "https://anchor.anchit-tandon.com"
tagline = "Official tracks and releases by ANCHOR"
bio = "Hard techno, hard tech, acid and psychedelic bounce, plus rave rap and hip hop crossovers, with whispers, chants and verses. One new track every day."
# Titles already on the channel. The robot never reuses them.
existing_titles = ["Pull Under", "Apex Ascent", "Initiate Mayhem", "Fall Inside"]

[queue]
# Your own Suno songs go out first: every day the robot reads the public profile and queues
# the best song that is on format, above the floor, not another take of a song already out,
# and not personal. The engine renders only when the queue is empty. Songs about family,
# birthdays or love stay home: any of these words in the title or prompt keeps a song
# private, and never_titles names exact titles to keep private whatever they say.
auto = true
min_rating = 6.0
never_words = ["birthday", "happy birthday", "anniversary", "wedding", "mom", "mum", "mummy", "dad", "papa", "father", "mother", "sister", "brother", "family", "my love", "wife", "husband", "girlfriend", "boyfriend", "baby girl", "baby boy", "valentine", "proposal"]
never_titles = []

[schedule]
# Publish time in UTC. 17:30 UTC = 23:00 IST = 19:30 CEST = 13:30 ET.
post_time_utc = "17:30"
# As many songs a day as YouTube allows (Anchit, 2026-10-24: "max possible"). One run renders
# the day's songs side by side (YYYY-MM-DD, -2, -3, -4, -5) as the quota budget allows (anchor/quota.py):
# five a day while the Shorts go through Buffer (~1,700 API units a song), two when they cannot
# (~3,300). Later songs go live at these times, in order: 01:00, 03:00, 04:30, 05:15 IST.
extra_post_times_utc = ["19:30", "21:30", "23:00", "23:45"]
max_drops_per_day = 5
# "when_ready": every song goes public the moment it is uploaded (Anchit, 2026-10-26: "live as soon
# as ready"); "scheduled": at the post times above.
go_live = "when_ready"
# One release every day: the full track as a video and the strongest 45 s as a Short, in
# the same slot. every_days = 2 makes it every second day, counted from anchor_date.
every_days = 1
anchor_date = "2026-09-20"
# Each song of the day comes from one genre group, so every day has hard tech, psy, rap and hip
# hop (Anchit, 2026-10-29: "all songs for all genres as asked"). The order turns one step a day,
# so the first slot (the one that most often makes it) is a different genre each day. "any"
# draws from every active lane, the combinations included.
# 2026-11-10 (Anchit: "if you are making hard tech, ensure hard tech songs are made"): the
# first slot of every day is always a raw hard tech song; the others turn one step a day.
slot_groups = ["hardtech", "rap", "psy", "hiphop", "any"]
first_slot_group = "hardtech"

[music]
# Free or open-source tools only (your rule, 2026-10-04). Songs come from your own Suno
# songs first (see [queue]; the robot releases what you publish on your profile), then
# ACE-Step 1.5 (open source, MIT licence) running on the free GitHub runner through
# acestep.cpp. Paid engines (ElevenLabs, Lyria, Replicate) stay in the code but are never
# in this chain, and the daily run never receives their keys.
engines = ["acestep_cpp"]
elevenlabs_model = "music_v2_5"
duration_s = 190          # full track length when no range is set (tests, queued tracks)
duration_range_s = [185, 215]   # the day's length is drawn from here, and its arrangement shape from music.SHAPES
short_s = 45              # YouTube Short = the strongest 45 s of the track
# sft, not turbo: the turbo DiT is distilled to 8 steps and silently clamps CFG to 1.0,
# so the caption barely steers it - an "acid" brief came out as generic techno. The sft
# DiT honours guidance, at 32-50 steps (model card), which is what makes the genre land.
dit_model = "acestep-v15-sft-Q8_0"
lm_model = "acestep-5Hz-lm-0.6B-Q8_0"
steps = 32        # sft range is 32-50; 32 keeps the render inside the runner budget
guidance = 5.0    # real CFG: the lever turbo never had
shift = 3.0

# minor and major keys (Anchit, 2026-10-31: "different melodies, sounds, everything"): every key
# was minor before, so every song sat in the same colour; bouncy and fun often wants major
keys = ["F minor", "G minor", "A minor", "D minor", "E minor", "C minor", "B minor", "F# minor", "C# minor", "G# minor",
        "C major", "D major", "E major", "F major", "G major", "A major", "Bb major", "Eb major"]
# The style prompt is composed layer by layer (genre -> era -> mood arc -> tempo/groove ->
# instruments and when they enter -> vocals -> production -> arrangement arc -> special
# moment), then compressed into prose; see brief.compose_style. These two lines are the
# layers every lane shares; each lane below supplies its own era, groove, moods, production
# and special moments, and rotates them day to day.
# Whispers and chants (Anchit, 2026-10-04): words are whispered in the quiet sections and
# shouted as short crowd chants in the drops (brief.vocal_sheet writes them under each
# section of the lyrics sheet). Never a sung melody.
vocals = "Vocals: {singer}, natural English, real breaths, short sung lines in the quiet parts, the crowd sings the title in the drops"
# What the channel's best records share (measured 2026-09-23): the kick's click and the bass's
# harmonics carry on a phone speaker, the textures are wide while kick and sub stay centred,
# and the record falls away and comes back rather than holding one level.
mastering = "club master, lead and chords loud over the drums, sub audible on phones, real dynamics"
melody_target = 0.84          # held notes vs hits; Anchit's Suno songs 0.805 to 0.918 (anchor.mixbalance)
max_drum_cut_db = 6.0
# Anchit's Suno songs are all warehouse techno: as a timbre reference they pulled every genre
# toward the same sound, so a take leans only on songs of its own genre group (anchor.music)
ref_groups = { hardtech = ["2026-09-04", "2026-09-05", "2026-09-06", "2026-09-07", "2026-09-08", "2026-09-09", "2026-09-14"], psy = ["2026-09-10", "2026-09-13"] }
# Bouncy, fun and psychedelic, never dark (Anchit, 2026-10-04): gloom and stiffness are
# named in the negative so the LM steers away from them.
feel = "bouncy, fun and psychedelic, never dark"
# 2026-11-10: hard tech means a heavy distorted kick and bass, never a tech house shuffle
negative = "tech house, soft kick, thin weak bass, plucky house bass, robotic vocals, vocoder voice, monotone text-to-speech voice, rap verses, ballad singing, slurred or accented words, acoustic guitar, piano ballad, lo-fi, jazz, cheesy EDM build-ups, trailer-music cliches, constant full-volume loop, dark horror drones, gloomy menacing atmosphere, stiff robotic groove, silent gaps, sudden stops, tape stops, stutter edits, dropouts, beat cutting out"
# A model asked for N seconds renders N seconds and stops mid-bar. The arrangement (see
# music.structure) is the real fix; this is the safety net, and it only fires when the
# track is measurably still at full level on its last second.
outro_fade_s = 3.0
# Measured on the channel 2026-09-23: the -11 LUFS / -1 dBTP masters came back from
# YouTube's AAC encoder at +0.2 to +1.2 dBTP (codec overshoot, audible as grit on the
# kick), and YouTube turns everything down to -14 anyway, so the extra 3 dB bought nothing.
# -14 with 1.5 dB of true-peak headroom plays at exactly the level YouTube would have set,
# with the transients intact.
loudness_lufs = -14.0     # integrated loudness of the master = YouTube's playback level
true_peak_db = -1.5

# Where a run renders decides how big a model it can afford (Anchit, 2026-10-29: "use the Mac
# GPU"; songs were low quality). The daily run picks "mac" when the Mac runner is online, and
# the lines above (2B DiT, 0.6B planner, 32 steps) stay the GitHub CPU fallback. Takes are
# rendered until best_of of them pass the song gate, and the best passing take ships.
# Anchit's nine Suno songs (2026-09-04 to 09-14): the timbre reference for the Mac's takes
# (ace-synth --ref-audio). They set the song gate's limits; the gate passes all nine. A take
# leans on one of them for its tone only; melody, words and arrangement stay its own, and the
# audio check still sends back anything that sounds like a released record.
reference_songs = [
  "https://github.com/Anchit-AI-Hustle/anchor-autopilot/releases/download/drop-2026-09-04/ANCHOR-2026-09-04-then-do-it.mp3",
  "https://github.com/Anchit-AI-Hustle/anchor-autopilot/releases/download/drop-2026-09-05/ANCHOR-2026-09-05-silent-transmission.mp3",
  "https://github.com/Anchit-AI-Hustle/anchor-autopilot/releases/download/drop-2026-09-06/ANCHOR-2026-09-06-stay-with-me.mp3",
  "https://github.com/Anchit-AI-Hustle/anchor-autopilot/releases/download/drop-2026-09-07/ANCHOR-2026-09-07-robot-love.mp3",
  "https://github.com/Anchit-AI-Hustle/anchor-autopilot/releases/download/drop-2026-09-08/ANCHOR-2026-09-08-where-it-begins.mp3",
  "https://github.com/Anchit-AI-Hustle/anchor-autopilot/releases/download/drop-2026-09-09/ANCHOR-2026-09-09-let-s-fucking-go.mp3",
  "https://github.com/Anchit-AI-Hustle/anchor-autopilot/releases/download/drop-2026-09-10/ANCHOR-2026-09-10-signal-detected.mp3",
  "https://github.com/Anchit-AI-Hustle/anchor-autopilot/releases/download/drop-2026-09-13/ANCHOR-2026-09-13-project-mayhem.mp3",
  "https://github.com/Anchit-AI-Hustle/anchor-autopilot/releases/download/drop-2026-09-14/ANCHOR-2026-09-14-crossing-the-threshold.mp3",
]

[music.renderers.mac]
# the 4B XL DiT with SFT weights merged into turbo (8 steps), and the 4B planner, the strongest at
# composition and melody. Measured on the M5, 2026-10-30: about 6 min a take where the XL SFT at
# 50 steps took 22 min for a take that measured no better, so four takes fit where one did.
dit_model = "acestep-v15-xl-sftturbo50-Q8_0"
lm_model = "acestep-5Hz-lm-4B-Q8_0"
steps = 8
guidance = 1.0
shift = 3.0
takes = 6           # 2026-10-31 first Mac run: 1 of 4 takes reached the gate, so six
best_of = 1         # 2026-11-09 "the songs shouldnt take so long": the first take that passes the gate ships

[music.renderers.cpu]
takes = 2
best_of = 1

