# Song themes (Anchit, 2026-10-31: "song names, lyrics and themes to be improved").
#
# Before this, every title was two random words from one list ("Kinetic Carbon", "Afterburn
# Chrome": "afterburn" four times, "carbon" three times) and every song drew its whispers and
# rap bars from the same twelve and thirty-two lines, so "close your eyes" and "breathe it in"
# were sung on song after song. Now each song is about something. A theme brings:
#
#   idea      one line the song is about; it goes into the prompt's mood and the description
#   titles    names that sound like a moment, in plain English that is easy to chant
#   nouns     the theme's things; when its titles are used up, a name is one of these and a move
#             ("Lantern Shuffle", "Pinball Stomp"), each noun used once ever
#   whispers  the quiet lines, sung in the intro, the breakdown and the outro
#   chants    short shouts that answer the title in the drops
#   rap       twelve bars for the rap and hip hop lanes, three verses of four
#
# Rules the tests hold every theme to: plain words of at most three syllables in a title, no
# title word ever used in an earlier ANCHOR title, no line shared between two themes, no
# production words a singer could mistake for lyrics, fun and never dark.

