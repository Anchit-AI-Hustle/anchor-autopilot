name: Drop (daily)

on:
  schedule:
    # As many songs a day as the YouTube quota allows (Anchit, 2026-10-24: "max possible"). One
    # run plans the day's missing songs (anchor plan-drops: YYYY-MM-DD, -2 ... -5, as many as the
    # quota budget has room for) and renders them side by side, one runner each, so a render of
    # up to 5 h or a schedule GitHub starts hours late still yields the whole day (2026-10-25:
    # five runs one after the other made one song). The later runs only fill what failed.
    - cron: "37 8 * * *"   # 08:37 UTC (14:07 IST): after the YouTube quota reset (07:00 UTC summer, 08:00 winter)
    - cron: "37 13 * * *"  # 13:37 UTC: remakes any song the first run could not make
    # Mac first (Anchit, 2026-11-11: "better quality music, songs and videos now onwards"): the
    # Mac's 4B XL model makes the better songs, and on 11-11 the Mac slept through the 13:37 run
    # so four songs went to the small CPU model. A run that finds the Mac asleep before 19:00 UTC
    # now waits for one of these later runs; the 19:37 run renders on the CPU if the Mac never
    # came back, so a day is never left empty.
    - cron: "37 10 * * *"
    - cron: "37 16 * * *"
    - cron: "37 19 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Drop id(s): YYYY-MM-DD, YYYY-MM-DD-2 ... -5, comma separated for several. Default: every song today still needs, as the YouTube quota allows"
        required: false
        default: ""
      publish_now:
        description: "Publish to YouTube and Instagram immediately instead of at 17:30 UTC"
        type: boolean
        default: false
      dry_run:
        description: "Render only: no release, no website update, no YouTube"
        type: boolean
        default: false
      force:
        description: "Re-make a date that already has a drop (replaces its files)"
        type: boolean
        default: false
      ignore_queue:
        description: "Generate with the model even if your own tracks are queued (for testing the engine)"
        type: boolean
        default: false
      renderer:
        description: "Where the songs render: auto (the Mac GPU when it is online, else GitHub's CPU), mac or cpu"
        type: choice
        options: [auto, mac, cpu]
        default: auto
      from_run:
        description: "Post songs an earlier run already made: that run's id (its make jobs passed, a later step failed). Nothing is rendered again"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # the Mac watch: cancel a run whose Mac never picked it up and start it on GitHub's CPU

concurrency:
  # runs that post go one after the other; a render-only run (dry_run) posts nothing, so it renders
  # beside them (2026-11-12: a run waiting hours for the YouTube quota held the idle Mac back)
  group: ${{ inputs.dry_run && format('daily-render-{0}', github.run_id) || 'daily-drop' }}
  cancel-in-progress: false

env:
  ACESTEP_CPP_REPO: https://github.com/ServeurpersoCom/acestep.cpp.git
  ACESTEP_CPP_REF: c9045e270c3145a288579fee4f298286e03aa881
  HF_REPO: Serveurperso/ACE-Step-1.5-GGUF
  # file:bytes, verified against huggingface.co/Serveurperso/ACE-Step-1.5-GGUF (MIT licence)
  MODEL_FILES: >-
    acestep-v15-sft-Q8_0.gguf:2549527936
    acestep-5Hz-lm-0.6B-Q8_0.gguf:709846656
    Qwen3-Embedding-0.6B-Q8_0.gguf:784144960
    vae-BF16.gguf:337420928
  MODELS_CACHE_KEY: acestep15-gguf-q8-sft-lm06-v1
  # the Mac renderer's models (Anchit, 2026-10-29: "use the Mac GPU"): the 4B XL DiT (sftturbo50) and the 4B
  # planner, kept on the Mac in ~/anchor-gpu/models between runs (tools/mac-runner-setup.sh)
  MAC_MODEL_FILES: >-
    acestep-v15-xl-sftturbo50-Q8_0.gguf:5305828768
    acestep-5Hz-lm-4B-Q8_0.gguf:4457323648
    Qwen3-Embedding-0.6B-Q8_0.gguf:784144960
    vae-BF16.gguf:337420928
  ROBOT_NAME: "Anchit Tandon"
  ROBOT_EMAIL: "anchit.tandon@gmail.com"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      drops: ${{ steps.plan.outputs.drops }}
      from_run: ${{ steps.plan.outputs.from_run }}
      count: ${{ (steps.where.outputs.renderer == 'wait' && steps.plan.outputs.from_run == '') && '0' || steps.plan.outputs.count }}
      renderer: ${{ steps.where.outputs.renderer }}
      runs_on: ${{ steps.where.outputs.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Plan the day's songs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            # one id or several, comma separated (Anchit, 2026-11-09: "complete right now")
            DROPS="$(python -c "import json,sys;print(json.dumps([d.strip() for d in sys.argv[1].split(',') if d.strip()]))" "${{ inputs.date }}")"
          else
            # every song today still needs, as many as the YouTube quota budget has room for
            DROPS="$(python -m anchor plan-drops 2>plan.txt)"
            echo "::notice::$(tail -n 1 plan.txt)"
          fi
          FROM="${{ inputs.from_run }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Use the songs made overnight (prerender.yml): a render-only run of the last day whose
            # songs for today passed every check is posted as it is, nothing made again
            TODAY="$(date -u +%F)"
            SINCE="$(date -u -d '20 hours ago' +%FT%TZ)"
            for RID in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/runs?status=success&per_page=30" \
                -q ".workflow_runs[] | select(.created_at > \"$SINCE\") | .id"); do
              MADE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts" -q '.artifacts[] | select(.expired | not) | .name' \
                | sed -n "s/^drop-\($TODAY\(-[0-9]\)\{0,1\}\)$/\1/p" | sort -u)"
              WANT=""
              for D in $MADE; do [ "$(python -m anchor has-drop --date "$D" 2>/dev/null)" = yes ] || WANT="$WANT $D"; done
              if [ -n "$WANT" ]; then
                FROM="$RID"
                DROPS="$(python -c "import json,sys;print(json.dumps(sys.argv[1].split()))" "$WANT")"
                echo "::notice::Posting the songs made overnight by run $RID:$WANT"
                break
              fi
            done
          fi
          echo "from_run=$FROM" >> "$GITHUB_OUTPUT"
          echo "drops=$DROPS" >> "$GITHUB_OUTPUT"
          echo "count=$(python -c "import json,sys;print(len(json.loads(sys.argv[1])))" "$DROPS")" >> "$GITHUB_OUTPUT"

      # The Mac's GPU renders the big model (4B XL + 4B planner, best of several takes) when it
      # is online: its heartbeat (tools/mac-heartbeat.sh, every 5 min while the runner is up)
      # stamps the repo variable ANCHOR_MAC_SEEN. Older than 20 min means asleep or off, and the
      # songs render on GitHub's CPU with the smaller model, as before.
      - name: Pick where the songs render
        id: where
        env:
          SEEN: ${{ vars.ANCHOR_MAC_SEEN }}
          WANT: ${{ inputs.renderer || 'auto' }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$SEEN" in ''|*[!0-9]*) SEEN=0 ;; esac
          AGE=$(( $(date +%s) - SEEN ))
          HOUR=$((10#$(date -u +%H)))
          if [ "$WANT" = "auto" ] && [ "$AGE" -gt 1200 ] && [ "$EVENT" = "schedule" ] && [ "$HOUR" -lt 19 ]; then
            # Mac first: wait for a later run while the Mac may still wake up today
            echo "renderer=wait" >> "$GITHUB_OUTPUT"
            echo 'runs_on="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
            echo "::notice::The Mac is asleep (heartbeat ${AGE}s ago): waiting for a later run to render on its GPU; the 19:37 UTC run falls back to the CPU"
          elif [ "$WANT" = "mac" ] || { [ "$WANT" = "auto" ] && [ "$AGE" -le 1200 ]; }; then
            echo "renderer=mac" >> "$GITHUB_OUTPUT"
            echo 'runs_on=["self-hosted","macOS","ARM64","anchor-mac"]' >> "$GITHUB_OUTPUT"
            echo "::notice::Rendering on the Mac GPU (last heartbeat ${AGE}s ago)"
          else
            echo "renderer=cpu" >> "$GITHUB_OUTPUT"
            echo 'runs_on="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
            echo "::notice::Rendering on GitHub's CPU (Mac heartbeat $([ "$SEEN" = 0 ] && echo never || echo "${AGE}s ago"))"
          fi

  # A Mac run whose Mac never picks up the work (asleep, lid closed) would wait in the queue for
  # a day and hold every later run behind it (concurrency group daily-drop). After 20 min with
  # no song started this cancels the run and starts it again on GitHub's CPU.
  mac-watch:
    needs: plan
    if: needs.plan.outputs.count != '0' && needs.plan.outputs.renderer == 'mac' && needs.plan.outputs.from_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Wait for the Mac to start a song
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force || false }}
          DRY: ${{ inputs.dry_run || false }}
          NOW_: ${{ inputs.publish_now || false }}
          IGNQ: ${{ inputs.ignore_queue || false }}
        run: |
          for i in $(seq 1 40); do
            STARTED="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=50" \
              -q '[.jobs[] | select(.name | startswith("make")) | select(.status != "queued" and .status != "waiting")] | length')"
            [ "${STARTED:-0}" -gt 0 ] && { echo "The Mac started rendering."; exit 0; }
            sleep 30
          done
          echo "::warning::The Mac did not pick up the songs in 20 min; starting them again on GitHub's CPU."
          gh workflow run daily.yml --ref "$GITHUB_REF_NAME" -f renderer=cpu -f date="$DATE" -f force="$FORCE" \
            -f dry_run="$DRY" -f publish_now="$NOW_" -f ignore_queue="$IGNQ"
          gh run cancel "$RUN_ID"

  make:
    needs: plan
    if: needs.plan.outputs.count != '0' && needs.plan.outputs.from_run == ''
    # the Mac (self-hosted, label anchor-mac) or GitHub's CPU, as the plan picked
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    # the CPU music engine can run past 3.5 h (210 cancelled the 10-18 and 10-22 drops); the Mac
    # renders a take in minutes, but a Mac short of memory (2026-11-02: 129 browser processes, load
    # 900) took 2 h for one song and the old 120 min limit killed it minutes before it was done
    timeout-minutes: ${{ needs.plan.outputs.renderer == 'mac' && 240 || 350 }}
    env:
      ANCHOR_RENDERER: ${{ needs.plan.outputs.renderer }}
    strategy:
      fail-fast: false     # one song failing its checks never stops the others
      matrix:
        drop: ${{ fromJSON(needs.plan.outputs.drops) }}
    steps:
      # the branch as it is NOW, not as it was when this run was queued: a run that waited
      # hours behind the previous drop must see that drop (titles, catalogue)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        if: env.ANCHOR_RENDERER != 'mac'
        with:
          python-version: "3.12"
          cache: pip

      # setup-python cannot install into a self-hosted Mac (it writes to /Users/runner): the
      # Mac uses Homebrew's Python 3.12 in a venv kept between runs
      - name: Python 3.12 on the Mac
        if: env.ANCHOR_RENDERER == 'mac'
        run: |
          PY=/opt/homebrew/bin/python3.12
          [ -x "$PY" ] || brew install python@3.12
          VENV="$HOME/anchor-gpu/runner-venv"
          [ -x "$VENV/bin/python" ] || "$PY" -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" --version

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # the recogniser that listens to every take for sung production notes (anchor/lyriccheck.py)
          pip install "faster-whisper==1.2.1" "av<16" soundfile
          # the song gate that measures every take against Anchit's own songs (anchor/songgate.py)
          pip install -r requirements-gate.txt
          # the lyrics in the videos: vocal stem (demucs) and word alignment (torchaudio). Without
          # torchaudio the words kept Whisper's drifting times and the karaoke ran out of sync
          # (Outrun Your Shadow, 2026-11-08)
          pip install -r requirements-lyrics.txt
          python -c "import torchaudio, demucs" || echo "::warning::lyrics alignment unavailable: videos will show lyrics on rough timings"
          bash scripts/install-ffmpeg.sh

      - name: Cache the speech model (faster-whisper small)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-small-v1

      - name: Pick the drop date
        id: day
        env:
          DATE: ${{ matrix.drop }}
          PLAN: ${{ needs.plan.outputs.drops }}
        run: |
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.force }}" != "true" ] \
             && [ "$(python -m anchor has-drop --date "$DATE")" = "yes" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A drop for $DATE is already out; nothing to do."
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(python -m anchor cadence --date "$DATE")" = "no" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$DATE is an off-day on the schedule (schedule.every_days); nothing to do."
          elif [ "${{ inputs.dry_run }}" != "true" ] && [ "$(python -m anchor can-make --date "$DATE" 2>can-make.txt)" = "no" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No drop on $DATE: songs come only from Suno or the free ACE-Step engine, and $(tail -n 1 can-make.txt)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            # only the first song of the plan may take a queued Suno song, so two runners
            # never release the same track
            FIRST="$(python -c "import json,sys;print(json.loads(sys.argv[1])[0])" "$PLAN")"
            if [ "$DATE" = "$FIRST" ] && [ "${{ inputs.ignore_queue }}" != "true" ]; then
              echo "noq=" >> "$GITHUB_OUTPUT"
            else
              echo "noq=--no-queue" >> "$GITHUB_OUTPUT"
            fi
            # the songs planned before this one render on other runners at the same time:
            # hold their briefs here so this song still differs in lane, title, key and look
            python -m anchor reserve --plan "$PLAN" --drop "$DATE"
          fi

      - name: Fingerprint the CPU (native builds are CPU specific)
        if: steps.day.outputs.skip != 'true' && env.ANCHOR_RENDERER != 'mac'
        id: cpu
        # the model name alone is not enough: runners sharing a model name expose different
        # instruction sets, and a build made for one died with SIGILL on another (2026-09-23)
        run: |
          grep -m1 'model name' /proc/cpuinfo; nproc
          echo "hash=$( (grep -m1 'model name' /proc/cpuinfo; grep -m1 '^flags' /proc/cpuinfo) | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore acestep.cpp build
        if: steps.day.outputs.skip != 'true' && env.ANCHOR_RENDERER != 'mac'
        id: bin
        uses: actions/cache/restore@v4
        with:
          path: vendor/acestep.cpp/build
          key: acestep-bin-${{ env.ACESTEP_CPP_REF }}-${{ steps.cpu.outputs.hash }}

      - name: Build acestep.cpp (CPU)
        if: steps.day.outputs.skip != 'true' && env.ANCHOR_RENDERER != 'mac' && steps.bin.outputs.cache-hit != 'true'
        run: |
          rm -rf vendor/acestep.cpp
          git clone --recurse-submodules "$ACESTEP_CPP_REPO" vendor/acestep.cpp
          cd vendor/acestep.cpp
          git checkout "$ACESTEP_CPP_REF"
          git submodule update --init --recursive
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON
          cmake --build build --config Release -j "$(nproc)" --target ace-synth ace-lm
          ls -la build/ace-synth build/ace-lm

      - name: Save acestep.cpp build
        if: steps.day.outputs.skip != 'true' && env.ANCHOR_RENDERER != 'mac' && steps.bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/acestep.cpp/build
          key: acestep-bin-${{ env.ACESTEP_CPP_REF }}-${{ steps.cpu.outputs.hash }}

      - name: Restore models
        if: steps.day.outputs.skip != 'true' && env.ANCHOR_RENDERER != 'mac'
        id: models
        uses: actions/cache/restore@v4
        with:
          path: vendor/models
          key: ${{ env.MODELS_CACHE_KEY }}

      - name: Download ACE-Step 1.5 GGUF models (MIT licence)
        if: steps.day.outputs.skip != 'true' && env.ANCHOR_RENDERER != 'mac' && steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p vendor/models
          for entry in $MODEL_FILES; do
            f="${entry%%:*}"; want="${entry##*:}"
            curl -fL --retry 5 --retry-delay 10 -o "vendor/models/$f" "https://huggingface.co/$HF_REPO/resolve/main/$f"
            got="$(stat -c %s "vendor/models/$f")"
            [ "$got" = "$want" ] || { echo "::error::$f is $got bytes, expected $want"; exit 1; }
          done
          ls -la vendor/models

      - name: Save models
        if: steps.day.outputs.skip != 'true' && env.ANCHOR_RENDERER != 'mac' && steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/models
          key: ${{ env.MODELS_CACHE_KEY }}

      - name: The Mac's engine and models (Metal build, 4B XL DiT, 4B planner)
        if: steps.day.outputs.skip != 'true' && env.ANCHOR_RENDERER == 'mac'
        run: |
          G="$HOME/anchor-gpu"
          if [ "$(git -C "$G/acestep.cpp" rev-parse HEAD 2>/dev/null)" != "$ACESTEP_CPP_REF" ] || [ ! -x "$G/acestep.cpp/build/ace-synth" ]; then
            rm -rf "$G/acestep.cpp"
            git clone --recurse-submodules "$ACESTEP_CPP_REPO" "$G/acestep.cpp"
            git -C "$G/acestep.cpp" checkout "$ACESTEP_CPP_REF"
            git -C "$G/acestep.cpp" submodule update --init --recursive
            cmake -S "$G/acestep.cpp" -B "$G/acestep.cpp/build" -DCMAKE_BUILD_TYPE=Release
            cmake --build "$G/acestep.cpp/build" --config Release -j "$(sysctl -n hw.ncpu)" --target ace-synth ace-lm
          fi
          mkdir -p "$G/models"
          for entry in $MAC_MODEL_FILES; do
            f="${entry%%:*}"; want="${entry##*:}"
            [ "$(stat -f %z "$G/models/$f" 2>/dev/null)" = "$want" ] && continue
            curl -fL --retry 5 --retry-delay 10 -o "$G/models/$f" "https://huggingface.co/$HF_REPO/resolve/main/$f"
            got="$(stat -f %z "$G/models/$f")"
            [ "$got" = "$want" ] || { echo "::error::$f is $got bytes, expected $want"; exit 1; }
          done
          echo "ACESTEP_BIN=$G/acestep.cpp/build" >> "$GITHUB_ENV"
          echo "ACESTEP_MODELS=$G/models" >> "$GITHUB_ENV"
          echo "ACE_THREADS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
          # Anchit's own Suno songs, the timbre references (artist/anchor.toml [music] reference_songs)
          mkdir -p "$G/refs"
          python - <<'PY' | while read -r url; do f="$G/refs/$(basename "${url%%\?*}")"; [ -s "$f" ] || curl -fsSL --retry 3 -o "$f" "$url"; done
          import tomllib
          for u in tomllib.load(open("artist/anchor.toml", "rb"))["music"].get("reference_songs", []):
              print(u)
          PY
          ls "$G/refs"
          echo "ANCHOR_REF_DIR=$G/refs" >> "$GITHUB_ENV"

      - name: Make the drop (brief, track, master, cover, full videos, Short)
        if: steps.day.outputs.skip != 'true'
        id: make
        env:
          DATE: ${{ steps.day.outputs.date }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANCHOR_VAE_CHUNK: "1024"
          # a slot the song gate held in an earlier run gets new seeds in this one
          ANCHOR_SEED_SALT: ${{ github.run_id }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ "$ANCHOR_RENDERER" != "mac" ]; then
            export ACESTEP_BIN="$GITHUB_WORKSPACE/vendor/acestep.cpp/build" ACESTEP_MODELS="$GITHUB_WORKSPACE/vendor/models"
            export ACE_THREADS="$(nproc)"
          fi
          # no new take starts that would run past the job's limit (take times are measured)
          LIMIT_MIN=$([ "$ANCHOR_RENDERER" = "mac" ] && echo 115 || echo 340)
          export ANCHOR_MAKE_DEADLINE=$(( $(date +%s) + LIMIT_MIN * 60 ))
          RC=0
          if [ "$ANCHOR_RENDERER" = "mac" ]; then
            # the Mac stays awake while it renders (a closed lid still sleeps it)
            caffeinate -i python -m anchor make --date "$DATE" --out "build/$DATE" ${{ steps.day.outputs.noq }} || RC=$?
          else
            python -m anchor make --date "$DATE" --out "build/$DATE" ${{ steps.day.outputs.noq }} || RC=$?
          fi
          if [ "$RC" = 3 ]; then
            # the hard song gate: no take was good enough, so this song is held, not posted
            echo "held=true" >> "$GITHUB_OUTPUT"
            WHY="$(python -c "import json;print('; '.join(json.load(open('build/$DATE/held.json'))['why'][:5]))")"
            echo "::warning::$DATE held by the song gate (nothing posted): $WHY"
            printf '### %s held by the song gate\n\nNothing was posted. %s\n' "$DATE" "$WHY" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$RC" = 0 ] || exit "$RC"
          python - >> "$GITHUB_OUTPUT" <<EOF
          import json
          m = json.load(open("build/$DATE/meta.json"))
          print("title=" + m["brief"]["title"])
          EOF
          python - >> "$GITHUB_STEP_SUMMARY" <<EOF
          import json
          m = json.load(open("build/$DATE/meta.json")); b = m["brief"]
          print(f"### {b['title']}\n\n{b['lane_name']} · {b['bpm']} BPM · {b['key']} · {b['family_name']}\n")
          print(f"- Engine: {m['engine'].get('engine')} ({m['engine'].get('model')}), {m['engine'].get('total_s')} s"
                + (f" - fell back from {m['engine']['fallback_from']}: {m['engine'].get('fallback_reason')}" if m['engine'].get('fallback_from') else ""))
          print(f"- Title: {b.get('youtube_title')}" + (f" (hook: {b['hook']!r})" if b.get('hook') else ""))
          print(f"- Nearest released audio: {m['qc']['attempts'][-1].get('nearest_audio')}; nearest cover: {m['art'].get('nearest')}")
          print(f"- Master: {m['loudness']['after']['input_i']} LUFS / {m['loudness']['after']['input_tp']} dBTP")
          print(f"- QC warnings: {m['qc']['warnings'] or 'none'}")
          print(f"- Cover: {m['art']['source']}")
          EOF

      - name: Carry the queue stamp out of this job
        if: steps.day.outputs.skip != 'true' && steps.make.outputs.held != 'true'
        run: |
          # anchor make stamps released_at into queue/queue.json, but the job that COMMITS
          # is a different runner with a fresh checkout, so the stamp died here and the same
          # track was offered again the next day. Ship it with the drop.
          cp queue/queue.json "build/${{ steps.day.outputs.date }}/queue.json"

      - name: Publish the release files
        if: steps.day.outputs.skip != 'true' && inputs.dry_run != true && steps.make.outputs.held != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.day.outputs.date }}
          TITLE: ${{ steps.make.outputs.title }}
        run: |
          D="build/$DATE"
          B="$(python -c "import json;print(json.load(open('$D/meta.json'))['files']['base'])")"
          FILES=("$D/$B.mp3" "$D/$B.flac" "$D/$B-short.mp4" "$D/$B-full-169.mp4" "$D/$B-full-916.mp4" "$D/$B-cover.jpg" "$D/frame-169.jpg")
          printf '%s' "$TITLE" > "$D/title.txt"
          # a long Mac job's token can be refused by the releases API (HTTP 403 "Resource not
          # accessible by integration": Window Down, Brother and Sober At The Barrier, 2026-11-08,
          # both lost after passing every check). The song is not lost any more: the pages job,
          # with a fresh token, creates the release from this job's artifact.
          if gh release view "drop-$DATE" >/dev/null 2>&1; then
            gh release upload "drop-$DATE" "${FILES[@]}" --clobber || { echo "::warning::release upload deferred to the pages job"; touch "$D/release_pending"; }
          else
            gh release create "drop-$DATE" "${FILES[@]}" --title "$TITLE · ANCHOR" \
              --notes-file "$D/release_notes.md" --target "$GITHUB_SHA" \
              || { echo "::warning::release creation deferred to the pages job"; touch "$D/release_pending"; }
          fi

      # only after the release exists, so a song whose files never reached the release page
      # never goes on to YouTube with links to nothing
      - name: Upload drop files
        if: steps.day.outputs.skip != 'true' && steps.make.outputs.held != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drop-${{ steps.day.outputs.date }}
          retention-days: 14
          path: |
            build/${{ steps.day.outputs.date }}/meta.json
            build/${{ steps.day.outputs.date }}/queue.json
            build/${{ steps.day.outputs.date }}/release_notes.md
            build/${{ steps.day.outputs.date }}/*.mp3
            build/${{ steps.day.outputs.date }}/*.flac
            build/${{ steps.day.outputs.date }}/*-short.mp4
            build/${{ steps.day.outputs.date }}/*-full-169.mp4
            build/${{ steps.day.outputs.date }}/*-full-916.mp4
            build/${{ steps.day.outputs.date }}/frame-169.jpg
            build/${{ steps.day.outputs.date }}/*-cover.jpg
            build/${{ steps.day.outputs.date }}/cover.jpg
            build/${{ steps.day.outputs.date }}/cover_600.jpg
            build/${{ steps.day.outputs.date }}/poster.jpg
            build/${{ steps.day.outputs.date }}/title.txt
            build/${{ steps.day.outputs.date }}/release_pending

  pages:
    needs: [plan, make]
    # the songs that made it go out even when another song of the day failed its checks
    if: ${{ !cancelled() && needs.plan.outputs.count != '0' && inputs.dry_run != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
      made: ${{ steps.media.outputs.made }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: drop-*
          path: drops
          run-id: ${{ needs.plan.outputs.from_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Create the releases a make job could not
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          for d in drops/drop-*; do
            DATE="${d#drops/drop-}"
            # a song an earlier render-only run made (from_run) has no release yet either
            if [ ! -f "$d/release_pending" ]; then
              [ -n "${{ needs.plan.outputs.from_run }}" ] && ! gh release view "drop-$DATE" >/dev/null 2>&1 || continue
            fi
            [ -s "$d/title.txt" ] || python3 -c "import json;print(json.load(open('$d/meta.json'))['brief']['title'], end='')" > "$d/title.txt"
            B="$(python3 -c "import json;print(json.load(open('$d/meta.json'))['files']['base'])")"
            FILES=("$d/$B.mp3" "$d/$B.flac" "$d/$B-short.mp4" "$d/$B-full-169.mp4" "$d/$B-full-916.mp4" "$d/$B-cover.jpg" "$d/frame-169.jpg")
            if gh release view "drop-$DATE" >/dev/null 2>&1; then
              gh release upload "drop-$DATE" "${FILES[@]}" --clobber
            else
              gh release create "drop-$DATE" "${FILES[@]}" --title "$(cat "$d/title.txt") · ANCHOR" \
                --notes-file "$d/release_notes.md" --target "$GITHUB_SHA"
            fi
            echo "release drop-$DATE created here for its make job"
          done

      - name: Assemble the media host (latest drops only)
        id: media
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p public/media drops
          if [ -n "${{ needs.plan.outputs.from_run }}" ] && [ -n "${{ inputs.date }}" ]; then
            for d in drops/drop-*; do
              case ",${{ inputs.date }}," in *",${d#drops/drop-},"*) ;; *) rm -rf "$d" ;; esac
            done
          fi
          MADE="$(ls drops | sed 's/^drop-//' | sort | tr '\n' ' ')"
          echo "made=$MADE" >> "$GITHUB_OUTPUT"
          [ -n "$MADE" ] || { echo "::warning::no song made it through its checks"; exit 0; }
          for d in drops/drop-*; do cp "$d"/*-short.mp4 "$d"/*-full-169.mp4 "$d"/*-full-916.mp4 public/media/; done
          # keep the previous drops online too, in case a scheduled post is still pending, but
          # only while the site stays under GitHub Pages' 1 GB (2026-11-10: 2.07 GB, deploy timed out)
          BUDGET=900000000
          size() { du -sk public | awk '{print $1 * 1024}'; }
          [ "$(size)" -le "$BUDGET" ] || echo "::warning::today's songs alone are $(( $(size) / 1000000 )) MB, over the Pages budget"
          for tag in $(gh release list --limit 10 --json tagName -q '.[].tagName' | grep '^drop-' | head -6); do
            [ -d "drops/$tag" ] && continue
            NEED="$(gh release view "$tag" --json assets -q '[.assets[] | select(.name | endswith(".mp4")) | .size] | add // 0')"
            if [ $(( $(size) + NEED )) -gt "$BUDGET" ]; then
              echo "skipping $tag ($(( NEED / 1000000 )) MB): over the Pages budget"
              continue
            fi
            gh release download "$tag" --pattern '*.mp4' --dir public/media --clobber || true
          done
          echo "media host: $(( $(size) / 1000000 )) MB"
          printf 'User-agent: *\nDisallow: /\n' > public/robots.txt
          printf '<!doctype html><meta charset="utf-8"><title>ANCHOR media</title><meta http-equiv="refresh" content="0;url=https://anchor.anchit-tandon.com/">' > public/index.html
          ls -la public/media

      - uses: actions/configure-pages@v5
        if: steps.media.outputs.made != ''

      - uses: actions/upload-pages-artifact@v3
        if: steps.media.outputs.made != ''
        with:
          path: public

      - id: deploy
        if: steps.media.outputs.made != ''
        uses: actions/deploy-pages@v4

  publish:
    needs: [plan, make, pages]
    if: ${{ !cancelled() && needs.pages.result == 'success' && needs.pages.outputs.made != '' && inputs.dry_run != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355   # up to 5.5 h waiting for the quota reset, then the uploads one after the other
    env:
      MADE: ${{ needs.pages.outputs.made }}
      PAGE_URL: ${{ needs.pages.outputs.page_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # the branch as it is NOW, not as it was when this run was queued
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: drop-*
          path: dl
          run-id: ${{ needs.plan.outputs.from_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Lay out the songs that were made
        run: |
          mkdir -p build
          for d in dl/drop-*; do mv "$d" "build/${d#dl/drop-}"; done
          ls build

      - name: Refresh earlier posts (YouTube status and links)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m anchor sync

      # Each song in turn: YouTube with the channel's own credentials (YT_*), the Short through
      # Buffer, then recorded at once so the quota check before the next song counts it.
      # Songs made between midnight UTC and the quota reset (08:00 UTC, midnight Pacific) would
      # land on a quota day the earlier runs have already spent: wait for the reset instead of
      # failing (Anchit, 2026-11-09: "complete right now" at 07:00 IST). Never waits past what
      # the job allows; a longer wait leaves the quota check below to hold the song.
      - name: Wait for the YouTube quota reset when it is minutes or hours away
        run: |
          NOW=$(date -u +%s)
          RESET=$(date -u -d "$(date -u +%F) 08:05" +%s)
          WAIT=$(( RESET - NOW ))
          if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 14400 ]; then
            echo "::notice::Waiting $(( WAIT / 60 )) min for the YouTube quota reset (08:05 UTC) before posting"
            sleep "$WAIT"
          fi

      - name: Publish each song to YouTube (full track and Short) and Instagram, and record it
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
        run: |
          : > published.txt
          for DATE in $MADE; do
            if [ "$(python -m anchor has-drop --date "$DATE")" = "yes" ]; then
              echo "::notice::$DATE is already out (a re-run); not posting it again."
              continue
            fi
            if [ "$(python -m anchor quota-ok 2>quota.txt)" != "yes" ]; then
              echo "::warning::$DATE not posted: YouTube quota $(tail -n 1 quota.txt). It is on the release page; post it after the reset."
              continue
            fi
            f() { python -c "import json,sys;print(json.load(open('build/$DATE/meta.json'))['files'][sys.argv[1]])" "$1"; }
            FULL169="$(f full_169)"; SHORT="$(f short)"; FULL916="$(f full_916)"
            FLAGS=()
            if [ -z "$BUFFER_API_KEY" ] && [ -z "$YT_REFRESH_TOKEN" ]; then
              FLAGS+=(--site-only)
              echo "::warning::neither YT_* nor BUFFER_API_KEY is set: releasing on the website only."
            fi
            [ "${{ inputs.publish_now }}" = "true" ] && FLAGS+=(--now)
            if ! python -m anchor publish --drop "build/$DATE" --media-url "${PAGE_URL%/}/media/$FULL169" \
                 --short-url "${PAGE_URL%/}/media/$SHORT" --reel-url "${PAGE_URL%/}/media/$FULL916" "${FLAGS[@]}"; then
              echo "PUBLISH_FAILED=1" >> "$GITHUB_ENV"
              echo "::error::$DATE: publishing failed on at least one platform; see publish.json in the drop artifact."
            fi
            python -m anchor record --drop "build/$DATE" --repo "$GITHUB_REPOSITORY" \
              --short-url "${PAGE_URL%/}/media/$FULL916" --run-url "$RUN_URL"
            echo "$DATE" >> published.txt
          done
          python -m anchor check

      - name: Sync the Suno catalogue (ratings + postable decisions)
        if: ${{ !cancelled() }}
        run: python -m anchor suno-sync || echo "::warning::Suno sync failed; keeping the last catalogue"

      - name: Restore the queue stamp written while rendering
        if: ${{ !cancelled() }}
        run: |
          # only a published song that came from the Suno queue carries the stamp
          [ -s published.txt ] && python -m anchor queue-stamp --drops $(cat published.txt) || true

      # also after a failure part-way through the songs: every song already posted is recorded
      - name: Commit the catalog (triggers the website deploy)
        if: ${{ !cancelled() }}
        run: |
          [ -s published.txt ] || { echo "nothing was published"; exit 0; }
          git config user.name "$ROBOT_NAME"
          git config user.email "$ROBOT_EMAIL"
          BRANCH="${GITHUB_REF_NAME:-main}"
          TITLES="$(for DATE in $(cat published.txt); do python -c "import json;print(json.load(open('build/$DATE/meta.json'))['brief']['title'])"; done | paste -sd ',' | sed 's/,/, /g')"
          for i in 1 2 3 4 5; do
            # queue too: a released song is stamped in queue/queue.json, and if that stamp
            # is not committed the next run fetches and posts the same track again
            git add site/data site/covers site/og.jpg queue
            git commit -q -m "drop: $(paste -sd ' ' published.txt) · $TITLES" || { echo "nothing to commit"; exit 0; }
            git push -q origin "HEAD:$BRANCH" && exit 0
            # the branch moved while the songs rendered (the Uploads or Sync job): never merge
            # two catalogues by hand; take the latest branch and record the songs on top of
            # it again (record is an upsert by drop id)
            echo "::notice::$BRANCH moved; recording the songs again on top of it (attempt $i)"
            sleep $((i * 5))
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            for DATE in $(cat published.txt); do
              FULL916="$(python -c "import json;print(json.load(open('build/$DATE/meta.json'))['files']['full_916'])")"
              python -m anchor record --drop "build/$DATE" --repo "$GITHUB_REPOSITORY" \
                --short-url "${PAGE_URL%/}/media/$FULL916" --run-url "$RUN_URL"
            done
            python -m anchor queue-stamp --drops $(cat published.txt) || true
          done
          exit 1

      - name: Fail the run if publishing failed (sends the GitHub alert email)
        if: env.PUBLISH_FAILED == '1'
        run: |
          echo "::error::Buffer/YouTube publish failed. The drop is on the website; see the publish step log."
          exit 1

  report-failure:
    needs: [plan, make, pages, publish]
    if: (failure() || cancelled()) && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Mark the failed run on the status page
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAGE: ${{ (needs.make.result != 'success' && needs.make.result != 'skipped') && 'make' || (needs.pages.result != 'success' && 'pages' || 'publish') }}
        run: |
          python -m anchor fail --stage "$STAGE" --error "The $STAGE stage failed. Open the run log for details." --run-url "$RUN_URL"
          git config user.name "$ROBOT_NAME"
          git config user.email "$ROBOT_EMAIL"
          git add site/data/status.json
          git commit -m "status: run failed at $STAGE" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep 5; done
