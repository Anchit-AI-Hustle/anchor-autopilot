name: CI slow suite (video renders and whole pipelines)

# The pull request check (ci.yml) runs the fast tests only, about 10 seconds. This runs the slow ones
# (the renders and the end-to-end pipeline) after every push to main, every night and on demand, one job per
# test file so they finish in parallel. A red run here is a real failure: the fast check never hides it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/data/**"
      - "site/covers/**"
      - "site/og.jpg"
      - "queue/**"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Anchit, 2026-11-09: "ensure all ci tests pass successfully always". The robot pushes to main
# several times an hour, and each push used to cancel the run in progress, so the 36 min
# pipeline test never finished (cancelled on every push since 2026-11-08 19:51). A running suite
# now always finishes; only a waiting one is replaced by the newer push.
concurrency:
  group: ci-slow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        file: [test_pipeline, test_release_v2, test_fullvideos, test_scenes, test_mix_youtube, test_art_video, test_versions, test_song_gate, test_lyriccheck, test_mixbalance]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: bash scripts/install-ffmpeg.sh
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-gate.txt
      # the whole-pipeline file is the long one (36 min on one core): it runs on all four cores
      - run: python -m pytest -q -m slow -n ${{ matrix.file == 'test_pipeline' && '4' || '0' }} --durations=8 tests/${{ matrix.file }}.py
        env:
          ANCHOR_SCENE_WORKERS: "1"     # the test files run side by side already
