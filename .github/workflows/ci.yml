name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/data/**"
      - "site/covers/**"
      - "site/og.jpg"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate artist profile and site data
        run: python -m anchor check

      - name: Check site JavaScript syntax
        run: node --check site/assets/app.js

      - name: Tests
        run: python -m pytest -q
