name: Recover covers

# One-shot repair. The ten covers already on the site were drawn one motif per visual family,
# so five rust drops came out as five orange tiles — the worst pair scored 7.8 out of 255 at
# thumbnail size. Cover art is a pure function of the drop's seed, so they can be redrawn
# from the catalogue here: no audio, no model, a couple of minutes on a free runner.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only: redraw nothing, commit nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: recover-covers
  cancel-in-progress: false

env:
  ROBOT_NAME: "Anchit Tandon"
  ROBOT_EMAIL: "anchit.tandon@gmail.com"

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Redraw every cover until no two read alike
        run: python scripts/recover_covers.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit the redrawn covers
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "$ROBOT_NAME"
          git config user.email "$ROBOT_EMAIL"
          git add site/covers site/data/catalog.json
          git commit -m "covers: redraw every drop so no two read alike" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
