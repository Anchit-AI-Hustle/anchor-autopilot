name: Duplicates (one song, one video, by the music)

# Anchit, 2026-11-10: "ensure old songs arent reuploaded again and again - carry out a complete
# duplicacy check in the videos based on the music and ensure that only unique videos and audios
# are there in the playlist and in the videos uploaded too" and "ensure duplicate ones are removed".
# 1. audio: every released master is printed and compared with every other (site/data/dupes.json).
# 2. channel: every public video is grouped by its song; each song keeps one full video and one
#    Short, every other copy of the same music is set private (never deleted, so it can come back
#    from Studio). The playlist sync then holds each song's one video only.
on:
  schedule:
    - cron: "3 8 * * *"     # 08:03 UTC: right after the YouTube quota reset, before the playlist sync
  workflow_dispatch:
    inputs:
      apply:
        description: "Set every duplicate private (never deleted)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dupes
  cancel-in-progress: false

env:
  ROBOT_NAME: "Anchit Tandon"
  ROBOT_EMAIL: "anchit.tandon@gmail.com"

jobs:
  dupes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break; sleep 30; done; command -v ffmpeg
      - run: pip install -r requirements.txt

      - name: Cache the prints of the released masters
        uses: actions/cache@v4
        with:
          path: build/dupes
          key: master-prints-${{ github.run_id }}
          restore-keys: master-prints-

      - name: Print every master and pair the same music
        run: |
          set -euo pipefail
          python -m anchor dupes audio --out build/dupes | tee audio.json
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          r = json.load(open("audio.json"))
          print(f"### Same music\n\n{r['printed']} of {r['releases']} masters printed\n")
          for p in r["audio_pairs"]:
              kind = "same record" if p["same_record"] else "sounds alike"
              print(f"- {p['duplicate_title']} = {p['of_title']} ({kind}, {p['score']})")
          EOF

      - name: Check the channel and take the duplicates off it
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "::warning::YT_* secrets are not set"; exit 0; fi
          FLAGS=()
          [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ] && FLAGS+=(--apply)
          python -m anchor dupes channel "${FLAGS[@]}" | tee channel.json
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          r = json.load(open("channel.json"))
          if r.get("skipped"):
              print("Channel check skipped: YouTube quota spent; it runs again after the reset")
          else:
              print(f"### Channel\n\n{r['public_videos']} public videos, {r['songs']} unique songs, {len(r['duplicates'])} duplicates\n")
              for d in r["duplicates"]:
                  print(f"- {d['title']} ({d['id']}, {d['kind']}): {d['why']}, keeping {d['keep']}")
              for line in (r.get("applied") or {}).get("private", []):
                  print(f"- set private: {line}")
              for line in (r.get("applied") or {}).get("errors", []):
                  print(f"- error: {line}")
          EOF

      - name: Commit the duplicate list
        if: ${{ !cancelled() }}
        run: |
          git config user.name "$ROBOT_NAME"
          git config user.email "$ROBOT_EMAIL"
          git add site/data/dupes.json
          git commit -q -m "dupes: same music across the releases" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 5)); done
          exit 1
